<script>
const CH=[{"id": "Q51", "title": "Cancer multiomics로 항암제 내성 marker를 발굴할 수 있는가?", "answer_html": "protein·phospho가 비반응/내성과 연관된 논문이 여럿이다. 근데 모아 보면 <b>각 논문이 말하는 '내성'이 서로 다르다</b> — 화학요법(Lee), anti-HER2(Jaehnig), 자궁경부 CCRT(Sambath), 폐선암 subtype(Song), 방광암(Holt). 같은 '내성 marker'라는 말 아래 암종·약제·시점·분자가 섞여 비교가 안 된다. 그래서 답을 내기 전에 시점·분자·맥락 다섯 차원으로 쪼갰다.", "synthesis": "다섯 암종/약제 논문을 나란히 정독하면 '내성'의 지시 대상이 제각각이다: Lee=화학요법 baseline 비반응, Jaehnig=anti-HER2 저항, Sambath=CCRT 저항, Holt=방광암 잔존병변, Song=subtype별 치료반응. 한 단어로 묶으면 'A vs B' 비교 자체가 불가능해진다 → 답 대신 단어를 시점·분자·맥락으로 쪼개는 게 첫 산물이 됐다.", "cites": [{"label": "Lee 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/lee-2026-proteogenomic-decoding-chemotherapy-resistance-tnbc", "note": "연세·세브란스 stage II–III TNBC 50명을 NAC(주로 AC→paclitaxel) <b>치료 전</b> 종양에서 WGS·proteome·phospho로 전향 프로파일(pCR 19/50=38%, progression 12%). 치료 전 protein·phospho 신호가 화학요법 비반응과 연관됨을 디코딩 → \"단백체로 marker 발굴이 된다\"의 직접 근거. 단 전부 baseline(치료 전)."}, {"label": "Jaehnig 2025", "url": "https://hejeong1219.github.io/paperatlas/sources/jaehnig-2025-proteogenomic-analysis-calgb-40601-alliance", "note": "CALGB 40601 무작위 HER2+ 유방암(TH/TL/THL) 치료 전 biopsy 80개/54명 QC통과를 DNA·RNA·proteome·phospho로 재분석. ERBB2 단백·인산화 ladder가 non-pCR과 연관. 특히 4명/6샘플은 ERBB2 증폭 없는 <b>가짜 HER2+</b>인데 pCR 없음 — 단백·인산화가 유전체가 놓친 저항을 잡음."}, {"label": "Sambath 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/sambath-2026-integrated-genomic-proteomic-cervical-cancer-chemoradiation-resistance", "note": "인도 자궁경부암 36명(stage IIIB squamous HPV+, CCRT=cisplatin+방사선) WGS/WES + 10명 TMT proteome(5 sensitive+5 resistant). <b>TMB sensitive 8.5 vs resistant 4.25(P=0.09 비유의)</b> → 유전체만으론 내성 예측 약함. 단백체 sensitive↔resistant 비교로 또 다른 \"내성\"(CCRT)을 더함."}, {"label": "Song 2024", "url": "https://hejeong1219.github.io/paperatlas/sources/song-2024-proteogenomic-analysis-reveals-non-small-cell", "note": "한국인 NSCLC 229명(Asan, 수술, adjuvant 48%)을 WES·RNA·TMT proteo/phospho/acetylome로 — NMF로 5개 proteogenomic subtype. <b>인산화-heavy subtype</b> 구조가 whole-genome doubling·PI3K-Akt·면역과 연결되고 adjuvant 치료 benefit과 연관 — subtype→치료반응 결 + 인산화가 별도 차원임을 보임."}, {"label": "Holt 2025", "url": "https://hejeong1219.github.io/paperatlas/sources/holt-2025-proteogenomic-characterization-unveils-biomarkers-associated", "note": "근육침윤 방광암 143→proteogenomic 코호트. 민감=≤pT1N0 downstaging, 내성=residual pT2-4/node+로 정의. 11,596 protein·11,799 phosphosite 정량. 내성 신호가 <b>주로 단백질 수준</b>(DDR + GSK3B 인산화)에서 보이고 chemoresistance가 OS와 유의 연관 — protein·phospho 둘 다 marker 가능을 실증."}]}, {"id": "Q52", "title": "단백체·인산화로 내성 marker를 발굴할 수 있는가?", "answer_html": "가능하다 — 여러 코호트에서 치료 전 protein·phospho가 비반응과 연관됨이 재현된다. <b>다만 경계: 이들이 다루는 내성은 거의 전부 baseline(치료 전 비반응)</b>이라 치료 후 생기는 내성은 못 본다.", "synthesis": "Lee·Anurag(TNBC)·Holt(방광암)·Jaehnig(HER2)·Sambath(자궁경부)의 marker를 모으면 강력하지만, 정독하면 데이터가 전부 <b>치료 전 또는 sensitive vs resistant snapshot</b>이다. 즉 '발굴 가능'은 참이되 그 발굴은 baseline에 한정 — 이 경계가 다음 질문(획득내성)을 부른다.", "cites": [{"label": "Lee 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/lee-2026-proteogenomic-decoding-chemotherapy-resistance-tnbc", "note": "연세·세브란스 stage II–III TNBC 50명을 NAC(주로 AC→paclitaxel) <b>치료 전</b> 종양에서 WGS·proteome·phospho로 전향 프로파일(pCR 19/50=38%, progression 12%). 치료 전 protein·phospho 신호가 화학요법 비반응과 연관됨을 디코딩 → \"단백체로 marker 발굴이 된다\"의 직접 근거. 단 전부 baseline(치료 전)."}, {"label": "Anurag 2022", "url": "https://hejeong1219.github.io/paperatlas/sources/anurag-2022-proteogenomic-markers-chemotherapy-resistance-response", "note": "치료 전 TNBC 59명(neoadjuvant carboplatin+docetaxel; pCR 22 vs non-pCR 37)을 WES(~100x)·RNA·TMT(11,063 protein·26,919 phosphosite)로 microscaled proteogenomics. pCR/RCB에 연관된 pathway·단백 program을 <b>baseline</b>에서 식별."}, {"label": "Holt 2025", "url": "https://hejeong1219.github.io/paperatlas/sources/holt-2025-proteogenomic-characterization-unveils-biomarkers-associated", "note": "근육침윤 방광암 143→proteogenomic 코호트. 민감=≤pT1N0 downstaging, 내성=residual pT2-4/node+로 정의. 11,596 protein·11,799 phosphosite 정량. 내성 신호가 <b>주로 단백질 수준</b>(DDR + GSK3B 인산화)에서 보이고 chemoresistance가 OS와 유의 연관 — protein·phospho 둘 다 marker 가능을 실증."}, {"label": "Jaehnig 2025", "url": "https://hejeong1219.github.io/paperatlas/sources/jaehnig-2025-proteogenomic-analysis-calgb-40601-alliance", "note": "CALGB 40601 무작위 HER2+ 유방암(TH/TL/THL) 치료 전 biopsy 80개/54명 QC통과를 DNA·RNA·proteome·phospho로 재분석. ERBB2 단백·인산화 ladder가 non-pCR과 연관. 특히 4명/6샘플은 ERBB2 증폭 없는 <b>가짜 HER2+</b>인데 pCR 없음 — 단백·인산화가 유전체가 놓친 저항을 잡음."}, {"label": "Sambath 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/sambath-2026-integrated-genomic-proteomic-cervical-cancer-chemoradiation-resistance", "note": "인도 자궁경부암 36명(stage IIIB squamous HPV+, CCRT=cisplatin+방사선) WGS/WES + 10명 TMT proteome(5 sensitive+5 resistant). <b>TMB sensitive 8.5 vs resistant 4.25(P=0.09 비유의)</b> → 유전체만으론 내성 예측 약함. 단백체 sensitive↔resistant 비교로 또 다른 \"내성\"(CCRT)을 더함."}]}, {"id": "Q53", "title": "치료 후 형성되는 (획득) 내성은 어떻게 잡나?", "answer_html": "여기서 <b>경계가 분명해진다.</b> 획득내성의 환자 단백체·인산화 증거가 거의 없다 — 대개 ctDNA(시점만)이거나 세포·PDX 모델이다.", "synthesis": "Chmielecki는 osimertinib 획득내성 환자의 65%가 plasma로도 설명 안 되고(단백체 0), Yaeger는 serial ctDNA로 ERK 수렴은 보이나 역시 단백체 없음, Hsu·Solanki는 단백체/인산화는 있으나 세포·PDX다. 넷을 합치면 <b>'획득내성을 환자에서 단백체로 본' 칸이 사실상 비어 있다</b>는 게 핵심.", "cites": [{"label": "Chmielecki 2023", "url": "https://hejeong1219.github.io/paperatlas/sources/chmielecki-2023-acquired-resistance-first-line-osimertinib", "note": "FLAURA(1차 osimertinib, EGFR-mut NSCLC 556명) 획득내성 plasma 분석. paired plasma에서 <b>osimertinib군 109명 중 38명(35%)만 MET 증폭·EGFR C797S 등 기전 검출, 65%(71명)는 plasma로 설명 안 됨.</b> 시점은 잡으나 <b>환자 단백체가 없음</b>."}, {"label": "Yaeger 2023", "url": "https://hejeong1219.github.io/paperatlas/sources/yaeger-2023-molecular-characterization-acquired-resistance-krasg12c-egfr", "note": "대장암 12명(adagrasib+cetuximab 등) serial ctDNA(4명은 6주마다)로 KRASG12C+EGFR 억제 획득내성 추적 — KRASG12C 증폭·KRAS 2차변이·NRAS Q61·BRAF로 이질적이나 <b>ERK 억제 실패로 수렴</b>. serial ctDNA로 시점은 강하나 환자 단백체 부재."}, {"label": "Hsu 2025", "url": "https://hejeong1219.github.io/paperatlas/sources/hsu-2025-phosphoproteomics-osimertinib-tolerant-persister-cells-reveals", "note": "PC9(EGFR exon19 del) NSCLC 세포를 osimertinib 처리해 acute→DTP→recovery를 DIA-MS(조건당 ~5,200 protein·~21,500 phosphopeptide)로 매핑. PCA에서 DTP가 PC1(52.3%) 주도. DTP 내성 상태를 <b>CDK1 substrate·YAP1·mTOR·BAD 인산화 = kinase 경로 활성</b>으로 정의 — phospho가 \"경로가 켜졌는가\"를 읽음. 단 세포모델."}, {"label": "Solanki 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/solanki-2026-ras-gtp-inhibition-overcomes-acquired-resistance", "note": "KRASG12C 억제제 내성 NSCLC 모델(cell·xenograft·PDX)을 WES·RNA·TMT phospho·pY·KSEA·RAS-GTP pulldown으로 — 내성이 <b>세 상태로 갈라짐</b>: ① RAS 변이(KRASG12C 증폭/NRAS G13R) ② RTK 상향+RAS-GTP 재활성(non-genomic) ③ EMT RAS-비의존. <b>결정적: 여러 내성 모델에서 WES는 RAS/MAPK 변이를 못 찾고 RNA·phospho만 잡아냄</b> → \"유전체로 설명 안 되는 내성 상태\"가 실재함을 직접 증명."}]}, {"id": "Q54", "title": "proteome와 phospho는 같은 내성을 보는가?", "answer_html": "<b>아니다 — 독립적인 두 readout이다.</b> 발현량은 '얼마나 많은가', 인산화는 'kinase 경로가 켜졌는가'를 읽어 같은 marker라도 다른 상태를 가리킨다.", "synthesis": "Hsu는 DTP 내성을 CDK1·YAP1·mTOR·BAD <b>인산화(활성)</b>로 정의하고, Holt는 방광암 내성을 주로 <b>단백질 발현량</b>(DDR)으로 잡으며, Song은 인산화-heavy subtype이 별도 축임을 보인다. 셋을 대조하면 두 층이 다른 정보를 담으므로, marker를 쓸 때 '발현량 marker인지 활성 marker인지'를 먼저 구분해야 한다는 결론.", "cites": [{"label": "Hsu 2025", "url": "https://hejeong1219.github.io/paperatlas/sources/hsu-2025-phosphoproteomics-osimertinib-tolerant-persister-cells-reveals", "note": "PC9(EGFR exon19 del) NSCLC 세포를 osimertinib 처리해 acute→DTP→recovery를 DIA-MS(조건당 ~5,200 protein·~21,500 phosphopeptide)로 매핑. PCA에서 DTP가 PC1(52.3%) 주도. DTP 내성 상태를 <b>CDK1 substrate·YAP1·mTOR·BAD 인산화 = kinase 경로 활성</b>으로 정의 — phospho가 \"경로가 켜졌는가\"를 읽음. 단 세포모델."}, {"label": "Holt 2025", "url": "https://hejeong1219.github.io/paperatlas/sources/holt-2025-proteogenomic-characterization-unveils-biomarkers-associated", "note": "근육침윤 방광암 143→proteogenomic 코호트. 민감=≤pT1N0 downstaging, 내성=residual pT2-4/node+로 정의. 11,596 protein·11,799 phosphosite 정량. 내성 신호가 <b>주로 단백질 수준</b>(DDR + GSK3B 인산화)에서 보이고 chemoresistance가 OS와 유의 연관 — protein·phospho 둘 다 marker 가능을 실증."}, {"label": "Song 2024", "url": "https://hejeong1219.github.io/paperatlas/sources/song-2024-proteogenomic-analysis-reveals-non-small-cell", "note": "한국인 NSCLC 229명(Asan, 수술, adjuvant 48%)을 WES·RNA·TMT proteo/phospho/acetylome로 — NMF로 5개 proteogenomic subtype. <b>인산화-heavy subtype</b> 구조가 whole-genome doubling·PI3K-Akt·면역과 연결되고 adjuvant 치료 benefit과 연관 — subtype→치료반응 결 + 인산화가 별도 차원임을 보임."}]}, {"id": "Q55", "title": "내성 marker로 규정할 근거 조건은?", "answer_html": "timing · endpoint · molecular unit · direction · validation tier 다섯 조건으로 정리된다. <b>그러자 진짜 gap이 드러난다: primary/acquired/adaptive/refractory 상태를 부를 '공통 어휘'가 없다.</b>", "synthesis": "Holt(matched pre/post·isoform)는 timing·unit이 의미를 바꿈을, Hsu(site vs 활성)는 molecular unit 규정이 필요함을, Sambath(sensitive vs resistant)는 endpoint·direction을, Jaehnig(재현가능 marker)는 validation tier를 각각 보여준다. 이걸 5조건으로 묶고 나니, <b>상태별로 부를 표준 어휘가 없어 같은 marker가 논문마다 다른 의미로 쓰임</b>이 노출 — 핵심 gap.", "cites": [{"label": "Holt 2025", "url": "https://hejeong1219.github.io/paperatlas/sources/holt-2025-proteogenomic-characterization-unveils-biomarkers-associated", "note": "근육침윤 방광암 143→proteogenomic 코호트. 민감=≤pT1N0 downstaging, 내성=residual pT2-4/node+로 정의. 11,596 protein·11,799 phosphosite 정량. 내성 신호가 <b>주로 단백질 수준</b>(DDR + GSK3B 인산화)에서 보이고 chemoresistance가 OS와 유의 연관 — protein·phospho 둘 다 marker 가능을 실증."}, {"label": "Hsu 2025", "url": "https://hejeong1219.github.io/paperatlas/sources/hsu-2025-phosphoproteomics-osimertinib-tolerant-persister-cells-reveals", "note": "PC9(EGFR exon19 del) NSCLC 세포를 osimertinib 처리해 acute→DTP→recovery를 DIA-MS(조건당 ~5,200 protein·~21,500 phosphopeptide)로 매핑. PCA에서 DTP가 PC1(52.3%) 주도. DTP 내성 상태를 <b>CDK1 substrate·YAP1·mTOR·BAD 인산화 = kinase 경로 활성</b>으로 정의 — phospho가 \"경로가 켜졌는가\"를 읽음. 단 세포모델."}, {"label": "Sambath 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/sambath-2026-integrated-genomic-proteomic-cervical-cancer-chemoradiation-resistance", "note": "인도 자궁경부암 36명(stage IIIB squamous HPV+, CCRT=cisplatin+방사선) WGS/WES + 10명 TMT proteome(5 sensitive+5 resistant). <b>TMB sensitive 8.5 vs resistant 4.25(P=0.09 비유의)</b> → 유전체만으론 내성 예측 약함. 단백체 sensitive↔resistant 비교로 또 다른 \"내성\"(CCRT)을 더함."}, {"label": "Jaehnig 2025", "url": "https://hejeong1219.github.io/paperatlas/sources/jaehnig-2025-proteogenomic-analysis-calgb-40601-alliance", "note": "CALGB 40601 무작위 HER2+ 유방암(TH/TL/THL) 치료 전 biopsy 80개/54명 QC통과를 DNA·RNA·proteome·phospho로 재분석. ERBB2 단백·인산화 ladder가 non-pCR과 연관. 특히 4명/6샘플은 ERBB2 증폭 없는 <b>가짜 HER2+</b>인데 pCR 없음 — 단백·인산화가 유전체가 놓친 저항을 잡음."}]}, {"id": "Q56", "title": "유전체로 설명 안 되는 내성을 functional resistance state로 재분류할 수 있는가?", "answer_html": "좁혀온 연구질문. 핵심 전환은 <b>'marker를 더 찾자(layer 쌓기)' → '그 marker가 무슨 내성-상태인지부터 구분하자(state 해석)'</b>다. 데이터는 풍부(CPTAC 등)하나 marker의 상태 라벨이 없어, 유전체로 설명 안 되는 내성을 재현가능한 kinase-activity state로 재분류할 수 있는지를 묻는다.", "synthesis": "결정적 근거는 Solanki다: 같은 KRASG12C 획득내성이 <b>genomic(RAS재활성)과 non-genomic(RTK/EMT) 상태로 갈라지고, 여러 모델에서 WES는 그 내성을 못 잡고 phospho만 잡았다</b> — 'genome으로 설명 안 되는 내성 상태'가 실재함을 직접 증명. 여기에 Lee(상태 라벨 없는 marker 다수)·Hsu(유전체로 안 잡히는 활성 상태)를 합치면, 문제는 데이터 부족이 아니라 '해석 틀' 부재다. ※ 이 추론 전체가 ~10편에 기댄다는 것 자체가, 내성-상태를 본 환자 증거가 그만큼 적다는 뜻 → 희소성이 gap을 뒷받침.", "cites": [{"label": "Solanki 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/solanki-2026-ras-gtp-inhibition-overcomes-acquired-resistance", "note": "KRASG12C 억제제 내성 NSCLC 모델(cell·xenograft·PDX)을 WES·RNA·TMT phospho·pY·KSEA·RAS-GTP pulldown으로 — 내성이 <b>세 상태로 갈라짐</b>: ① RAS 변이(KRASG12C 증폭/NRAS G13R) ② RTK 상향+RAS-GTP 재활성(non-genomic) ③ EMT RAS-비의존. <b>결정적: 여러 내성 모델에서 WES는 RAS/MAPK 변이를 못 찾고 RNA·phospho만 잡아냄</b> → \"유전체로 설명 안 되는 내성 상태\"가 실재함을 직접 증명."}, {"label": "Lee 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/lee-2026-proteogenomic-decoding-chemotherapy-resistance-tnbc", "note": "연세·세브란스 stage II–III TNBC 50명을 NAC(주로 AC→paclitaxel) <b>치료 전</b> 종양에서 WGS·proteome·phospho로 전향 프로파일(pCR 19/50=38%, progression 12%). 치료 전 protein·phospho 신호가 화학요법 비반응과 연관됨을 디코딩 → \"단백체로 marker 발굴이 된다\"의 직접 근거. 단 전부 baseline(치료 전)."}, {"label": "Hsu 2025", "url": "https://hejeong1219.github.io/paperatlas/sources/hsu-2025-phosphoproteomics-osimertinib-tolerant-persister-cells-reveals", "note": "PC9(EGFR exon19 del) NSCLC 세포를 osimertinib 처리해 acute→DTP→recovery를 DIA-MS(조건당 ~5,200 protein·~21,500 phosphopeptide)로 매핑. PCA에서 DTP가 PC1(52.3%) 주도. DTP 내성 상태를 <b>CDK1 substrate·YAP1·mTOR·BAD 인산화 = kinase 경로 활성</b>으로 정의 — phospho가 \"경로가 켜졌는가\"를 읽음. 단 세포모델."}]}];
const byId={}; CH.forEach(q=>byId[q.id]=q);
function pick(){let m=location.search.match(/q=([A-Za-z0-9]+)/);return (m&&byId[m[1]])?m[1]:CH[0].id;}
function render(id){
 let q=byId[id]; if(!q)return;
 document.getElementById('qid').textContent=q.id;
 document.getElementById('qtitle').textContent=q.title;
 document.getElementById('ev').innerHTML=(q.cites||[]).map(c=>
   '<div class="ev"><a href="'+c.url+'" target="_blank">'+c.label+' →</a>'+(c.note?'<div class="note">'+c.note+'</div>':'')+'</div>').join('')
   || '<div class="note" style="color:#8a8170">이 질문은 특정 논문 근거가 아니라 단어를 쪼개는 단계다.</div>';
 document.getElementById('syn').innerHTML=q.synthesis||'';
 document.getElementById('ans').innerHTML=q.answer_html||'';
 document.getElementById('nav').innerHTML=CH.map(x=>'<a class="'+(x.id===id?'cur':'')+'" href="?q='+x.id+'">'+x.id+'</a>').join('');
 document.title=q.id+' · '+q.title.slice(0,30);
}
render(pick());
</script></body></html>
