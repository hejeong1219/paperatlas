<script>
const CH=[{"id": "Q51", "title": "Cancer multiomics로 항암제 내성 marker를 발굴할 수 있는가?", "answer_html": "protein·phospho가 비반응/내성과 연관된 논문이 여럿이나, 각 논문이 다루는 '내성'이 서로 다르다 — 화학요법(Lee), anti-HER2(Jaehnig), CCRT(Sambath), TKI(Zhang), subtype별 반응(Song), 잔존병변(Holt). '내성 marker'는 시점(baseline·acquired·adaptive·refractory)과 분자(발현량 vs 활성)가 섞인 복합 개념이다.", "synthesis": "여섯 논문의 '내성'은 암종·약제·시점이 모두 다르다. 한 단어 '내성 marker'로는 이들을 같은 기준에서 비교할 수 없다. 따라서 이 말은 시점·분자·세포맥락·약제·근거수준으로 분해해야 비교가 가능하다.", "cites": [{"label": "Lee 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/lee-2026-proteogenomic-decoding-chemotherapy-resistance-tnbc", "note": "연세·세브란스 stage II–III TNBC 50명을 NAC(주로 AC→paclitaxel) <b>치료 전</b> 종양에서 WGS·proteome·phospho로 전향 프로파일(pCR 19/50=38%, progression 12%). 치료 전 protein·phospho 신호가 화학요법 비반응과 연관됨을 디코딩 → \"단백체로 marker 발굴이 된다\"의 직접 근거. 단 전부 baseline(치료 전)."}, {"label": "Jaehnig 2025", "url": "https://hejeong1219.github.io/paperatlas/sources/jaehnig-2025-proteogenomic-analysis-calgb-40601-alliance", "note": "CALGB 40601 무작위 HER2+ 유방암(TH/TL/THL) 치료 전 biopsy 80개/54명 QC통과를 DNA·RNA·proteome·phospho로 재분석. ERBB2 단백·인산화 ladder가 non-pCR과 연관. 특히 4명/6샘플은 ERBB2 증폭 없는 <b>가짜 HER2+</b>인데 pCR 없음 — 단백·인산화가 유전체가 놓친 저항을 잡음."}, {"label": "Sambath 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/sambath-2026-integrated-genomic-proteomic-cervical-cancer-chemoradiation-resistance", "note": "인도 자궁경부암 36명(stage IIIB squamous HPV+, CCRT=cisplatin+방사선) WGS/WES + 10명 TMT proteome(5 sensitive+5 resistant). <b>TMB sensitive 8.5 vs resistant 4.25(P=0.09 비유의)</b> → 유전체만으론 내성 예측 약함. 단백체 sensitive↔resistant 비교로 또 다른 \"내성\"(CCRT)을 더함."}, {"label": "Song 2024", "url": "https://hejeong1219.github.io/paperatlas/sources/song-2024-proteogenomic-analysis-reveals-non-small-cell", "note": "한국인 NSCLC 229명(Asan, 수술, adjuvant 48%)을 WES·RNA·TMT proteo/phospho/acetylome로 — NMF로 5개 proteogenomic subtype. <b>인산화-heavy subtype</b> 구조가 whole-genome doubling·PI3K-Akt·면역과 연결되고 adjuvant 치료 benefit과 연관 — subtype→치료반응 결 + 인산화가 별도 차원임을 보임."}, {"label": "Holt 2025", "url": "https://hejeong1219.github.io/paperatlas/sources/holt-2025-proteogenomic-characterization-unveils-biomarkers-associated", "note": "근육침윤 방광암 143→proteogenomic 코호트. 민감=≤pT1N0 downstaging, 내성=residual pT2-4/node+로 정의. 11,596 protein·11,799 phosphosite 정량. 내성 신호가 <b>주로 단백질 수준</b>(DDR + GSK3B 인산화)에서 보이고 chemoresistance가 OS와 유의 연관 — protein·phospho 둘 다 marker 가능을 실증."}, {"label": "Zhang 2023", "url": "https://hejeong1219.github.io/paperatlas/sources/zhang-2023-proteogenomics-clear-cell-renal-response-tyrosine-kinase-inhibitor", "note": "신장암(ccRCC) Sunitinib(TKI) 반응 proteogenomic — TKI 내성이라는 또 다른 결(7q gain→mTOR 축)."}]}, {"id": "Q52", "title": "단백체·인산화로 내성 marker를 발굴할 수 있는가?", "answer_html": "치료 전 종양에서 protein·phospho가 비반응과 연관됨이 여러 코호트에서 재현된다. 다만 이들 데이터는 거의 전부 baseline(치료 전)이라, 치료 후 형성되는 내성은 다루지 않는다.", "synthesis": "Lee·Anurag(TNBC)·Holt(방광암)·Jaehnig(HER2)·Sambath(자궁경부)는 모두 치료 전 또는 sensitive/resistant snapshot 데이터다. '단백체로 marker 발굴 가능'은 성립하되, 그 범위는 baseline에 한정된다.", "cites": [{"label": "Lee 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/lee-2026-proteogenomic-decoding-chemotherapy-resistance-tnbc", "note": "연세·세브란스 stage II–III TNBC 50명을 NAC(주로 AC→paclitaxel) <b>치료 전</b> 종양에서 WGS·proteome·phospho로 전향 프로파일(pCR 19/50=38%, progression 12%). 치료 전 protein·phospho 신호가 화학요법 비반응과 연관됨을 디코딩 → \"단백체로 marker 발굴이 된다\"의 직접 근거. 단 전부 baseline(치료 전)."}, {"label": "Anurag 2022", "url": "https://hejeong1219.github.io/paperatlas/sources/anurag-2022-proteogenomic-markers-chemotherapy-resistance-response", "note": "치료 전 TNBC 59명(neoadjuvant carboplatin+docetaxel; pCR 22 vs non-pCR 37)을 WES(~100x)·RNA·TMT(11,063 protein·26,919 phosphosite)로 microscaled proteogenomics. pCR/RCB에 연관된 pathway·단백 program을 <b>baseline</b>에서 식별."}, {"label": "Holt 2025", "url": "https://hejeong1219.github.io/paperatlas/sources/holt-2025-proteogenomic-characterization-unveils-biomarkers-associated", "note": "근육침윤 방광암 143→proteogenomic 코호트. 민감=≤pT1N0 downstaging, 내성=residual pT2-4/node+로 정의. 11,596 protein·11,799 phosphosite 정량. 내성 신호가 <b>주로 단백질 수준</b>(DDR + GSK3B 인산화)에서 보이고 chemoresistance가 OS와 유의 연관 — protein·phospho 둘 다 marker 가능을 실증."}, {"label": "Jaehnig 2025", "url": "https://hejeong1219.github.io/paperatlas/sources/jaehnig-2025-proteogenomic-analysis-calgb-40601-alliance", "note": "CALGB 40601 무작위 HER2+ 유방암(TH/TL/THL) 치료 전 biopsy 80개/54명 QC통과를 DNA·RNA·proteome·phospho로 재분석. ERBB2 단백·인산화 ladder가 non-pCR과 연관. 특히 4명/6샘플은 ERBB2 증폭 없는 <b>가짜 HER2+</b>인데 pCR 없음 — 단백·인산화가 유전체가 놓친 저항을 잡음."}, {"label": "Sambath 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/sambath-2026-integrated-genomic-proteomic-cervical-cancer-chemoradiation-resistance", "note": "인도 자궁경부암 36명(stage IIIB squamous HPV+, CCRT=cisplatin+방사선) WGS/WES + 10명 TMT proteome(5 sensitive+5 resistant). <b>TMB sensitive 8.5 vs resistant 4.25(P=0.09 비유의)</b> → 유전체만으론 내성 예측 약함. 단백체 sensitive↔resistant 비교로 또 다른 \"내성\"(CCRT)을 더함."}]}, {"id": "Q53", "title": "치료 후 형성되는 (획득) 내성은 어떻게 잡나?", "answer_html": "획득내성의 환자 단백체·인산화 증거는 드물다 — 대개 ctDNA(시점만)이거나 세포·PDX 모델이다.", "synthesis": "Chmielecki는 osimertinib 획득내성 환자의 65%가 plasma로도 설명되지 않고 단백체가 없으며, Yaeger는 serial ctDNA만, Hsu·Solanki는 세포·PDX, Wei는 흑색종 ICB longitudinal(spatial/immune 중심)이다. 환자에서 proteome/phospho로 획득내성을 본 데이터는 거의 없다.", "cites": [{"label": "Chmielecki 2023", "url": "https://hejeong1219.github.io/paperatlas/sources/chmielecki-2023-acquired-resistance-first-line-osimertinib", "note": "FLAURA(1차 osimertinib, EGFR-mut NSCLC 556명) 획득내성 plasma 분석. paired plasma에서 <b>osimertinib군 109명 중 38명(35%)만 MET 증폭·EGFR C797S 등 기전 검출, 65%(71명)는 plasma로 설명 안 됨.</b> 시점은 잡으나 <b>환자 단백체가 없음</b>."}, {"label": "Yaeger 2023", "url": "https://hejeong1219.github.io/paperatlas/sources/yaeger-2023-molecular-characterization-acquired-resistance-krasg12c-egfr", "note": "대장암 12명(adagrasib+cetuximab 등) serial ctDNA(4명은 6주마다)로 KRASG12C+EGFR 억제 획득내성 추적 — KRASG12C 증폭·KRAS 2차변이·NRAS Q61·BRAF로 이질적이나 <b>ERK 억제 실패로 수렴</b>. serial ctDNA로 시점은 강하나 환자 단백체 부재."}, {"label": "Hsu 2025", "url": "https://hejeong1219.github.io/paperatlas/sources/hsu-2025-phosphoproteomics-osimertinib-tolerant-persister-cells-reveals", "note": "PC9(EGFR exon19 del) NSCLC 세포를 osimertinib 처리해 acute→DTP→recovery를 DIA-MS(조건당 ~5,200 protein·~21,500 phosphopeptide)로 매핑. PCA에서 DTP가 PC1(52.3%) 주도. DTP 내성 상태를 <b>CDK1 substrate·YAP1·mTOR·BAD 인산화 = kinase 경로 활성</b>으로 정의 — phospho가 \"경로가 켜졌는가\"를 읽음. 단 세포모델."}, {"label": "Solanki 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/solanki-2026-ras-gtp-inhibition-overcomes-acquired-resistance", "note": "KRASG12C 억제제 내성 NSCLC 모델(cell·xenograft·PDX)을 WES·RNA·TMT phospho·pY·KSEA·RAS-GTP pulldown으로 — 내성이 <b>세 상태로 갈라짐</b>: ① RAS 변이(KRASG12C 증폭/NRAS G13R) ② RTK 상향+RAS-GTP 재활성(non-genomic) ③ EMT RAS-비의존. <b>결정적: 여러 내성 모델에서 WES는 RAS/MAPK 변이를 못 찾고 RNA·phospho만 잡아냄</b> → \"유전체로 설명 안 되는 내성 상태\"가 실재함을 직접 증명."}, {"label": "Wei 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/wei-2026-longitudinal-multi-omic-atlas-reveals-emergence", "note": "흑색종 면역관문억제(ICB) 내성을 10명·45샘플 <b>longitudinal multi-omic+spatial atlas</b>(Cell Rep Med 2026)로 — 내성이 공간적 면역억제 생태계(B7-H3/IDO1 niche, PI3K-mTOR subclone)로 수렴. same-patient 획득 환자 증거가 등장 중(단 ICB·spatial 중심이라 proteome marker와는 결이 다름)."}]}, {"id": "Q54", "title": "proteome와 phospho는 같은 내성을 보는가?", "answer_html": "발현량과 인산화 활성은 독립적인 두 readout이다. 발현량은 단백질의 양을, 인산화는 kinase 경로의 활성 여부를 측정한다.", "synthesis": "Zhang에서 sunitinib 표적 RTK 발현량은 반응을 가르지 못했으나 KSEA kinase 활성(mTOR/MAP2K1)은 갈랐다. Hsu는 DTP 내성을 인산화 활성으로, Holt는 단백질 발현량으로 정의한다. 두 층은 서로 다른 정보를 담는다.", "cites": [{"label": "Zhang 2023", "url": "https://hejeong1219.github.io/paperatlas/sources/zhang-2023-proteogenomics-clear-cell-renal-response-tyrosine-kinase-inhibitor", "note": "신장암 115명 Sunitinib 반응(responder 27 vs non 88). <b>결정적: sunitinib 표적 RTK 발현량은 responder/non을 못 가르는데, KSEA는 non-responder에서 mTOR·MAP2K1 활성을 지목</b>(7q gain→mTOR, cis 단백 LAMTOR4/MDH2/CALU가 pS6K↑). \"표적 양\"이 아니라 \"kinase 활성\"이 반응을 설명 — 발현량≠활성의 교과서적 예."}, {"label": "Hsu 2025", "url": "https://hejeong1219.github.io/paperatlas/sources/hsu-2025-phosphoproteomics-osimertinib-tolerant-persister-cells-reveals", "note": "PC9(EGFR exon19 del) NSCLC 세포를 osimertinib 처리해 acute→DTP→recovery를 DIA-MS(조건당 ~5,200 protein·~21,500 phosphopeptide)로 매핑. PCA에서 DTP가 PC1(52.3%) 주도. DTP 내성 상태를 <b>CDK1 substrate·YAP1·mTOR·BAD 인산화 = kinase 경로 활성</b>으로 정의 — phospho가 \"경로가 켜졌는가\"를 읽음. 단 세포모델."}, {"label": "Holt 2025", "url": "https://hejeong1219.github.io/paperatlas/sources/holt-2025-proteogenomic-characterization-unveils-biomarkers-associated", "note": "근육침윤 방광암 143→proteogenomic 코호트. 민감=≤pT1N0 downstaging, 내성=residual pT2-4/node+로 정의. 11,596 protein·11,799 phosphosite 정량. 내성 신호가 <b>주로 단백질 수준</b>(DDR + GSK3B 인산화)에서 보이고 chemoresistance가 OS와 유의 연관 — protein·phospho 둘 다 marker 가능을 실증."}, {"label": "Song 2024", "url": "https://hejeong1219.github.io/paperatlas/sources/song-2024-proteogenomic-analysis-reveals-non-small-cell", "note": "한국인 NSCLC 229명(Asan, 수술, adjuvant 48%)을 WES·RNA·TMT proteo/phospho/acetylome로 — NMF로 5개 proteogenomic subtype. <b>인산화-heavy subtype</b> 구조가 whole-genome doubling·PI3K-Akt·면역과 연결되고 adjuvant 치료 benefit과 연관 — subtype→치료반응 결 + 인산화가 별도 차원임을 보임."}]}, {"id": "Q55", "title": "내성 marker로 규정할 근거 조건은?", "answer_html": "내성 marker 규정에는 timing·endpoint·molecular unit·direction·validation tier 다섯 조건이 필요하다. 그러나 상태별(primary/acquired/adaptive/refractory) 공통 분류 어휘가 없어 같은 marker가 논문마다 다른 의미로 쓰인다.", "synthesis": "Holt는 시점·isoform이 의미를 바꿈을, Hsu는 molecular unit(site vs 활성) 규정 필요를, Sambath는 endpoint·direction을, Jaehnig는 validation tier를 보여준다. 다섯 조건으로 묶으면 상태별 표준 어휘의 부재가 드러난다.", "cites": [{"label": "Holt 2025", "url": "https://hejeong1219.github.io/paperatlas/sources/holt-2025-proteogenomic-characterization-unveils-biomarkers-associated", "note": "근육침윤 방광암 143→proteogenomic 코호트. 민감=≤pT1N0 downstaging, 내성=residual pT2-4/node+로 정의. 11,596 protein·11,799 phosphosite 정량. 내성 신호가 <b>주로 단백질 수준</b>(DDR + GSK3B 인산화)에서 보이고 chemoresistance가 OS와 유의 연관 — protein·phospho 둘 다 marker 가능을 실증."}, {"label": "Hsu 2025", "url": "https://hejeong1219.github.io/paperatlas/sources/hsu-2025-phosphoproteomics-osimertinib-tolerant-persister-cells-reveals", "note": "PC9(EGFR exon19 del) NSCLC 세포를 osimertinib 처리해 acute→DTP→recovery를 DIA-MS(조건당 ~5,200 protein·~21,500 phosphopeptide)로 매핑. PCA에서 DTP가 PC1(52.3%) 주도. DTP 내성 상태를 <b>CDK1 substrate·YAP1·mTOR·BAD 인산화 = kinase 경로 활성</b>으로 정의 — phospho가 \"경로가 켜졌는가\"를 읽음. 단 세포모델."}, {"label": "Sambath 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/sambath-2026-integrated-genomic-proteomic-cervical-cancer-chemoradiation-resistance", "note": "인도 자궁경부암 36명(stage IIIB squamous HPV+, CCRT=cisplatin+방사선) WGS/WES + 10명 TMT proteome(5 sensitive+5 resistant). <b>TMB sensitive 8.5 vs resistant 4.25(P=0.09 비유의)</b> → 유전체만으론 내성 예측 약함. 단백체 sensitive↔resistant 비교로 또 다른 \"내성\"(CCRT)을 더함."}, {"label": "Jaehnig 2025", "url": "https://hejeong1219.github.io/paperatlas/sources/jaehnig-2025-proteogenomic-analysis-calgb-40601-alliance", "note": "CALGB 40601 무작위 HER2+ 유방암(TH/TL/THL) 치료 전 biopsy 80개/54명 QC통과를 DNA·RNA·proteome·phospho로 재분석. ERBB2 단백·인산화 ladder가 non-pCR과 연관. 특히 4명/6샘플은 ERBB2 증폭 없는 <b>가짜 HER2+</b>인데 pCR 없음 — 단백·인산화가 유전체가 놓친 저항을 잡음."}]}, {"id": "Q56", "title": "유전체로 설명 안 되는 내성을 functional resistance state로 재분류할 수 있는가?", "answer_html": "유전체 변이만으로 설명되지 않는 내성을, 재현 가능한 functional resistance state(예: kinase-activity state)로 재분류할 수 있는지를 묻는다. 데이터는 풍부하나 marker의 내성-상태 라벨이 없다.", "synthesis": "Solanki는 KRASG12C 획득내성이 genomic(RAS재활성)·non-genomic(RTK/EMT) 상태로 갈라지고 여러 모델에서 WES가 아닌 phospho만 그 내성을 잡음을 보인다. Lee는 상태 라벨 없는 marker가 다수임을, Hsu는 유전체로 잡히지 않는 활성 상태를 보인다. 이 추론에 쓰인 환자 proteome/phospho 내성 논문은 약 10편이다.", "cites": [{"label": "Solanki 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/solanki-2026-ras-gtp-inhibition-overcomes-acquired-resistance", "note": "KRASG12C 억제제 내성 NSCLC 모델(cell·xenograft·PDX)을 WES·RNA·TMT phospho·pY·KSEA·RAS-GTP pulldown으로 — 내성이 <b>세 상태로 갈라짐</b>: ① RAS 변이(KRASG12C 증폭/NRAS G13R) ② RTK 상향+RAS-GTP 재활성(non-genomic) ③ EMT RAS-비의존. <b>결정적: 여러 내성 모델에서 WES는 RAS/MAPK 변이를 못 찾고 RNA·phospho만 잡아냄</b> → \"유전체로 설명 안 되는 내성 상태\"가 실재함을 직접 증명."}, {"label": "Lee 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/lee-2026-proteogenomic-decoding-chemotherapy-resistance-tnbc", "note": "연세·세브란스 stage II–III TNBC 50명을 NAC(주로 AC→paclitaxel) <b>치료 전</b> 종양에서 WGS·proteome·phospho로 전향 프로파일(pCR 19/50=38%, progression 12%). 치료 전 protein·phospho 신호가 화학요법 비반응과 연관됨을 디코딩 → \"단백체로 marker 발굴이 된다\"의 직접 근거. 단 전부 baseline(치료 전)."}, {"label": "Hsu 2025", "url": "https://hejeong1219.github.io/paperatlas/sources/hsu-2025-phosphoproteomics-osimertinib-tolerant-persister-cells-reveals", "note": "PC9(EGFR exon19 del) NSCLC 세포를 osimertinib 처리해 acute→DTP→recovery를 DIA-MS(조건당 ~5,200 protein·~21,500 phosphopeptide)로 매핑. PCA에서 DTP가 PC1(52.3%) 주도. DTP 내성 상태를 <b>CDK1 substrate·YAP1·mTOR·BAD 인산화 = kinase 경로 활성</b>으로 정의 — phospho가 \"경로가 켜졌는가\"를 읽음. 단 세포모델."}]}];
const byId={}; CH.forEach(q=>byId[q.id]=q);
function pick(){let m=location.search.match(/q=([A-Za-z0-9]+)/);return (m&&byId[m[1]])?m[1]:CH[0].id;}
function render(id){
 let q=byId[id]; if(!q)return;
 document.getElementById('qid').textContent=q.id;
 document.getElementById('qtitle').textContent=q.title;
 document.getElementById('ev').innerHTML=(q.cites||[]).map(c=>
   '<div class="ev"><a href="'+c.url+'" target="_blank">'+c.label+' →</a>'+(c.note?'<div class="note">'+c.note+'</div>':'')+'</div>').join('')
   || '<div class="note" style="color:#8a8170">이 질문은 특정 논문 근거가 아니라 단어를 쪼개는 단계다.</div>';
 document.getElementById('syn').innerHTML=q.synthesis||'';
 document.getElementById('ans').innerHTML=q.answer_html||'';
 document.getElementById('nav').innerHTML=CH.map(x=>'<a class="'+(x.id===id?'cur':'')+'" href="?q='+x.id+'">'+x.id+'</a>').join('');
 document.title=q.id+' · '+q.title.slice(0,30);
}
render(pick());
</script></body></html>
