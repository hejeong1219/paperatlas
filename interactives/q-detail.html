<script>
const CH=[{"id": "Q51", "title": "Cancer multiomics로 항암제 내성 marker를 발굴할 수 있는가?", "answer_html": "위키엔 protein·phospho가 비반응/내성과 연관된 논문이 여럿 있다. <b>근데 모아 보면 각 논문이 말하는 '내성'이 서로 다르다</b> — 화학요법(Lee), anti-HER2(Jaehnig), 자궁경부 CCRT(Sambath), 신장암 TKI(Zhang), 폐선암 subtype(Song). 같은 '내성 marker'라는 말 아래 암종·약제·시점·분자가 다 섞인다. <b>흐릿하면 안 넘긴다(사고 규칙)</b> → 다섯 차원으로 쪼갠다.", "synthesis": "여섯 암종/약제 논문을 나란히 놓으면 '내성'의 *지시 대상*이 제각각이다 — 누구는 baseline 비반응, 누구는 CCRT 저항, 누구는 TKI 반응. 한 단어로 뭉뚱그리면 비교가 불가능해지므로, 답을 내기 전에 단어부터 시점·분자·맥락으로 분해하는 게 첫 동작이 된다.", "cites": [{"label": "Lee 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/lee-2026-proteogenomic-decoding-chemotherapy-resistance-tnbc", "note": "TNBC 화학요법 — baseline 비반응 marker"}, {"label": "Jaehnig 2025", "url": "https://hejeong1219.github.io/paperatlas/sources/jaehnig-2025-proteogenomic-analysis-calgb-40601-alliance", "note": "HER2+ 유방암 — anti-HER2 저항 (ERBB2 단백·인산화 ladder)"}, {"label": "Sambath 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/sambath-2026-integrated-genomic-proteomic-cervical-cancer-chemoradiation-resistance", "note": "인도 자궁경부암(HPV+, stage IIIB) — chemoradiation(CCRT) 민감 vs 내성을 WGS+WES+TMT proteome로. 또 다른 결의 \"내성\"."}, {"label": "Zhang 2023", "url": "https://hejeong1219.github.io/paperatlas/sources/zhang-2023-proteogenomics-clear-cell-renal-response-tyrosine-kinase-inhibitor", "note": "신장암(ccRCC) sunitinib(TKI) 반응 proteogenomic — TKI 내성이라는 또 다른 정의."}, {"label": "Song 2024", "url": "https://hejeong1219.github.io/paperatlas/sources/song-2024-proteogenomic-analysis-reveals-non-small-cell", "note": "한국인 폐선암 5개 proteogenomic subtype이 adjuvant 치료 benefit과 연결 — subtype→치료반응이라는 또 다른 \"내성/반응\" 결."}]}, {"id": "Q52", "title": "단백체·인산화로 내성 marker를 발굴할 수 있는가?", "answer_html": "가능하다 — 여러 코호트에서 protein·phospho가 비반응과 연관됨이 재현된다. <b>다만 경계: 이들이 다루는 내성은 거의 전부 baseline(치료 전 비반응)</b>이라, 치료 후 생기는 내성은 못 본다.", "synthesis": "Lee·Anurag·Holt·Jaehnig·Sambath를 모으면 모두 *치료 전(또는 sensitive vs resistant snapshot)* 종양이다. '발굴 가능'은 참이지만 그 발굴은 baseline에 한정된다는 경계가 보이고, 이게 다음 질문 '치료 후 내성은?'을 부른다.", "cites": [{"label": "Lee 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/lee-2026-proteogenomic-decoding-chemotherapy-resistance-tnbc", "note": "치료 전 TNBC protein·phospho ↔ 화학요법 비반응을 직접 연결 → 발굴의 핵심 근거."}, {"label": "Anurag 2022", "url": "https://hejeong1219.github.io/paperatlas/sources/anurag-2022-proteogenomic-markers-chemotherapy-resistance-response", "note": "치료 전 TNBC WES·RNA·TMT — pCR/비반응 연관 pathway·단백 program (baseline)."}, {"label": "Holt 2025", "url": "https://hejeong1219.github.io/paperatlas/sources/holt-2025-proteogenomic-characterization-unveils-biomarkers-associated", "note": "방광암(MIBC)에서 DDR protein + GSK3B 인산화가 비반응과 연관 — protein·phospho 둘 다 marker 가능."}, {"label": "Jaehnig 2025", "url": "https://hejeong1219.github.io/paperatlas/sources/jaehnig-2025-proteogenomic-analysis-calgb-40601-alliance", "note": "anti-HER2 치료 전 biopsy에서 ERBB2 단백·인산화 ladder가 non-pCR과 연관 (baseline)."}, {"label": "Sambath 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/sambath-2026-integrated-genomic-proteomic-cervical-cancer-chemoradiation-resistance", "note": "자궁경부 CCRT sensitive vs resistant 단백체 비교 — baseline성 비교의 또 한 예."}]}, {"id": "Q53", "title": "치료 후 형성되는 (획득) 내성은 어떻게 잡나?", "answer_html": "여기서 <b>경계가 분명해진다.</b> 획득내성의 *환자 단백체·인산화* 증거는 <b>막 등장 중이나 여전히 희소</b>하다 — 대개 ctDNA(시점만)이거나 세포·PDX 모델, 또는 특정 암종 longitudinal에 국한.", "synthesis": "Chmielecki·Yaeger는 ctDNA로 시점만, Hsu·Solanki는 세포·PDX, Wei는 흑색종 longitudinal 환자 atlas다. 합치면 '획득내성을 *환자에서 단백체로* 본 증거'가 이제 막 생기기 시작했을 뿐 여전히 비어 있다는 게 보인다 — 데이터 구조의 경계.", "cites": [{"label": "Chmielecki 2023", "url": "https://hejeong1219.github.io/paperatlas/sources/chmielecki-2023-acquired-resistance-first-line-osimertinib", "note": "FLAURA — 1차 osimertinib 획득내성을 MET 증폭·EGFR C797S로 일부 설명하나 환자 65%는 ctDNA로 설명 안 됨, 단백체 없음."}, {"label": "Yaeger 2023", "url": "https://hejeong1219.github.io/paperatlas/sources/yaeger-2023-molecular-characterization-acquired-resistance-krasg12c-egfr", "note": "KRASG12C+EGFR 획득내성(대장암)이 ERK 억제 실패로 수렴 — serial ctDNA 중심, 환자 단백체 부재."}, {"label": "Hsu 2025", "url": "https://hejeong1219.github.io/paperatlas/sources/hsu-2025-phosphoproteomics-osimertinib-tolerant-persister-cells-reveals", "note": "osimertinib DTP 세포 phospho로 acute→persister→recovery 매핑 — 적응 내성 인산화이나 세포모델."}, {"label": "Solanki 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/solanki-2026-ras-gtp-inhibition-overcomes-acquired-resistance", "note": "KRASG12C 획득내성이 genomic RAS재활성/non-genomic RTK/EMT 상태로 갈라짐을 cell·PDX로 — \"상태\"는 보이나 환자 코호트 아님."}, {"label": "Wei 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/wei-2026-longitudinal-multi-omic-atlas-reveals-emergence", "note": "흑색종 내성 emergence를 longitudinal multi-omic atlas로 추적 — same-patient 획득 증거가 막 등장(단 특정 암종에 국한)."}]}, {"id": "Q54", "title": "proteome와 phospho는 같은 내성을 보는가?", "answer_html": "<b>아니다 — 독립적인 두 readout이다.</b> 발현량은 '얼마나 많은가', 인산화는 'kinase 경로가 켜졌는가'를 읽어, 같은 marker라도 다른 내성 상태를 가리킨다.", "synthesis": "Hsu(인산화=경로 활성)와 Holt·Zhang(단백질=발현량), Song(인산화-heavy subtype)을 비교하면 두 층이 서로 다른 정보를 담는다. 그래서 marker를 쓸 때 '발현량 marker인지 활성 marker인지'를 먼저 구분해야 한다는 결론.", "cites": [{"label": "Hsu 2025", "url": "https://hejeong1219.github.io/paperatlas/sources/hsu-2025-phosphoproteomics-osimertinib-tolerant-persister-cells-reveals", "note": "DTP에서 RTK/MAPK/CDK·YAP1·mTOR 경로 활성(인산화)이 내성 상태를 정의 — \"켜졌는가\"."}, {"label": "Holt 2025", "url": "https://hejeong1219.github.io/paperatlas/sources/holt-2025-proteogenomic-characterization-unveils-biomarkers-associated", "note": "방광암 내성 신호가 주로 단백질 발현량 수준(DDR 등)에서 보임 — \"얼마나 많은가\"."}, {"label": "Zhang 2023", "url": "https://hejeong1219.github.io/paperatlas/sources/zhang-2023-proteogenomics-clear-cell-renal-response-tyrosine-kinase-inhibitor", "note": "신장암 TKI 반응이 발현량 기반 신호로 나타남 — abundance 축의 또 한 예."}, {"label": "Song 2024", "url": "https://hejeong1219.github.io/paperatlas/sources/song-2024-proteogenomic-analysis-reveals-non-small-cell", "note": "폐선암에서 인산화-heavy subtype 구조가 별도 차원임을 보임 — 활성 층이 발현량과 분리됨."}]}, {"id": "Q55", "title": "내성 marker로 규정할 근거 조건은?", "answer_html": "timing · endpoint · molecular unit · direction · validation tier 다섯 조건으로 정리된다. <b>그러자 진짜 gap이 드러난다: primary/acquired/adaptive/refractory 상태를 부를 '공통 어휘'가 없다.</b>", "synthesis": "Holt(시점·isoform)·Hsu(site vs 활성)·Sambath(sensitive vs resistant)·Jaehnig(검증)을 종합하면 marker 규정에 timing·unit·direction이 필수다. 근데 5조건으로 정리하고 나니, 상태별로 부를 표준 어휘가 없어 같은 marker가 논문마다 다른 의미로 쓰임이 노출된다 — 이게 핵심 gap.", "cites": [{"label": "Holt 2025", "url": "https://hejeong1219.github.io/paperatlas/sources/holt-2025-proteogenomic-characterization-unveils-biomarkers-associated", "note": "matched pre/post + protein-isoform — 같은 단백/인산화도 시점·단위에 따라 의미가 달라짐을 실증."}, {"label": "Hsu 2025", "url": "https://hejeong1219.github.io/paperatlas/sources/hsu-2025-phosphoproteomics-osimertinib-tolerant-persister-cells-reveals", "note": "phosphosite가 raw site/protein-corrected/inferred activity인지에 따라 해석이 갈림 — unit 규정 필요."}, {"label": "Sambath 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/sambath-2026-integrated-genomic-proteomic-cervical-cancer-chemoradiation-resistance", "note": "sensitive vs resistant 단백체 비교 — endpoint·direction 정의가 필요함을 보여줌."}, {"label": "Jaehnig 2025", "url": "https://hejeong1219.github.io/paperatlas/sources/jaehnig-2025-proteogenomic-analysis-calgb-40601-alliance", "note": "재현가능 non-pCR marker를 별도 검증 — validation tier의 예."}]}, {"id": "Q56", "title": "유전체로 설명 안 되는 내성을 functional resistance state로 재분류할 수 있는가?", "answer_html": "좁혀온 연구질문. 핵심 전환은 <b>'marker를 더 찾자(layer 쌓기)' → '그 marker가 무슨 내성-상태인지부터 구분하자(state 해석)'</b>다. 데이터는 풍부(CPTAC 등)하나 marker의 상태 라벨이 없어, 유전체로 설명 안 되는 내성을 재현가능한 kinase-activity state로 재분류할 수 있는지를 묻는다(ranked question family).", "synthesis": "결정적으로 Solanki는 획득내성이 *genomic(RAS재활성)*과 *non-genomic(RTK/EMT)* 상태로 갈라짐을 보여 — '유전체로 설명되는/안 되는 내성 상태'가 실재함을 직접 시사한다. Lee(상태 라벨 없는 marker 다수)·Hsu(유전체로 안 잡히는 활성 상태)와 합치면, 문제는 데이터 부족이 아니라 '해석 틀' 부재다. ※ 이 추론 전체가 ~10편에 기댄다는 것 자체가, 내성-상태를 본 환자 증거가 그만큼 적다는 뜻 — 이 희소성이 'gap'을 뒷받침한다.", "cites": [{"label": "Solanki 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/solanki-2026-ras-gtp-inhibition-overcomes-acquired-resistance", "note": "획득내성을 genomic RAS재활성 / non-genomic RTK-RAS-GTP / EMT RAS-비의존 상태로 분해 — \"genome-설명 vs 비설명 상태\"가 실재함을 직접 보임(연구질문의 핵심 근거)."}, {"label": "Lee 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/lee-2026-proteogenomic-decoding-chemotherapy-resistance-tnbc", "note": "풍부한 marker를 보고하나 baseline/acquired·발현량/활성 상태 라벨 없이 제시 — \"marker는 많은데 무슨 상태인지 모른다\"의 대표."}, {"label": "Hsu 2025", "url": "https://hejeong1219.github.io/paperatlas/sources/hsu-2025-phosphoproteomics-osimertinib-tolerant-persister-cells-reveals", "note": "DTP 내성이 EGFR 변이로 설명 안 되는 phospho-activity 상태로 정의됨 — genome-비의존 kinase state가 실재."}]}];
const byId={}; CH.forEach(q=>byId[q.id]=q);
function pick(){let m=location.search.match(/q=([A-Za-z0-9]+)/);return (m&&byId[m[1]])?m[1]:CH[0].id;}
function render(id){
 let q=byId[id]; if(!q)return;
 document.getElementById('qid').textContent=q.id;
 document.getElementById('qtitle').textContent=q.title;
 document.getElementById('ev').innerHTML=(q.cites||[]).map(c=>
   '<div class="ev"><a href="'+c.url+'" target="_blank">'+c.label+' →</a>'+(c.note?'<div class="note">'+c.note+'</div>':'')+'</div>').join('')
   || '<div class="note" style="color:#8a8170">이 질문은 특정 논문 근거가 아니라 단어를 쪼개는 단계다.</div>';
 document.getElementById('syn').innerHTML=q.synthesis||'';
 document.getElementById('ans').innerHTML=q.answer_html||'';
 document.getElementById('nav').innerHTML=CH.map(x=>'<a class="'+(x.id===id?'cur':'')+'" href="?q='+x.id+'">'+x.id+'</a>').join('');
 document.title=q.id+' · '+q.title.slice(0,30);
}
render(pick());
</script></body></html>
