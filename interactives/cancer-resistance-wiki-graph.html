mic-proteomic-cervical-cancer-chemoradiation-resistance"}, {"source": "analyses/cancer-multiomics-resistance-biomarker-evidence-boundary-map", "target": "analyses/cancer-multiomics-resistance-gap-decision-matrix"}, {"source": "analyses/drug-response-poc-global-phospho-somatic-snv", "target": "sources/petralia-2024-pan-cancer-proteogenomics-characterization-tumor-immunity"}, {"source": "analyses/primary-acquired-resistance-proteogenomics-ingest-map", "target": "sources/sakai-2026-postn-cafs-chemoradiotherapy-resistance-rectal-cancer"}, {"source": "analyses/drug-response-poc-global-phospho-somatic-snv", "target": "sources/huang-2021-proteogenomic-insights-biology-treatment-hpv-negative"}, {"source": "syntheses/kinase-activity-inference-under-ptm-correction", "target": "topics/ptm-correction-and-kinase-signaling-in-cancer-proteomics"}, {"source": "analyses/cancer-multiomics-resistance-biomarker-question-chain", "target": "topics/ptm-correction-and-kinase-signaling-in-cancer-proteomics"}, {"source": "analyses/cancer-multiomics-final-presentation-brief", "target": "topics/cancer-multiomics-literature"}, {"source": "analyses/cancer-multiomics-resistance-biomarker-evidence-boundary-map", "target": "sources/anurag-2022-proteogenomic-markers-chemotherapy-resistance-response"}, {"source": "analyses/resistance-state-subtyping-refractory-gastric-cancer", "target": "sources/song-2024-proteogenomic-analysis-reveals-non-small-cell"}, {"source": "analyses/cancer-multiomics-resistance-biomarker-evidence-boundary-map", "target": "sources/holt-2025-proteogenomic-characterization-unveils-biomarkers-associated"}]};
const COL={question:'#FF6B4A',concept:'#E8A33D',paper:'#7C84A8'};
const RBASE={question:9,concept:7,paper:4};
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,DPR;
function resize(){DPR=window.devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';}
resize();
const nodes=DATA.nodes.map(n=>({...n,x:W/2+(Math.random()-.5)*250,y:H/2+(Math.random()-.5)*250,vx:0,vy:0}));
const byId={};nodes.forEach(n=>byId[n.id]=n);
const links=DATA.links.map(l=>({s:byId[l.source],t:byId[l.target]})).filter(l=>l.s&&l.t);
nodes.forEach(n=>n.r=RBASE[n.type]+Math.min(n.degree,14)*0.9);
const adj={};nodes.forEach(n=>adj[n.id]=[]);links.forEach(l=>{adj[l.s.id].push(l.t);adj[l.t.id].push(l.s)});
document.getElementById('sN').textContent=nodes.length;
document.getElementById('sL').textContent=links.length;
document.getElementById('sQ').textContent=nodes.filter(n=>n.type==='question').length;
// view transform
let scale=0.82,tx=0,ty=0;
function autofit(){
 let a=1e9,b=1e9,c=-1e9,d=-1e9;
 for(let n of nodes){a=Math.min(a,n.x);c=Math.max(c,n.x);b=Math.min(b,n.y);d=Math.max(d,n.y);}
 let bw=Math.max(c-a,1),bh=Math.max(d-b,1);
 scale=Math.min((W-300)/bw,(H-240)/bh,1.5);
 tx=W/2-(a+c)/2*scale;ty=H/2-(b+d)/2*scale;
}
window.addEventListener('resize',()=>{resize();autofit();});
setTimeout(autofit,2600);setTimeout(autofit,5200);
document.getElementById('fit').onclick=autofit;
// simulation
let alpha=1;
function step(){
 if(alpha<0.005)return;
 for(let i=0;i<nodes.length;i++){let a=nodes[i];
  for(let j=i+1;j<nodes.length;j++){let b=nodes[j];
   let dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy||1,d=Math.sqrt(d2);
   let f=2600/d2;let fx=dx/d*f,fy=dy/d*f;
   a.vx+=fx;a.vy+=fy;b.vx-=fx;b.vy-=fy;}}
 for(let l of links){let dx=l.t.x-l.s.x,dy=l.t.y-l.s.y,d=Math.sqrt(dx*dx+dy*dy)||1;
  let f=(d-82)*0.02;let fx=dx/d*f,fy=dy/d*f;
  l.s.vx+=fx;l.s.vy+=fy;l.t.vx-=fx;l.t.vy-=fy;}
 const cx=W/2,cy=H/2;
 for(let n of nodes){if(n.fx!=null){n.x=n.fx;n.y=n.fy;n.vx=0;n.vy=0;continue;}
  n.vx+=(cx-n.x)*0.0024;n.vy+=(cy-n.y)*0.0024;
  n.vx*=0.86;n.vy*=0.86;n.x+=n.vx;n.y+=n.vy;}
 alpha*=0.992;
}
let filter='all',hover=null,sel=null;
function visible(n){return filter==='all'||n.type===filter}
function draw(){
 ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);
 ctx.setTransform(DPR*scale,0,0,DPR*scale,tx*DPR,ty*DPR);
 const hi=hover||sel;const hiSet=hi?new Set(adj[hi.id].map(x=>x.id).concat(hi.id)):null;
 // links
 for(let l of links){let on=!hiSet||hiSet.has(l.s.id)&&hiSet.has(l.t.id);
  let vis=visible(l.s)||visible(l.t);
  ctx.strokeStyle=on&&hi?'rgba(255,140,90,.45)':(vis?'rgba(200,190,215,.10)':'rgba(200,190,215,.03)');
  ctx.lineWidth=(on&&hi?1.4:0.8)/scale;
  ctx.beginPath();ctx.moveTo(l.s.x,l.s.y);ctx.lineTo(l.t.x,l.t.y);ctx.stroke();}
 // nodes
 for(let n of nodes){let dim=(hiSet&&!hiSet.has(n.id))||!visible(n);
  ctx.globalAlpha=dim?0.18:1;
  ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,7);ctx.fillStyle=COL[n.type];ctx.fill();
  if(n===hi){ctx.lineWidth=2.5/scale;ctx.strokeStyle='#fff';ctx.stroke();}
  // label
  let show=n.type!=='paper'||n.degree>=2||!dim&&hi;
  if(show||!dim){ctx.globalAlpha=dim?0.25:1;
   ctx.font=(n.type==='question'?'600 ':'')+(n.type==='paper'?11:n.type==='question'?14:12.5)+"px Pretendard,sans-serif";
   ctx.fillStyle=n.type==='question'?'#ffd9cd':n.type==='concept'?'#f4d9a8':'#b9bdce';
   ctx.textAlign='center';ctx.fillText(n.label,n.x,n.y+n.r+13);}
 }
 ctx.globalAlpha=1;
}
function loop(){step();draw();requestAnimationFrame(loop);}loop();
// interaction
function toWorld(px,py){return{x:(px-tx)/scale,y:(py-ty)/scale}}
function pick(px,py){let w=toWorld(px,py),best=null,bd=1e9;
 for(let n of nodes){let dx=n.x-w.x,dy=n.y-w.y,d=Math.sqrt(dx*dx+dy*dy);if(d<n.r+6&&d<bd){bd=d;best=n;}}return best;}
let drag=null,pan=null;
cv.addEventListener('mousedown',e=>{let n=pick(e.clientX,e.clientY);
 if(n){drag=n;n.fx=n.x;n.fy=n.y;selectNode(n);}else{pan={x:e.clientX,y:e.clientY,tx,ty};cv.style.cursor='grabbing';}});
window.addEventListener('mousemove',e=>{
 if(drag){let w=toWorld(e.clientX,e.clientY);drag.fx=w.x;drag.fy=w.y;alpha=Math.max(alpha,.3);}
 else if(pan){tx=pan.tx+(e.clientX-pan.x);ty=pan.ty+(e.clientY-pan.y);}
 else{let n=pick(e.clientX,e.clientY);hover=n;cv.style.cursor=n?'pointer':'grab';}});
window.addEventListener('mouseup',()=>{if(drag){drag.fx=null;drag.fy=null;drag=null;}pan=null;cv.style.cursor='grab';});
cv.addEventListener('wheel',e=>{e.preventDefault();let w=toWorld(e.clientX,e.clientY);
 let ns=scale*(e.deltaY<0?1.12:0.89);ns=Math.max(0.2,Math.min(4,ns));
 tx=e.clientX-w.x*ns;ty=e.clientY-w.y*ns;scale=ns;},{passive:false});
function selectNode(n){sel=n;let d=document.getElementById('detail');d.style.display='block';
 document.getElementById('dT').textContent=({question:'질문 · QUESTION',concept:'개념 · CONCEPT',paper:'논문 · PAPER'})[n.type];
 document.getElementById('dT').style.color=COL[n.type];
 document.getElementById('dH').textContent=n.label;
 document.getElementById('dM').textContent='연결 '+n.degree+'개';
 let html=adj[n.id].map(x=>'<div class="conn">'+x.label+'</div>').join('');
 document.getElementById('dC').innerHTML=html;}
cv.addEventListener('click',e=>{if(Math.abs((pan?0:0))){};let n=pick(e.clientX,e.clientY);if(!n){sel=null;document.getElementById('detail').style.display='none';}});
document.querySelectorAll('.fbtn').forEach(b=>b.addEventListener('click',()=>{
 document.querySelectorAll('.fbtn').forEach(x=>x.classList.remove('on'));b.classList.add('on');filter=b.dataset.f;}));
setTimeout(()=>{alpha=1;},50);
</script></body></html>
