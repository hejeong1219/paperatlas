<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><title>질문이 발전한 길 · LLM-Wiki</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#181520;font-family:'Pretendard',-apple-system,'Segoe UI',sans-serif}
#c{display:block;cursor:grab}
.panel{position:absolute;background:rgba(28,24,38,.85);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.08);border-radius:12px;color:#D8D4DE}
#info{top:22px;left:22px;width:300px;padding:18px 20px}
#info h1{font-size:18px;color:#fff;font-weight:700}
#info .sub{font-size:12.5px;line-height:1.55;color:#9b94a6;margin-top:8px}
#info .stats{display:flex;gap:20px;margin-top:15px}
#info .stat b{font-size:21px;color:#fff}#info .stat span{font-size:10.5px;color:#8a8396;display:block}
#legend{left:22px;bottom:22px;padding:13px 18px;font-size:12.5px}
#legend .row{display:flex;align-items:center;gap:9px;margin:6px 0}
#legend .dot{width:13px;height:13px;border-radius:50%}
#filters{top:22px;left:340px;display:flex;gap:7px}
.fbtn{padding:7px 15px;font-size:12.5px;color:#e6e1ee;background:rgba(54,48,68,.95);border:1px solid rgba(255,255,255,.18);border-radius:20px;cursor:pointer;font-family:inherit;user-select:none}
.fbtn.on{background:#FF6B4A;color:#fff;border-color:#FF6B4A}.fbtn:hover{background:rgba(70,62,88,.95)}
#detail{top:22px;right:22px;width:300px;padding:18px 20px;display:none}
#detail .t{font-size:11px;letter-spacing:.5px;text-transform:uppercase;font-weight:700}
#detail h2{font-size:15px;color:#fff;margin:7px 0 9px;line-height:1.45}
#detail .ch{font-size:11px;color:#8a8396;text-transform:uppercase;margin:10px 0 6px}
#detail .conn{font-size:12.5px;color:#cfc8da;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.05)}
#hint{right:22px;bottom:22px;padding:9px 14px;font-size:11.5px;color:#7a7388;background:rgba(28,24,38,.6);border-radius:8px}
</style></head><body>
<canvas id="c"></canvas>
<div class="panel" id="info"><h1>질문이 발전한 길</h1>
 <div class="sub"><b style="color:#FF6B4A">질문</b> → <b style="color:#34C3A4">답</b> → 그 답에 영향 준 <b style="color:#7C84A8">논문</b>. 각 답이 다음 질문을 낳았다.</div>
 <div class="stats"><div class="stat"><b id="sQ" style="color:#FF6B4A"></b><span>질문</span></div><div class="stat"><b id="sA" style="color:#34C3A4"></b><span>답</span></div><div class="stat"><b id="sP" style="color:#7C84A8"></b><span>논문</span></div></div></div>
<div id="filters">
 <div class="fbtn on" data-f="all">전체</div><div class="fbtn" data-f="chain">질문↔답만</div>
 <div class="fbtn" data-f="paper">논문</div><div class="fbtn" id="fit">⊕ 맞춤</div></div>
<div class="panel" id="legend">
 <div class="row"><div class="dot" style="background:#FF6B4A"></div>질문 (내가 던진 것)</div>
 <div class="row"><div class="dot" style="background:#34C3A4"></div>답 (위키가 준 잠정 답)</div>
 <div class="row"><div class="dot" style="background:#7C84A8"></div>논문 (답에 영향)</div></div>
<div class="panel" id="detail"><div class="t" id="dT"></div><h2 id="dH"></h2>
 <div class="ch">연결</div><div id="dC"></div></div>
<div id="hint">드래그=이동 · 휠=줌 · 노드 클릭=전체 문장</div>
<script>
const DATA={"nodes": [{"id": "Q1", "type": "question", "label": "Q1 · marker 발굴 가능?", "full": "단백체·인산화로 항암제 내성 marker를 발굴할 수 있는가?", "degree": 1}, {"id": "A1", "type": "answer", "label": "→ 전부 baseline non-response", "full": "발굴은 가능하나, 이 논문들이 다루는 내성은 모두 치료 전 baseline non-response.", "degree": 7}, {"id": "Q2", "type": "question", "label": "Q2 · 어떤 timing?", "full": "그럼 각 논문은 어떤 내성 timing(시점)을 뒷받침하는가?", "degree": 2}, {"id": "A2", "type": "answer", "label": "→ acquired 단백체가 없다", "full": "baseline 근거는 충분하나, 같은 환자 획득내성(acquired)의 proteome·phospho가 부재.", "degree": 6}, {"id": "Q3", "type": "question", "label": "Q3 · proteome=phospho?", "full": "proteome와 phosphoproteome는 같은 내성 생물학을 반영하는가?", "degree": 2}, {"id": "A3", "type": "answer", "label": "→ 발현량 ≠ kinase 활성", "full": "독립적이다 — 발현량(얼마나 많은가)과 kinase 활성(경로가 켜졌나)은 서로 다른 내성 상태.", "degree": 5}, {"id": "Q4", "type": "question", "label": "Q4 · 규정 근거 조건?", "full": "그 신호를 내성 marker로 규정하려면 어떤 근거 조건이 필요한가?", "degree": 2}, {"id": "A4", "type": "answer", "label": "→ 상태 분류 어휘 부재 (gap)", "full": "5조건(timing·endpoint·단위·방향·검증) 정리 → 상태별 공통 분류 어휘가 없다. = 연구 gap.", "degree": 2}, {"id": "QF", "type": "question", "label": "Q★ · state로 재분류?", "full": "유전체로 설명되지 않는 내성을 functional resistance state로 재분류할 수 있는가?", "degree": 3}, {"id": "HF", "type": "answer", "label": "→ kinase-activity state 수렴", "full": "가설: 유전체-미설명 내성은 무작위가 아니라 재현가능한 kinase-activity state로 수렴하며, 유전체층과 orthogonal하다 (검정 가능).", "degree": 3}, {"id": "Lee 2026", "type": "paper", "full": "Lee 2026 · 한국인 TNBC NAC 저항 proteogenomics", "label": "Lee 2026", "degree": 1}, {"id": "Anurag 2022", "type": "paper", "full": "Anurag 2022 · TNBC 화학요법 저항 proteogenomic marker", "label": "Anurag 2022", "degree": 2}, {"id": "Holt 2025", "type": "paper", "full": "Holt 2025 · MIBC proteogenomic, DDR proteome", "label": "Holt 2025", "degree": 2}, {"id": "Jaehnig 2025", "type": "paper", "full": "Jaehnig 2025 · HER2+ breast (CALGB 40601)", "label": "Jaehnig 2025", "degree": 1}, {"id": "Zhang 2023", "type": "paper", "full": "Zhang 2023 · ccRCC sunitinib 반응 proteogenomics", "label": "Zhang 2023", "degree": 1}, {"id": "Chmielecki 2023", "type": "paper", "full": "Chmielecki 2023 · serial ctDNA acquired timing", "label": "Chmielecki 2023", "degree": 1}, {"id": "Yaeger 2023", "type": "paper", "full": "Yaeger 2023 · KRASG12C/EGFR 획득내성", "label": "Yaeger 2023", "degree": 1}, {"id": "Hsu 2025", "type": "paper", "full": "Hsu 2025 · osimertinib DTP phosphoproteomics (kinase 활성)", "label": "Hsu 2025", "degree": 2}, {"id": "Memon 2024", "type": "paper", "full": "Memon 2024 · acquired resistance time-course", "label": "Memon 2024", "degree": 1}, {"id": "Chang 2026", "type": "paper", "full": "Chang 2026 (Gut) · 1차 위암 proteogenomic atlas (비교/차별 대상)", "label": "Chang 2026", "degree": 2}, {"id": "Sambath 2026", "type": "paper", "full": "Sambath 2026 · 자궁경부암 CCRT 내성 proteogenomics", "label": "Sambath 2026", "degree": 1}], "links": [{"source": "Q1", "target": "A1", "chain": 1}, {"source": "A1", "target": "Q2", "chain": 1}, {"source": "Q2", "target": "A2", "chain": 1}, {"source": "A2", "target": "Q3", "chain": 1}, {"source": "Q3", "target": "A3", "chain": 1}, {"source": "A3", "target": "Q4", "chain": 1}, {"source": "Q4", "target": "A4", "chain": 1}, {"source": "A4", "target": "QF", "chain": 1}, {"source": "QF", "target": "HF", "chain": 1}, {"source": "Lee 2026", "target": "A1", "chain": false}, {"source": "Anurag 2022", "target": "A1", "chain": false}, {"source": "Holt 2025", "target": "A1", "chain": false}, {"source": "Jaehnig 2025", "target": "A1", "chain": false}, {"source": "Zhang 2023", "target": "A1", "chain": false}, {"source": "Chmielecki 2023", "target": "A2", "chain": false}, {"source": "Yaeger 2023", "target": "A2", "chain": false}, {"source": "Hsu 2025", "target": "A2", "chain": false}, {"source": "Memon 2024", "target": "A2", "chain": false}, {"source": "Anurag 2022", "target": "A3", "chain": false}, {"source": "Holt 2025", "target": "A3", "chain": false}, {"source": "Hsu 2025", "target": "A3", "chain": false}, {"source": "Chang 2026", "target": "HF", "chain": false}, {"source": "Sambath 2026", "target": "HF", "chain": false}, {"source": "Chang 2026", "target": "QF", "chain": false}]};
const COL={question:'#FF6B4A',answer:'#34C3A4',paper:'#7C84A8'};
const RBASE={question:13,answer:11,paper:5};
const cv=document.getElementById('c'),ctx=cv.getContext('2d');let W,H,DPR;
function resize(){DPR=window.devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';}resize();
// 사슬 노드는 위→아래 순서로 시드, 논문은 랜덤
const chainOrder=['Q1','A1','Q2','A2','Q3','A3','Q4','A4','QF','HF'];
const nodes=DATA.nodes.map(n=>{let ci=chainOrder.indexOf(n.id);
 return {...n,x:ci>=0?W/2+(ci%2?120:-120):W/2+(Math.random()-.5)*300,
              y:ci>=0?120+ci*((H-240)/9):H/2+(Math.random()-.5)*300,vx:0,vy:0};});
const byId={};nodes.forEach(n=>byId[n.id]=n);
const links=DATA.links.map(l=>({s:byId[l.source],t:byId[l.target],chain:l.chain})).filter(l=>l.s&&l.t);
nodes.forEach(n=>n.r=RBASE[n.type]+Math.min(n.degree,10)*0.7);
const adj={};nodes.forEach(n=>adj[n.id]=[]);links.forEach(l=>{adj[l.s.id].push(l.t);adj[l.t.id].push(l.s)});
sQ.textContent=nodes.filter(n=>n.type==='question').length;sA.textContent=nodes.filter(n=>n.type==='answer').length;sP.textContent=nodes.filter(n=>n.type==='paper').length;
let scale=0.85,tx=0,ty=0;
function autofit(){let a=1e9,b=1e9,c=-1e9,d=-1e9;for(let n of nodes){a=Math.min(a,n.x);c=Math.max(c,n.x);b=Math.min(b,n.y);d=Math.max(d,n.y);}
 let bw=Math.max(c-a,1),bh=Math.max(d-b,1);scale=Math.min((W-340)/bw,(H-200)/bh,1.4);tx=W/2-(a+c)/2*scale;ty=H/2-(b+d)/2*scale;}
window.addEventListener('resize',()=>{resize();autofit();});setTimeout(autofit,2800);setTimeout(autofit,5500);fit.onclick=autofit;
let alpha=1;
function step(){if(alpha<0.004)return;
 for(let i=0;i<nodes.length;i++){let a=nodes[i];for(let j=i+1;j<nodes.length;j++){let b=nodes[j];
  let dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy||1,d=Math.sqrt(d2);let f=3000/d2;a.vx+=dx/d*f;a.vy+=dy/d*f;b.vx-=dx/d*f;b.vy-=dy/d*f;}}
 for(let l of links){let dx=l.t.x-l.s.x,dy=l.t.y-l.s.y,d=Math.sqrt(dx*dx+dy*dy)||1;
  let L0=l.chain?68:115,k=l.chain?0.035:0.012;let f=(d-L0)*k;l.s.vx+=dx/d*f;l.s.vy+=dy/d*f;l.t.vx-=dx/d*f;l.t.vy-=dy/d*f;}
 const cx=W/2,cy=H/2;for(let n of nodes){if(n.fx!=null){n.x=n.fx;n.y=n.fy;n.vx=n.vy=0;continue;}
  n.vx+=(cx-n.x)*0.002;n.vy+=(cy-n.y)*0.002;n.vx*=0.85;n.vy*=0.85;n.x+=n.vx;n.y+=n.vy;}alpha*=0.99;}
let filter='all',hover=null,sel=null;
function vis(n){return filter==='all'||(filter==='chain'&&n.type!=='paper')||(filter==='paper');}
function arrow(x1,y1,x2,y2,col){let a=Math.atan2(y2-y1,x2-x1),r=byId?0:0;
 // 화살촉 (타깃 노드 반경 앞)
 ctx.fillStyle=col;ctx.beginPath();let s=7/scale;
 ctx.moveTo(x2,y2);ctx.lineTo(x2-s*Math.cos(a-0.4),y2-s*Math.sin(a-0.4));ctx.lineTo(x2-s*Math.cos(a+0.4),y2-s*Math.sin(a+0.4));ctx.closePath();ctx.fill();}
function draw(){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);
 ctx.setTransform(DPR*scale,0,0,DPR*scale,tx*DPR,ty*DPR);
 const hi=hover||sel;const hs=hi?new Set(adj[hi.id].map(x=>x.id).concat(hi.id)):null;
 for(let l of links){let on=!hs||(hs.has(l.s.id)&&hs.has(l.t.id));let visl=vis(l.s)&&vis(l.t)||(filter==='chain'&&l.chain);
  if(filter==='paper'&&l.chain){}
  let dim=(hs&&!on)||!visl;
  let dx=l.t.x-l.s.x,dy=l.t.y-l.s.y,d=Math.sqrt(dx*dx+dy*dy)||1;let ux=dx/d,uy=dy/d;
  let ex=l.t.x-ux*(l.t.r+2),ey=l.t.y-uy*(l.t.r+2);
  ctx.strokeStyle=l.chain?(dim?'rgba(255,107,74,.12)':'rgba(255,140,90,.55)'):(dim?'rgba(200,190,215,.04)':'rgba(160,170,200,.20)');
  ctx.lineWidth=(l.chain?2.0:0.9)/scale;ctx.beginPath();ctx.moveTo(l.s.x,l.s.y);ctx.lineTo(ex,ey);ctx.stroke();
  if(l.chain&&!dim)arrow(l.s.x,l.s.y,ex,ey,'rgba(255,140,90,.65)');}
 for(let n of nodes){let dim=(hs&&!hs.has(n.id))||!vis(n);ctx.globalAlpha=dim?0.16:1;
  ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,7);ctx.fillStyle=COL[n.type];ctx.fill();
  if(n===hi){ctx.lineWidth=2.5/scale;ctx.strokeStyle='#fff';ctx.stroke();}
  let showL=n.type!=='paper'||n.degree>=1;
  if(!dim||showL){ctx.globalAlpha=dim?0.22:1;
   ctx.font=(n.type==='question'?'700 14':n.type==='answer'?'600 12.5':'11')+"px Pretendard,sans-serif";
   ctx.fillStyle=n.type==='question'?'#ffd9cd':n.type==='answer'?'#bff0e4':'#b9bdce';ctx.textAlign='center';
   ctx.fillText(n.label,n.x,n.y+n.r+13);}}
 ctx.globalAlpha=1;}
function loop(){step();draw();requestAnimationFrame(loop);}loop();
function toW(px,py){return{x:(px-tx)/scale,y:(py-ty)/scale}}
function pick(px,py){let w=toW(px,py),b=null,bd=1e9;for(let n of nodes){let dx=n.x-w.x,dy=n.y-w.y,d=Math.hypot(dx,dy);if(d<n.r+6&&d<bd){bd=d;b=n;}}return b;}
let drag=null,pan=null;
cv.addEventListener('mousedown',e=>{let n=pick(e.clientX,e.clientY);if(n){drag=n;n.fx=n.x;n.fy=n.y;showDetail(n);}else{pan={x:e.clientX,y:e.clientY,tx,ty};}});
window.addEventListener('mousemove',e=>{if(drag){let w=toW(e.clientX,e.clientY);drag.fx=w.x;drag.fy=w.y;alpha=Math.max(alpha,.3);}
 else if(pan){tx=pan.tx+e.clientX-pan.x;ty=pan.ty+e.clientY-pan.y;}else{hover=pick(e.clientX,e.clientY);cv.style.cursor=hover?'pointer':'grab';}});
window.addEventListener('mouseup',()=>{if(drag){drag.fx=drag.fy=null;drag=null;}pan=null;});
cv.addEventListener('wheel',e=>{e.preventDefault();let w=toW(e.clientX,e.clientY);let ns=Math.max(0.2,Math.min(4,scale*(e.deltaY<0?1.12:0.89)));tx=e.clientX-w.x*ns;ty=e.clientY-w.y*ns;scale=ns;},{passive:false});
function showDetail(n){sel=n;detail.style.display='block';
 dT.textContent=({question:'질문 · QUESTION',answer:'답 · ANSWER',paper:'논문 · PAPER'})[n.type];dT.style.color=COL[n.type];
 dH.textContent=n.full||n.label;dC.innerHTML=adj[n.id].map(x=>'<div class="conn">'+(x.label)+'</div>').join('');}
cv.addEventListener('click',e=>{if(!pick(e.clientX,e.clientY)){sel=null;detail.style.display='none';}});
document.querySelectorAll('.fbtn[data-f]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.fbtn[data-f]').forEach(x=>x.classList.remove('on'));b.classList.add('on');filter=b.dataset.f;});
</script></body></html>
