const COL={hub:'#176087',question:'#bf5a3c',answer:'#6c8f6b',paper:'#b7b1a5'};
const cv=document.getElementById('c'),ctx=cv.getContext('2d');let W,H,DPR;
function resize(){DPR=window.devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';}resize();
const chainOrder=['Q1','Q2','Q3','Q4','QF'];
const nodes=DATA.nodes.map(n=>{let ci=chainOrder.indexOf(n.id);
 if(n.id==='HUB')return {...n,x:W/2,y:H/2,vx:0,vy:0};
 if(ci>=0)return {...n,x:W/2+(ci%2?165:-165),y:H/2+(ci-2)*95,vx:0,vy:0};
 return {...n,x:W/2+(Math.random()-.5)*W*0.85,y:H/2+(Math.random()-.5)*H*0.80,vx:0,vy:0};});
const byId={};nodes.forEach(n=>byId[n.id]=n);
const links=DATA.links.map(l=>({s:byId[l.source],t:byId[l.target],kind:l.kind})).filter(l=>l.s&&l.t);
nodes.forEach(n=>n.r=n.id==='HUB'?20:n.type==='question'?11:n.type==='answer'?9:(n.cited_flag?5:3));
const adj={};nodes.forEach(n=>adj[n.id]=[]);links.forEach(l=>{adj[l.s.id].push(l.t);adj[l.t.id].push(l.s)});
sP.textContent=nodes.filter(n=>n.type==='paper').length;sQ.textContent=nodes.filter(n=>n.type==='question').length;sL.textContent=links.length;
let scale=0.62,tx=0,ty=0;
function autofit(){let a=1e9,b=1e9,c=-1e9,d=-1e9;for(let n of nodes){a=Math.min(a,n.x);c=Math.max(c,n.x);b=Math.min(b,n.y);d=Math.max(d,n.y);}
 let bw=Math.max(c-a,1),bh=Math.max(d-b,1);scale=Math.min((W-330)/bw,(H-150)/bh,1.3);tx=W/2-(a+c)/2*scale;ty=H/2-(b+d)/2*scale;}
window.addEventListener('resize',()=>{resize();autofit();});setTimeout(autofit,3500);setTimeout(autofit,7000);fit.onclick=autofit;
let alpha=1;
function step(){if(alpha<0.003)return;
 for(let i=0;i<nodes.length;i++){let a=nodes[i];for(let j=i+1;j<nodes.length;j++){let b=nodes[j];
  let dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy||1;if(d2>180000)continue;let d=Math.sqrt(d2);let f=1500/d2;a.vx+=dx/d*f;a.vy+=dy/d*f;b.vx-=dx/d*f;b.vy-=dy/d*f;}}
 for(let l of links){let dx=l.t.x-l.s.x,dy=l.t.y-l.s.y,d=Math.sqrt(dx*dx+dy*dy)||1;
  let L0=l.kind==='chain'?95:l.kind==='cite'?130:l.t.id==='HUB'||l.s.id==='HUB'?240:120,k=l.kind==='chain'?0.04:0.005;
  let f=(d-L0)*k;l.s.vx+=dx/d*f;l.s.vy+=dy/d*f;l.t.vx-=dx/d*f;l.t.vy-=dy/d*f;}
 const cx=W/2,cy=H/2;for(let n of nodes){if(n.fx!=null){n.x=n.fx;n.y=n.fy;n.vx=n.vy=0;continue;}
  n.vx+=(cx-n.x)*0.0011;n.vy+=(cy-n.y)*0.0011;n.vx*=0.88;n.vy*=0.88;n.x+=n.vx;n.y+=n.vy;}alpha*=0.992;}
let filter='all',hover=null,sel=null,focusSet=null;
function vis(n){if(filter==='all')return 1;if(filter==='chain')return n.type==='question'||n.type==='answer';if(filter==='cited')return n.type!=='paper'||n.cited_flag||n.id==='HUB';return 1;}
function draw(){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);ctx.setTransform(DPR*scale,0,0,DPR*scale,tx*DPR,ty*DPR);
 const hi=hover||sel;const hs=hi?new Set(adj[hi.id].map(x=>x.id).concat(hi.id)):null;
 for(let l of links){let on=!hs||(hs.has(l.s.id)&&hs.has(l.t.id));let visl=vis(l.s)&&vis(l.t);
  let dim=(hs&&!on)||!visl||(focusSet&&!(focusSet.has(l.s.id)&&focusSet.has(l.t.id)));
  let dx=l.t.x-l.s.x,dy=l.t.y-l.s.y,d=Math.sqrt(dx*dx+dy*dy)||1,ux=dx/d,uy=dy/d;let ex=l.t.x-ux*(l.t.r+2),ey=l.t.y-uy*(l.t.r+2);
  if(l.kind==='chain')ctx.strokeStyle=dim?'rgba(191,90,60,.12)':'rgba(191,90,60,.6)';
  else if(l.kind==='cite')ctx.strokeStyle=dim?'rgba(108,143,107,.10)':'rgba(108,143,107,.55)';
  else ctx.strokeStyle=dim?'rgba(183,177,165,.05)':'rgba(183,177,165,.22)';
  ctx.lineWidth=(l.kind==='chain'?2:l.kind==='cite'?1.3:0.6)/scale;ctx.beginPath();ctx.moveTo(l.s.x,l.s.y);ctx.lineTo(ex,ey);ctx.stroke();
  if(l.kind==='chain'&&!dim){ctx.fillStyle='rgba(191,90,60,.7)';let s=7/scale,aa=Math.atan2(dy,dx);ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(ex-s*Math.cos(aa-.4),ey-s*Math.sin(aa-.4));ctx.lineTo(ex-s*Math.cos(aa+.4),ey-s*Math.sin(aa+.4));ctx.closePath();ctx.fill();}}
 for(let n of nodes){let dim=(hs&&!hs.has(n.id))||!vis(n)||(focusSet&&!focusSet.has(n.id));ctx.globalAlpha=dim?0.12:1;
  ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,7);ctx.fillStyle=COL[n.type];ctx.fill();
  if(n.type==='hub'||n.type==='question'){ctx.lineWidth=1.5/scale;ctx.strokeStyle='#fcfbf7';ctx.stroke();}
  if(n===hi){ctx.lineWidth=2.5/scale;ctx.strokeStyle='#1f1b16';ctx.stroke();}
  let big=n.type==='hub'||n.type==='question'||n.type==='answer';
  let showL=true;
  if(!(focusSet&&!focusSet.has(n.id))&&showL&&!dim){ctx.globalAlpha=1;
   ctx.font=(n.type==='hub'?'700 16':n.type==='question'?'700 13.5':n.type==='answer'?'600 12.5':'11')+"px 'IBM Plex Sans',sans-serif";
   ctx.fillStyle=n.type==='hub'?'#176087':n.type==='question'?'#a8472f':n.type==='answer'?'#4f6e4e':'#57524a';ctx.textAlign='center';
   ctx.fillText(n.label,n.x,n.y+n.r+13);}}

function loop(){step();draw();requestAnimationFrame(loop);}loop();
function toW(px,py){return{x:(px-tx)/scale,y:(py-ty)/scale}}
function pick(px,py){let w=toW(px,py),b=null,bd=1e9;for(let n of nodes){let dx=n.x-w.x,dy=n.y-w.y,d=Math.hypot(dx,dy);if(d<n.r+5&&d<bd){bd=d;b=n;}}return b;}
let drag=null,pan=null;
cv.addEventListener('mousedown',e=>{let n=pick(e.clientX,e.clientY);if(n){drag=n;n.fx=n.x;n.fy=n.y;showDetail(n);}else{pan={x:e.clientX,y:e.clientY,tx,ty};}});
window.addEventListener('mousemove',e=>{if(drag){let w=toW(e.clientX,e.clientY);drag.fx=w.x;drag.fy=w.y;alpha=Math.max(alpha,.25);}else if(pan){tx=pan.tx+e.clientX-pan.x;ty=pan.ty+e.clientY-pan.y;}else{hover=pick(e.clientX,e.clientY);cv.style.cursor=hover?'pointer':'grab';}});
window.addEventListener('mouseup',()=>{if(drag){drag.fx=drag.fy=null;drag=null;}pan=null;});
cv.addEventListener('wheel',e=>{e.preventDefault();let w=toW(e.clientX,e.clientY);let ns=Math.max(0.15,Math.min(5,scale*(e.deltaY<0?1.12:0.89)));tx=e.clientX-w.x*ns;ty=e.clientY-w.y*ns;scale=ns;},{passive:false});
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function showDetail(n){sel=n;let d=document.getElementById('detail');d.style.display='block';
 let h='';
 if(n.type==='paper'||n.type==='hub'){h='<div class="t" style="color:'+COL[n.type]+'">'+(n.type==='hub'?'허브 · TOPIC':'논문 · PAPER')+'</div><h2>'+esc(n.title||n.label)+'</h2><div class="body">'+esc(n.summary||'')+'</div>';}
 else if(n.type==='question'){
  h='<div class="t" style="color:#bf5a3c">질문 · QUESTION</div><h2>'+esc(n.full)+'</h2>';
  h+='<div class="ch">위키가 준 답 · 근거</div>';
  for(let pt of (n.parts||[])){h+='<div class="body" style="margin-bottom:7px">'+esc(pt[0]);
   if(pt[1]&&pt[1].length)h+=' <span style="color:#176087;font-weight:600">['+pt[1].map(esc).join(' · ')+']</span>';h+='</div>';}
  let cited=(n.cited||[]).map(id=>byId[id]).filter(Boolean);
  if(cited.length){h+='<div class="ch">근거 논문 '+cited.length+'편 (전체)</div>';for(let p of cited)h+='<div class="it"><b>'+esc(p.label)+'</b> — '+esc((p.summary||'').slice(0,110))+'</div>';}}
 d.innerHTML=h;}
cv.addEventListener('click',e=>{if(!pick(e.clientX,e.clientY)){sel=null;document.getElementById('detail').style.display='none';}});
document.querySelectorAll('.fbtn[data-f]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.fbtn[data-f]').forEach(x=>x.classList.remove('on'));b.classList.add('on');filter=b.dataset.f;});
function focusQuestion(qid){let q=byId[qid];if(!q)return;let cl=[q];
 (q.cited||[]).forEach(id=>{if(byId[id])cl.push(byId[id]);});focusSet=new Set(cl.map(n=>n.id));
 let a=1e9,b=1e9,c=-1e9,d=-1e9;for(let n of cl){a=Math.min(a,n.x);c=Math.max(c,n.x);b=Math.min(b,n.y);d=Math.max(d,n.y);}
 let bw=Math.max(c-a,240),bh=Math.max(d-b,170),pad=160;scale=Math.min((W-pad*2)/bw,(H-pad*2-120)/bh,1.6);tx=W/2-(a+c)/2*scale;ty=(H/2+50)-(b+d)/2*scale;
