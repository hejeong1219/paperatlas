tps://hejeong1219.github.io/paperatlas/sources/chen-2026-global-impact-germline-structural-variation-cancer-proteome"}, {"label": "Wang 2026 CAR-T", "url": "https://hejeong1219.github.io/paperatlas/sources/wang-2026-clinical-outcomes-spatial-transcriptomic-profiles-car"}]}, {"id": "Q41", "type": "q", "label": "Q41", "title": "Primary vs acquired resistance를 multi-omic layer로 어떻게 분리해 비교하는가 (CRC anti-EGFR + KRAS G12Ci, NSCLC osimertinib DTP, breast TNBC NAC 등)?", "sec": "E", "secname": "Response prediction / Resistance / Clinical translation", "color": "#bb5a4c", "cited": ["Lee 2026", "Hsu 2025", "Memon 2024"], "anchor": "DOM::multiomics", "answer": "Lee 2026 Korean TNBC는 baseline n=41과 paired post-treatment residual tumor n=22를 WES+RNA+TMT+phospho 4-layer로 측정해, <b>non-pCR(1차 내성)</b> 메커니즘은 estrogen response + GRK2 PTM-SEA + ITGB8 7p21 + AKR1C2 + ABCA13 5축으로, <b>residual tumor(잔존 종양)에서는 AURKB phospho + EMT/myogenesis enriched</b> 신호로 분리합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/lee-2026-proteogenomic-decoding-chemotherapy-resistance-tnbc\" target=\"_blank\">Lee 2026</a>). Hsu 2025 osimertinib DTP는 PCA로 DMSO/acute/DTP/recovery 4 상태를 분리(PC1 52.3%, PC2 13.4%), KSEA + CausalPath로 acute 억제 후 DTP에서 PI3K-AKT/MAPK/PKA/PKC re-activation, CDK1 substrate signaling, BAD S99/S118 hyperphospho를 <b>drug-tolerant persister(2차 내성 전 단계) 시그니처</b>로 정의합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/hsu-2025-phosphoproteomics-osimertinib-tolerant-persister-cells-reveals\" target=\"_blank\">Hsu 2025</a>). Memon 2024 NSCLC 1,201명 코호트는 PD-(L)1 acquired resistance(initial responder 60%↑)에서 <b>IFNγ signature \"stable\" vs \"increase\" stratification + B2M loss + 항원제시 결함</b>을 paired pre/post WES + transcriptome으로 분리합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/memon-2024-clinical-molecular-features-acquired-resistance\" target=\"_blank\">Memon 2024</a>). 한미암 위암 1차 vs 2차 내성 분석은 baseline–residual–progression 3 timepoint sampling + WES/WGS+RNA+단백체+phospho multi-layer에서 axis별로 (driver mutation / phospho-program / immune state) 분리해 비교할 수 있겠습니다.", "cites": [{"label": "Lee 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/lee-2026-proteogenomic-decoding-chemotherapy-resistance-tnbc"}, {"label": "Hsu 2025", "url": "https://hejeong1219.github.io/paperatlas/sources/hsu-2025-phosphoproteomics-osimertinib-tolerant-persister-cells-reveals"}, {"label": "Memon 2024", "url": "https://hejeong1219.github.io/paperatlas/sources/memon-2024-clinical-molecular-features-acquired-resistance"}]}, {"id": "Q42", "type": "q", "label": "Q42", "title": "RECIST / pCR / OS / PFS endpoint vs molecular endpoint (signaling activation, immune signature)의 prediction model 통합 strategy?", "sec": "E", "secname": "Response prediction / Resistance / Clinical translation", "color": "#bb5a4c", "cited": ["Lee 2026", "Sambath 2026", "Petralia 2024", "Chang 2026"], "anchor": "DOM::multiomics", "answer": "Lee 2026 Korean TNBC는 임상 endpoint(pCR)와 molecular endpoint(estrogen GSVA + GRK2 PTM-SEA + ITGB8 7p21 + AKR1C2 + ABCA13)를 logistic regression에 통합해 <b>non-pCR AUC 0.946</b>로 Lehmann 분류(AUC 0.781) + Lehmann+ESTIMATE(AUC 0.818)를 능가하는 사례를 제시합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/lee-2026-proteogenomic-decoding-chemotherapy-resistance-tnbc\" target=\"_blank\">Lee 2026</a>). Sambath 2026 인도 자궁경부암은 RECIST CCRT sens 19/res 17 binary classification으로 OncoKB Level 1 33% / 2 11% / 3A 25% / 4 5%를 매핑하며, EGFR amp Level 3 약물·DNA repair pathway hyperactivation을 mechanism으로 layer합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/sambath-2026-integrated-genomic-proteomic-cervical-cancer-chemoradiation-resistance\" target=\"_blank\">Sambath 2026</a>). Petralia 2024는 OAK trial RNA-classified `CD8+/IFNG+` 75/344명에서 atezolizumab arm PFS benefit이 docetaxel arm에서는 없음을 입증해 <b>treatment-specific molecular endpoint stratification</b>의 임상 검증을 제시합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/petralia-2024-pan-cancer-proteogenomics-characterization-tumor-immunity\" target=\"_blank\">Petralia 2024</a>). Chang 2026은 decision tree EFS(stage+DBAC), OS(stage+C3+PT1+IM2/3)로 임상 변수 + molecular feature 통합 prognostic model을 제시합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/chang-2026-integrative-proteogenomics-gastric-cancer-taiwan\" target=\"_blank\">Chang 2026</a>). 한미암 위암 코호트는 (i) 임상 endpoint(RECIST/pCR/OS/PFS) + (ii) molecular endpoint(phospho-driven kinase activity + immune subtype + driver mutation) ensemble model로 AUC 비교 및 SHAP feature ranking을 검토할 수 있겠습니다.", "cites": [{"label": "Lee 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/lee-2026-proteogenomic-decoding-chemotherapy-resistance-tnbc"}, {"label": "Sambath 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/sambath-2026-integrated-genomic-proteomic-cervical-cancer-chemoradiation-resistance"}, {"label": "Petralia 2024", "url": "https://hejeong1219.github.io/paperatlas/sources/petralia-2024-pan-cancer-proteogenomics-characterization-tumor-immunity"}, {"label": "Chang 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/chang-2026-integrative-proteogenomics-gastric-cancer-taiwan"}]}, {"id": "Q43", "type": "q", "label": "Q43", "title": "Drug-tolerant persister (DTP) cell state의 phosphoproteome signature와 임상 minimal residual disease와의 관계?", "sec": "E", "secname": "Response prediction / Resistance / Clinical translation", "color": "#bb5a4c", "cited": ["Hsu 2025", "Lee 2026"], "anchor": "DOM::multiomics", "answer": "Hsu 2025는 PC9 EGFR exon19del NSCLC 세포주에서 osimertinib 160 nM·21일 처리로 reversible drug-tolerant persister 상태를 형성하고, DIA-MS 기반 21,500 phosphopeptide/condition 측정으로 acute–DTP–recovery transition을 분리해 <b>CDK1 substrate(PML S518, SAMHD1 T592) + mTOR/S6 + YAP1/CYR61 + BAD S99/S118 hyperphosphorylation + MAPK/PI3K/PKA/PKC rebound</b>을 DTP-specific phosphoproteome signature로 정의합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/hsu-2025-phosphoproteomics-osimertinib-tolerant-persister-cells-reveals\" target=\"_blank\">Hsu 2025</a>). 저자들은 KSEA + CausalPath로 acute 억제 후 DTP에서 anti-apoptotic survival program이 재활성됨을 보이고 vistusertib / NSC-663428 / CRISPR CDK1·CDK2 KO로 DTP-specific vulnerability를 in vitro 검증해, DTP가 단순 cell line artifact가 아닌 <b>임상 minimal residual disease(MRD)와 가장 가까운 reversible adaptive state</b>로 해석될 수 있음을 시사합니다. Lee 2026 한국인 TNBC는 paired pre/post NAC sampling(baseline n=41, residual n=22)에서 residual tumor가 <b>AURKB phosphoproteome + EMT/myogenesis enriched</b> 상태로 수렴함을 보여, 임상 잔존 종양에서도 DTP-like phospho-program이 검출 가능함을 직접 입증하며 barasertib + paclitaxel synergy로 targetability까지 제시합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/lee-2026-proteogenomic-decoding-chemotherapy-resistance-tnbc\" target=\"_blank\">Lee 2026</a>). 한미암 위암 코호트에서는 baseline → on-treatment(ctDNA MRD-positive 시점) → progression의 longitudinal sampling에 phospho-DTP feature set(CDK1·AURKB·BAD·mTOR·YAP1) 정량을 추가해, MRD 단계에서 reversible vulnerability를 선제적으로 표적할 수 있는 phospho-MRD framework를 검토할 수 있겠습니다.", "cites": [{"label": "Hsu 2025", "url": "https://hejeong1219.github.io/paperatlas/sources/hsu-2025-phosphoproteomics-osimertinib-tolerant-persister-cells-reveals"}, {"label": "Lee 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/lee-2026-proteogenomic-decoding-chemotherapy-resistance-tnbc"}]}, {"id": "Q44", "type": "q", "label": "Q44", "title": "ICI resistance — KEAP1/STK11 변이, B2M loss, IFN-γ pathway disruption, neoantigen-loss escape, T cell exhaustion의 multi-omic 통합 readout?", "sec": "E", "secname": "Response prediction / Resistance / Clinical translation", "color": "#bb5a4c", "cited": ["Skoulidis 2018", "Skoulidis 2024", "Memon 2024", "Petralia 2024", "Chen 2026"], "anchor": "DOM::multiomics", "answer": "Skoulidis 2018·2024는 KRAS-mutant LUAD에서 <b>STK11/LKB1 + KEAP1</b> co-alteration이 PD-(L)1 monotherapy에 대한 primary resistance를 일으키고(PCP cohort KEAP1 mut median PFS 2.7 vs WT 5.7 mo, OS 7.6 vs 16.6 mo; HR PFS 2.07 / OS 2.24), CTLA-4 co-blockade(durvalumab+tremelimumab POSEIDON arm)가 myeloid 억제 → CD4 effector 재활성으로 부분 reversal을 일으킬 수 있음을 입증합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/skoulidis-2018-stk11-lkb1-pd1-resistance-kras-lung\" target=\"_blank\">Skoulidis 2018</a>, <a href=\"https://hejeong1219.github.io/paperatlas/sources/skoulidis-2024-ctla4-abrogates-keap1-stk11-resistance\" target=\"_blank\">Skoulidis 2024</a>). Memon 2024는 1,201명 NSCLC ICI 코호트의 acquired resistance(initial responder 60%↑)를 paired pre/post WES(n=22) + transcriptome(n=29)로 분석해 <b>IFNγ-response stable vs increase 2분층 + B2M LoF / class I HLA 단백 감소</b>의 antigen presentation 결함을 핵심 mechanism으로 보고하며, \"deserted/excluded\"가 아닌 <b>persistently inflamed but altered IFN response</b>라는 새 분류를 제시합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/memon-2024-clinical-molecular-features-acquired-resistance\" target=\"_blank\">Memon 2024</a>). Petralia 2024는 CPTAC 1,056 종양의 pan-cancer 7-immune subtype 분석에서 KEAP1/NFE2L2를 wound-healing/IFNG-low cluster에, STK11을 `CD8-/IFNG+` cluster에 매핑하고 OAK trial 외부 검증으로 `CD8+/IFNG+` subtype이 atezolizumab arm PFS benefit과는 일치하지만 docetaxel arm에서는 그렇지 않음을 보여, <b>multi-omic immune subtype이 treatment-specific stratifier</b>임을 입증합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/petralia-2024-pan-cancer-proteogenomics-characterization-tumor-immunity\" target=\"_blank\">Petralia 2024</a>). Chen 2026 germline SV proteome 분석은 LoF SV가 야기하는 1,847 low-protein outlier에서 <b>MHC class I antigen binding / antigen processing</b>가 핵심 enriched category임을 보여, germline level antigen presentation 취약성도 ICI resistance multi-omic readout에 추가 layer로 통합될 수 있음을 시사합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/chen-2026-global-impact-germline-structural-variation-cancer-proteome\" target=\"_blank\">Chen 2026</a>). 한미암 위암 코호트는 (i) WGS driver(KEAP1/STK11/B2M), (ii) germline SV antigen presentation outlier, (iii) phospho-IFNGR/JAK-STAT signaling, (iv) Petralia 7-subtype immune cluster, (v) paired pre/post IFNγ-response trajectory를 5-layer ensemble readout으로 통합해 primary vs acquired resistance를 분리 평가할 수 있겠습니다.", "cites": [{"label": "Skoulidis 2018", "url": "https://hejeong1219.github.io/paperatlas/sources/skoulidis-2018-stk11-lkb1-pd1-resistance-kras-lung"}, {"label": "Skoulidis 2024", "url": "https://hejeong1219.github.io/paperatlas/sources/skoulidis-2024-ctla4-abrogates-keap1-stk11-resistance"}, {"label": "Memon 2024", "url": "https://hejeong1219.github.io/paperatlas/sources/memon-2024-clinical-molecular-features-acquired-resistance"}, {"label": "Petralia 2024", "url": "https://hejeong1219.github.io/paperatlas/sources/petralia-2024-pan-cancer-proteogenomics-characterization-tumor-immunity"}, {"label": "Chen 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/chen-2026-global-impact-germline-structural-variation-cancer-proteome"}]}, {"id": "Q45", "type": "q", "label": "Q45", "title": "Basket trial / tumor-agnostic stratification (CPTAC pan-cancer therapeutic target)을 한미암 위암 코호트에 적용하는 framework?", "sec": "E", "secname": "Response prediction / Resistance / Clinical translation", "color": "#bb5a4c", "cited": ["Savage 2024", "Chakraborty 2024", "Chang 2026"], "anchor": "DOM::multiomics", "answer": "Savage 2024는 CPTAC 10 종양형 1,043명 코호트에서 2,863개 druggable protein을 정량하고 <b>mRNA→protein discordance가 cohort마다 크게 변동</b>함을 보여, target nomination을 transcript-only가 아닌 protein abundance + phospho-activation + genetic screen + drug response 외부 evidence ensemble로 정의해야 함을 명시합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/savage-2024-pan-cancer-proteogenomics-expands-landscape-therapeutic\" target=\"_blank\">Savage 2024</a>). Chakraborty 2024 review는 동일 framework를 \"overexpression / hyperactivation-driven druggable dependency\" + synthetic lethality + 공유 neoantigen(예: mutant KRAS peptide) 3 axis로 정리하며, 단일 omics layer가 놓치는 lineage-specific vulnerability를 pan-cancer 통합으로 회수할 수 있음을 강조합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/chakraborty-2024-pan-cancer-proteogenomics-vulnerabilities-opportunities\" target=\"_blank\">Chakraborty 2024</a>). Chang 2026 Taiwan GC 코호트(n=154)는 이 logic을 위암에 직접 적용해 <b>IHC+ (HER2/MMR/CLDN18.2/PD-L1) 50% + proteome-defined high 26% + IHC-negative 24%</b> 3-tier 환자 stratification에서 <b>CDK4가 공통 actionable hub</b>(FOXM1/RB1/RBL2/WDR77 phospho ↑)로 nominated되며, KEA3 location-specific kinase mapping(Loc 2 ABL1/SYK/ROCK, Loc 3 BRAF/CDK4/ERBB2, Loc 4 MET)으로 anatomy-aware basket arm을 설계할 수 있음을 보였습니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/chang-2026-integrative-proteogenomics-gastric-cancer-taiwan\" target=\"_blank\">Chang 2026</a>). 한미암 위암 코호트는 (i) Savage 2024 druggable protein 2,863개 dictionary, (ii) Chang 2026 IHC + proteome-defined + IHC-negative 3-tier 분류, (iii) phospho-activation evidence 가중치, (iv) shared neoantigen(KRAS G12C/D peptide) 후보를 결합한 <b>proteogenomic basket trial framework</b>로 설계해, 단일 organ 분류가 아닌 functional state 기반 arm 분배(예: CDK4 hub arm, MET arm, CLDN18.2 ADC arm)를 검토할 수 있겠습니다. 단 Chang 2026이 명시한 \"CDK4/6 단일제 GI 효과 미미(palbociclib phase II median PFS 1.8 mo)\"는 비선택적 적용을 막는 주요 caveat로 사료됩니다.", "cites": [{"label": "Savage 2024", "url": "https://hejeong1219.github.io/paperatlas/sources/savage-2024-pan-cancer-proteogenomics-expands-landscape-therapeutic"}, {"label": "Chakraborty 2024", "url": "https://hejeong1219.github.io/paperatlas/sources/chakraborty-2024-pan-cancer-proteogenomics-vulnerabilities-opportunities"}, {"label": "Chang 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/chang-2026-integrative-proteogenomics-gastric-cancer-taiwan"}]}, {"id": "Q46", "type": "q", "label": "Q46", "title": "AI 기반 drug response prediction (foundation model, multimodal histology + omics, LINCS L1000)의 외부 cohort 일반화 성능?", "sec": "E", "secname": "Response prediction / Resistance / Clinical translation", "color": "#bb5a4c", "cited": ["Liu 2025", "Cui 2026", "Chen 2024", "Guo 2026"], "anchor": "DOM::multiomics", "answer": "Liu 2025 MOFS는 IDH-wildtype 신경교종 FAHZZU1(n=122)에서 radiomics(5,929 MRI feature) + pathomics(CellProfiler) + WES + RNA-seq + DIA proteomics 5-layer를 11 fusion algorithm + COCA late fusion으로 통합한 3-subtype 분류(MOFS1/2/3)를, <b>17-algorithm ensemble transcriptomic classifier로 7개 외부 cohort(CGGA, GEO 6개)</b> 재현하고 <b>22-feature DNN radiomics classifier로 imaging-only n=992(FAHZZU3)</b>에서 log-rank P=0.00025로 prognostic separation을 외부 검증한 사례를 보고합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/liu-2025-multimodal-fusion-radio-pathology-proteogenomics-identify\" target=\"_blank\">Liu 2025</a>). MOFS3 TME-rich subtype은 외부 anti-PD-1 GBM cohort(Zhao 2019, PRJNA482620)에서 responder 군 enriched로 검증되어, <b>단일 modality clustering은 외부 prognostic separation 회수 불가</b>하지만 multimodal fusion은 일반화 가능함을 입증합니다. Cui 2026 Haiku는 H&E + mIF + clinical text를 tri-modal contrastive embedding으로 정렬해 cross-modal retrieval / clinical prediction / zero-shot biomarker inference 성능을 동시에 끌어올린 foundation model 후보로 surface되었지만, 외부 cohort 정량 검증치는 본 wiki page에 아직 추출 안 된 상태입니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/cui-2026-haiku-tri-modal-spatial-biology-histology\" target=\"_blank\">Cui 2026</a>). Guo 2026 scaling benchmark는 drug discovery foundation model의 \"larger=better\" 가정을 22개 endpoint로 시험해 calibration 측면에서 단순 scaling이 항상 우수하지 않음을 시사하지만 deep-dive는 미진행입니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/guo-2026-larger-models-scaling-benchmark-drug-discovery\" target=\"_blank\">Guo 2026</a>). Chen 2024 UNI는 general-purpose pathology foundation model로 surface되었으나 외부 drug response cohort 일반화 정량치는 wiki 본 페이지에 아직 미정리입니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/chen-2024-towards-general-purpose-foundation-model\" target=\"_blank\">Chen 2024</a>). 한미암 위암 코호트는 (i) 자체 omics+H&E로 학습한 모델을 (ii) CPTAC pan-cancer + Chang 2026 Taiwan GC + Mun 2019 Korean EOGC 외부 cohort에서 ensemble classifier로 transfer 검증 후, (iii) MRI-only DNN surrogate를 통해 routine 임상 변수 단독 deployment 가능성을 단계적으로 평가하는 framework를 검토할 수 있겠습니다.", "cites": [{"label": "Liu 2025", "url": "https://hejeong1219.github.io/paperatlas/sources/liu-2025-multimodal-fusion-radio-pathology-proteogenomics-identify"}, {"label": "Cui 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/cui-2026-haiku-tri-modal-spatial-biology-histology"}, {"label": "Chen 2024", "url": "https://hejeong1219.github.io/paperatlas/sources/chen-2024-towards-general-purpose-foundation-model"}, {"label": "Guo 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/guo-2026-larger-models-scaling-benchmark-drug-discovery"}]}, {"id": "Q47", "type": "q", "label": "Q47", "title": "Patient stratification logistic / Cox model 의 feature 우선순위 — 환자 층화 시 어떤 protein/phospho feature가 가장 robust한가?", "sec": "E", "secname": "Response prediction / Resistance / Clinical translation", "color": "#bb5a4c", "cited": ["Lee 2026", "Chang 2026", "Sambath 2026", "Zhao 2026"], "anchor": "DOM::multiomics", "answer": "Lee 2026 한국인 TNBC는 5-feature logistic regression(<b>estrogen response GSVA high / GRK2 PTM-SEA high / no ITGB8 deep loss / AKR1C2 high / ABCA13 high</b>)이 non-pCR 예측 AUC <b>0.946</b>으로 Lehmann 분류(0.781)·Lehmann+ESTIMATE(0.818)를 능가하며, 5 feature 모두 (i) global proteome 시그니처, (ii) phosphosite-level kinase activity, (iii) 7p21 CN status, (iv) doxorubicin metabolism / efflux mRNA의 mixed-layer 구성이 stratification robustness의 핵심임을 보였습니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/lee-2026-proteogenomic-decoding-chemotherapy-resistance-tnbc\" target=\"_blank\">Lee 2026</a>). Chang 2026 Taiwan GC는 Cox multivariable에서 stage + DBAC contribution이 EFS decision tree top split이며, <b>Loc 4 antrum-specific 5 protein/phospho biomarker(SHROOM1 / p-LYST S2627 / XYLT1 / CRIP1 / SPATS2L)</b> 가 KM Plotter 외부 cohort(n=118–875)에서 일관 검증되어 anatomy-conditional feature가 단일 feature보다 robust함을 시사합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/chang-2026-integrative-proteogenomics-gastric-cancer-taiwan\" target=\"_blank\">Chang 2026</a>). Sambath 2026 인도 자궁경부암 코호트는 single-marker로 <b>STX3 단백 증가</b>가 추가 32명 IHC validation에서 resistant 환자에 일관 elevated, <b>EGFR 7p amplification</b>(OncoKB Level 3)이 resistant 환자 6/17에 cluster되어 actionable protein-CNA feature가 RECIST resistant 예측에 기여함을 보고합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/sambath-2026-integrated-genomic-proteomic-cervical-cancer-chemoradiation-resistance\" target=\"_blank\">Sambath 2026</a>). Zhao 2026 CRLM은 LM proteome unsupervised clustering으로 C1(metabolism) / C2(RNA function) 2 subtype을 정의하고 <b>FTCD / GPD1 / SOD2 / EIF4B S422 phospho</b> 4-feature를 independent n=87 IHC cohort에서 OS/PFS log-rank p<0.05로 재현해, subtype + phospho biomarker hybrid가 robust임을 입증합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/zhao-2026-proteogenomic-characterization-reveals-metabolic-vulnerabilities\" target=\"_blank\">Zhao 2026</a>). 공통 패턴은 <b>(a) single layer single feature보다 mixed-layer ensemble이 AUC를 일관 상승시키고, (b) anatomy/subtype/race conditional split이 globally averaged feature보다 외부 cohort 재현성이 높으며, (c) phospho-driven kinase activity(GRK2, p-LYST, EIF4B S422)가 protein abundance만으로 잡히지 않는 vulnerability를 보강</b>한다는 것입니다. 한미암 위암 코호트에서는 stage + anatomy(Chang Loc) + protein subtype + phospho-kinase activity의 4-layer ensemble Cox/logistic 모델 + SHAP feature ranking으로 외부 cohort cross-validation을 검토할 수 있겠습니다.", "cites": [{"label": "Lee 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/lee-2026-proteogenomic-decoding-chemotherapy-resistance-tnbc"}, {"label": "Chang 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/chang-2026-integrative-proteogenomics-gastric-cancer-taiwan"}, {"label": "Sambath 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/sambath-2026-integrated-genomic-proteomic-cervical-cancer-chemoradiation-resistance"}, {"label": "Zhao 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/zhao-2026-proteogenomic-characterization-reveals-metabolic-vulnerabilities"}]}, {"id": "Q48", "type": "q", "label": "Q48", "title": "Druggable target prioritization (Savage 2024) framework — synthetic lethality, dependency, surface targetability를 어떻게 통합?", "sec": "E", "secname": "Response prediction / Resistance / Clinical translation", "color": "#bb5a4c", "cited": ["Savage 2024", "Hamilton 2024", "Lee 2026", "Han 2026"], "anchor": "DOM::multiomics", "answer": "Savage 2024는 CPTAC 10-cohort 1,043 종양에서 2,863개 druggable protein dictionary를 정의하고, target nomination 의사결정을 (i) <b>tumor proteomics + phosphoproteomics 기반 overexpression / hyperactivation evidence</b>, (ii) cell-line <b>genetic screen + drug response (e.g., DepMap, GDSC) dependency evidence</b>, (iii) <b>TSG loss → synthetic lethal partner mapping</b>, (iv) <b>MHC binding prediction 기반 shared(public) neoantigen 후보</b> (예: mutant KRAS peptide) 4 layer ensemble로 통합하는 framework를 제시합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/savage-2024-pan-cancer-proteogenomics-expands-landscape-therapeutic\" target=\"_blank\">Savage 2024</a>). Hamilton 2024는 neuroblastoma surfaceome study에서 <b>proteomic + transcriptomic + epigenomic</b> 통합으로 60개 high-confidence surface immunotherapy target candidate를 nominate하고 DLK1(super-enhancer 연동)을 우선순위화한 뒤 ADCT-701 ADC로 xenograft 효능을 검증해, surface targetability axis가 단순 mRNA 단독으로는 신뢰할 수 없고 protein-level surface 정량이 필수임을 보였습니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/hamilton-2024-proteogenomic-surfaceome-study-identifies-dlk1\" target=\"_blank\">Hamilton 2024</a>). Lee 2026 TNBC는 동일 framework를 한국인 코호트에 적용해 <b>7p21 CN + Cancer Surfaceome Atlas 교집합 3개(ITGB8, THSD7A, TSPAN13)</b> 를 ADC 표적 후보로 nominate하고 SGN-B6A integrin-targeting ADC 개발 reference를 명시합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/lee-2026-proteogenomic-decoding-chemotherapy-resistance-tnbc\" target=\"_blank\">Lee 2026</a>). Han 2026은 HCT-116 CRC 세포주에서 ERK2 / PLK1 / PIK3CA / PAK4 CRISPR KO 각각의 phospho-rewiring을 KSEA + TMT 7,531 protein/10,877 phosphopeptide 통합으로 측정해 <b>ERK2 loss + RPS6KB1 inhibition의 synthetic lethal interaction</b>을 직접 nominate하며, dependency layer가 cell-line perturbation으로 보강될 수 있음을 보였습니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/han-2026-proteomics-phosphoproteomics-human-colorectal-cancer\" target=\"_blank\">Han 2026</a>). 한미암 위암 코호트에서는 (i) Savage 2024 druggable dictionary 매핑, (ii) Cancer Surfaceome Atlas 교차로 surface targetability sub-list 추출, (iii) DepMap dependency overlay, (iv) CDH1/TP53/ARID1A LoF → synthetic lethal partner inference, (v) shared neoantigen 후보(KRAS, mutant CDH1 등) prediction의 5-layer ensemble로 표적 우선순위표를 작성할 수 있겠습니다.", "cites": [{"label": "Savage 2024", "url": "https://hejeong1219.github.io/paperatlas/sources/savage-2024-pan-cancer-proteogenomics-expands-landscape-therapeutic"}, {"label": "Hamilton 2024", "url": "https://hejeong1219.github.io/paperatlas/sources/hamilton-2024-proteogenomic-surfaceome-study-identifies-dlk1"}, {"label": "Lee 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/lee-2026-proteogenomic-decoding-chemotherapy-resistance-tnbc"}, {"label": "Han 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/han-2026-proteomics-phosphoproteomics-human-colorectal-cancer"}]}, {"id": "Q49", "type": "q", "label": "Q49", "title": "EBV / HBV / HPV-associated cancer의 viral-driven proteome reshape이 면역치료 반응 예측에 주는 시사점?", "sec": "E", "secname": "Response prediction / Resistance / Clinical translation", "color": "#bb5a4c", "cited": ["Gao 2019", "Huang 2021", "Sambath 2026", "Petralia 2024"], "anchor": "DOM::multiomics", "answer": "Gao 2019는 HBV-related HCC paired tumor/NAT 159 환자 코호트에서 proteomic subgrouping으로 <b>3개 subtype</b>을 정의해 환자 생존·tumor thrombus·CTNNB1/TP53 변이 신호와 연결하고, mutated CTNNB1 → ALDOA phosphorylation → glycolysis 가속이라는 <b>HBV-driven metabolic reshape</b> 축을 검증해 viral-driven 종양의 면역치료 stratification이 단순 viral status 이항이 아닌 metabolic subtype별로 분리되어야 함을 시사합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/gao-2019-integrated-proteogenomic-characterization-hbv-related-hepatocellular\" target=\"_blank\">Gao 2019</a>). Huang 2021은 HPV-negative HNSCC 108 코호트(WES+WGS+RNA+proteome+phospho)에서 <b>immune-cold tumors는 항원 부족이 아니라 IFNGR2/JAK2/IRF1 CN deletion 매개 antigen presentation machinery 결함이 핵심</b>이며, 통합 NMF로 정의된 Immune subtype은 multiple checkpoint/suppressor protein 동시 발현으로 PD-1 monotherapy보다 combination ICB를 시사함을 명시합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/huang-2021-proteogenomic-insights-biology-treatment-hpv-negative\" target=\"_blank\">Huang 2021</a>). Sambath 2026 HPV-positive 인도 자궁경부암 36명은 SBS2/SBS13 APOBEC signature(84-92% 환자)와 PIK3CA helical/C2 변이가 co-occur하며, resistant 17명에 EGFR 7p amplification + STK11 SV deletion이 enriched되어 <b>HPV-driven APOBEC mutagenesis가 neoantigen 부담 + PI3K-AKT hyperactivation → CCRT resistance</b> 축을 동시에 만든다는 viral-driven proteome reshape mechanism을 보고합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/sambath-2026-integrated-genomic-proteomic-cervical-cancer-chemoradiation-resistance\" target=\"_blank\">Sambath 2026</a>). Petralia 2024 pan-cancer 분석은 7-immune subtype 중 <b>`CD8-/IFNG+` subtype이 East Asian 환자에서 European 환자보다 enriched</b>임을 보여, viral-associated GC(EBV+) 같은 동아시아 특이 컨텍스트에서 IFNG signaling은 활성이지만 CD8 infiltration이 낮은 dissociated phenotype이 ICI 반응 예측에 중요한 layer임을 시사합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/petralia-2024-pan-cancer-proteogenomics-characterization-tumor-immunity\" target=\"_blank\">Petralia 2024</a>). 한미암 위암 코호트는 EBV+ GC subset 식별 후 (i) HBV/HPV 사례 reference로 metabolic + antigen presentation + IFNG signaling 3-layer reshape를 분석하고, (ii) APOBEC signature와 phospho-PI3K-AKT axis 정량을 결합한 viral-driven ICI response predictor를 검토할 수 있겠습니다.", "cites": [{"label": "Gao 2019", "url": "https://hejeong1219.github.io/paperatlas/sources/gao-2019-integrated-proteogenomic-characterization-hbv-related-hepatocellular"}, {"label": "Huang 2021", "url": "https://hejeong1219.github.io/paperatlas/sources/huang-2021-proteogenomic-insights-biology-treatment-hpv-negative"}, {"label": "Sambath 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/sambath-2026-integrated-genomic-proteomic-cervical-cancer-chemoradiation-resistance"}, {"label": "Petralia 2024", "url": "https://hejeong1219.github.io/paperatlas/sources/petralia-2024-pan-cancer-proteogenomics-characterization-tumor-immunity"}]}, {"id": "Q50", "type": "q", "label": "Q50", "title": "한국인 / 동아시아 cohort specific finding (Korean NSCLC, Korean TNBC, Chinese HER2-low, Taiwanese GC, Indian cervical)을 한미암 위암 코호트에 비교 분석하는 방법론?", "sec": "E", "secname": "Response prediction / Resistance / Clinical translation", "color": "#bb5a4c", "cited": ["Chen 2020", "Song 2024", "Lee 2026", "Jiang 2024", "Chang 2026", "Sambath 2026", "Petralia 2024"], "anchor": "DOM::multiomics", "answer": "다섯 개 Asia/South Asia cohort 모두 WES/WGS + RNA + TMT proteome + phosphoproteome 동일 4-layer protocol을 채택하고 raw data를 controlled-access(dbGaP / CPTAC PDC / NCBI BioProject)로 공개해 한미암 위암 코호트와 cross-cohort 재분석이 직접 가능합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/chen-2020-proteogenomics-non-smoking-lung-cancer-east\" target=\"_blank\">Chen 2020 Taiwan NSCLC</a>: PDC000219/220 + dbGaP phs001954; <a href=\"https://hejeong1219.github.io/paperatlas/sources/song-2024-proteogenomic-analysis-reveals-non-small-cell\" target=\"_blank\">Song 2024 Korean NSCLC</a>; <a href=\"https://hejeong1219.github.io/paperatlas/sources/lee-2026-proteogenomic-decoding-chemotherapy-resistance-tnbc\" target=\"_blank\">Lee 2026 Korean TNBC</a>: PDC000695/696 + PRJNA1422844/45; <a href=\"https://hejeong1219.github.io/paperatlas/sources/jiang-2024-integrated-multiomic-profiling-breast-cancer\" target=\"_blank\">Jiang 2024 Chinese 773 BC</a>; <a href=\"https://hejeong1219.github.io/paperatlas/sources/chang-2026-integrative-proteogenomics-gastric-cancer-taiwan\" target=\"_blank\">Chang 2026 Taiwan GC</a>: PDC000645/649 + dbGaP phs004447; <a href=\"https://hejeong1219.github.io/paperatlas/sources/sambath-2026-integrated-genomic-proteomic-cervical-cancer-chemoradiation-resistance\" target=\"_blank\">Sambath 2026 Indian cervical</a>). 비교 방법론의 핵심은 (i) <b>race-specific driver enrichment 검증</b>(Jiang 2024 Asian AKT1 hotspot mutation enriched; Chang 2026 KMT2D 24% Asian vs TCGA 9-16%; CDH1 in female diffuse GC; PIK3CA 11% lower than Caucasian 12-26%; Chen 2020 EGFR 85% in non-smoking East Asian LUAD vs Western <30%), (ii) <b>environmental/dietary signature 재현</b>(Chang 2026 DBAC PAH signature가 Taiwan + Japan에 존재하지만 TCGA Western에는 absent — 한국 grilled meat 소비 패턴과 직접 매핑 검증 가능), (iii) <b>subtype label transfer</b>(Lee 2026 NMF 5-cluster + METABRIC k-NN mapping 76.3% assignment; Chang 2026 PT1-IM 분기 한미암 GC에서 stage 단독보다 강한 prognostic value 검증), (iv) <b>phospho-driven kinase activity cross-validation</b>(Petralia 2024 `CD8-/IFNG+` subtype이 East Asian에 enriched), (v) <b>shared regimen 매칭</b>(Lee 2026 AC→weekly paclitaxel 72% — carboplatin 12%만 사용으로 한국 임상 현실 그대로 반영) 5축으로 정리됩니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/petralia-2024-pan-cancer-proteogenomics-characterization-tumor-immunity\" target=\"_blank\">Petralia 2024</a>). 한미암 위암 코호트는 (a) 동일 4-layer protocol(WES/WGS+RNA+TMT+phospho) 채택, (b) Chang 2026 NMF subtype 재할당 + DBAC signature 재현성 검증, (c) Mun 2019 Korean EOGC + Jiao 2025 pangenome reference와 직접 통합 분석, (d) East Asian-specific feature(KMT2D / CDH1 female diffuse / DBAC / `CD8-/IFNG+`)를 한국 위암 cohort에서 priority 검증 target으로 설정하는 방법론을 검토할 수 있겠습니다.", "cites": [{"label": "Chen 2020", "url": "https://hejeong1219.github.io/paperatlas/sources/chen-2020-proteogenomics-non-smoking-lung-cancer-east"}, {"label": "Song 2024", "url": "https://hejeong1219.github.io/paperatlas/sources/song-2024-proteogenomic-analysis-reveals-non-small-cell"}, {"label": "Lee 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/lee-2026-proteogenomic-decoding-chemotherapy-resistanc   // 3) CM 세부축
  for(const n of nodes){if(n.type==='subhub'){lbl(n.x,n.y,n.r,n.label,'600 11px IBM Plex Sans',hexA(n.color,0.92));}}
  // 4) 논문 (어느 정도 확대 시, 빈 자리에만)
  if(scale>0.95){for(const n of nodes){if(n.type==='paper'&&n!==sel){lbl(n.x,n.y,n.r,n.label,'500 10px IBM Plex Sans','rgba(55,48,40,.82)');}}}
}
function loop(){step();draw();requestAnimationFrame(loop);}loop();

function toW(px,py){return{x:(px-tx)/scale,y:(py-ty)/scale}}
function pick(px,py){let w=toW(px,py),b=null,bd=1e9;for(const n of nodes){let dx=n.x-w.x,dy=n.y-w.y,d=Math.hypot(dx,dy);if(d<n.r/1+6/scale+2&&d<bd){bd=d;b=n;}}return b;}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function showD(n){sel=n;let d=document.getElementById('detail');d.style.display='block';
  if(n.type==='hub'){d.innerHTML='<div class="t">'+(n.id==='DOM::multiomics'?'내 집중 영역':'도메인')+'</div><h2>'+esc(n.label)+'</h2><div class="body">논문 '+n.cnt+'편</div>';}
  else if(n.type==='subhub'){d.innerHTML='<div class="t">Cancer Multiomics 세부축</div><h2>'+esc(n.label)+'</h2><div class="body">CM 영역 안의 세부 주제 · 논문 '+n.cnt+'편</div>';}
  else if(n.type==='q'){
    let cites=(n.cites||[]).map(c=>'<a href="'+c.url+'" target="_blank" style="display:inline-block;margin:5px 6px 0 0;padding:4px 9px;font-size:11px;color:#176087;text-decoration:none;border:1px solid #cfe0e6;border-radius:6px">'+esc(c.label)+' →</a>').join('');
    d.innerHTML='<div class="t">내 질문 · '+esc(n.id)+' · '+esc(n.secname)+'</div><h2>'+esc(n.title)+'</h2>'
      +'<div class="body"><div style="font-weight:700;color:#176087;margin-bottom:5px">위키가 정리한 답 (근거 포함)</div>'+(n.answer||'(답변 없음)')+'</div>'
      +(cites?'<div style="margin-top:13px"><div class="t">근거 논문</div>'+cites+'</div>':'');}
  else{d.innerHTML='<div class="t">논문</div><h2>'+esc(n.title||n.label)+'</h2><div class="body">도메인: '+esc((DATA.domains.find(x=>x[0]===n.group)||[])[1]||n.group)+'</div>'+(n.url?'<a class="wiki" href="'+n.url+'" target="_blank">📄 위키 페이지에서 열기 →</a>':'');}
}
cv.addEventListener('mousedown',e=>{let n=pick(e.clientX,e.clientY);if(n){drag=n;if(n.fx==null){drag._wasfree=true;}n.fx=n.x;n.fy=n.y;showD(n);}else pan={x:e.clientX,y:e.clientY,tx,ty};});
window.addEventListener('mousemove',e=>{if(drag){let w=toW(e.clientX,e.clientY);drag.fx=w.x;drag.fy=w.y;alpha=Math.max(alpha,.25);}else if(pan){tx=pan.tx+e.clientX-pan.x;ty=pan.ty+e.clientY-pan.y;}else{hover=pick(e.clientX,e.clientY);cv.style.cursor=hover?'pointer':'grab';}});
window.addEventListener('mouseup',()=>{if(drag){if(drag._wasfree){drag.fx=drag.fy=null;drag._wasfree=false;}drag=null;}pan=null;});
cv.addEventListener('wheel',e=>{e.preventDefault();let w=toW(e.clientX,e.clientY);let ns=Math.max(0.15,Math.min(7,scale*(e.deltaY<0?1.13:0.88)));tx=e.clientX-w.x*ns;ty=e.clientY-w.y*ns;scale=ns;},{passive:false});
cv.addEventListener('click',e=>{if(!pick(e.clientX,e.clientY)){sel=null;document.getElementById('detail').style.display='none';}});
cv.addEventListener('dblclick',e=>{let n=pick(e.clientX,e.clientY);if(n&&n.url)window.open(n.url,'_blank');});

function focusCM(){let h=byId['DOM::multiomics'];if(!h)return;scale=1.9;tx=W*0.5-h.x*scale;ty=H*0.52-h.y*scale;}
document.getElementById('cm').onclick=focusCM;
function focusQ(qid){let n=byId[qid];if(!n)return;sel=n;showD(n);scale=2.4;tx=W*0.5-n.x*scale;ty=H*0.5-n.y*scale;}
// ?focus=Q12
let m=location.search.match(/focus=([A-Za-z0-9]+)/);
if(m){setTimeout(()=>focusQ(m[1]),4300);}

// 범례
(function(){let L=document.getElementById('legend'),h='';
 for(const d of DATA.domains){let cnt=nodes.filter(n=>n.type==='paper'&&n.group===d[0]).length;
   h+='<div class="row"><span class="dot" style="background:'+d[2]+'"></span>'+d[1]+' <span style="color:#8a8170">'+cnt+'</span></div>';}
 h+='<div class="row"><span class="qm"></span>내 질문 50개</div>';
 h+='<div class="sub">Cancer Multiomics 세부축: '+DATA.cmaxes.map(a=>a[1]).join(' · ')+'</div>';
 L.innerHTML=h;})();
</script></body></html>
