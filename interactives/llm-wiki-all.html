discovery", "pp": 1}, {"source": "sources/matsushita-2020-neoantigen-load-hla-class-i-expression", "target": "sources/kasikova-2024-tertiary-lymphoid-structures-b-cells", "pp": 1}, {"source": "sources/matsushita-2020-neoantigen-load-hla-class-i-expression", "target": "sources/helmink-2020-b-cells-tertiary-lymphoid-structures", "pp": 1}, {"source": "sources/chen-2017-cancer-immune-set-point", "target": "sources/chen-2013-cancer-immunity-cycle", "pp": 1}, {"source": "sources/mountzios-2025-tarlatamab-small-cell-lung-cancer-after-platinum", "target": "sources/ahn-2023-tarlatamab-previously-treated-small-cell-lung-cancer", "pp": 1}, {"source": "sources/chen-2013-cancer-immunity-cycle", "target": "sources/chen-2017-cancer-immune-set-point", "pp": 1}, {"source": "HUB::Cancer Multiomics", "target": "HUB::PTM", "hubhub": 16}, {"source": "HUB::Cancer Multiomics", "target": "HUB::Cancer Resistance", "hubhub": 1}, {"source": "HUB::Cancer Resistance", "target": "HUB::PTM", "hubhub": 1}], "groups": {"B-Cell Neoantigen": "#9a7fbf", "PTM": "#6c8f6b", "Cancer Resistance": "#c0883e", "Cancer Multiomics": "#176087"}};const GR=DATA.groups;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');let W,H,DPR;
function resize(){DPR=window.devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';}resize();
// 허브 5개를 펜타곤 배치, Cancer Multiomics는 오른쪽(줌 타깃)
const HPOS={'B-Cell Neoantigen':[0.22,0.34],'PTM':[0.52,0.22],'Cancer Resistance':[0.82,0.40],'Cancer Multiomics':[0.58,0.64]};
const nodes=DATA.nodes.map(n=>{if(n.type==='hub'){let p=HPOS[n.group]||[0.5,0.5];return{...n,x:W*p[0],y:H*p[1],vx:0,vy:0,fx:W*p[0],fy:H*p[1]};}
 let p=HPOS[n.group]||[0.5,0.5];return{...n,x:W*p[0]+(Math.random()-.5)*260,y:H*p[1]+(Math.random()-.5)*260,vx:0,vy:0};});
const byId={};nodes.forEach(n=>byId[n.id]=n);
const links=DATA.links.map(l=>({s:byId[l.source],t:byId[l.target],hubhub:l.hubhub,pp:l.pp})).filter(l=>l.s&&l.t);
const deg={};links.forEach(l=>{deg[l.t.id]=(deg[l.t.id]||0)+1;});
nodes.forEach(n=>n.r=n.type==='hub'?(13+Math.sqrt(deg[n.id]||1)*1.1):2.4);
document.getElementById('sP').textContent=nodes.filter(n=>n.type==='paper').length;
document.getElementById('sG').textContent=Object.keys(GR).filter(g=>g!=='Other').length;
let lg='';for(let g in GR){lg+='<div class="row"><div class="dot" style="background:'+GR[g]+'"></div>'+g+'</div>';}document.getElementById('legend').innerHTML=lg;
let scale=0.72,tx=0,ty=0;
function autofit(){let __ns=nodes.filter(n=>n.type==='hub');let a=1e9,b=1e9,c=-1e9,d=-1e9;for(let n of __ns){a=Math.min(a,n.x);c=Math.max(c,n.x);b=Math.min(b,n.y);d=Math.max(d,n.y);}
 let bw=Math.max(c-a,1)*1.7,bh=Math.max(d-b,1)*1.7;scale=Math.min((W-260)/bw,(H-140)/bh,1.05);tx=W/2-(a+c)/2*scale;ty=H/2-(b+d)/2*scale;}
window.addEventListener('resize',()=>{resize();autofit();});setTimeout(autofit,4000);setTimeout(autofit,8000);
let alpha=1;
function step(){if(alpha<0.004)return;
 for(let i=0;i<nodes.length;i++){let a=nodes[i];for(let j=i+1;j<nodes.length;j++){let b=nodes[j];
  let dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy||1;if(d2>40000)continue;let d=Math.sqrt(d2);let f=260/d2;a.vx+=dx/d*f;a.vy+=dy/d*f;b.vx-=dx/d*f;b.vy-=dy/d*f;}}
 for(let l of links){let dx=l.t.x-l.s.x,dy=l.t.y-l.s.y,d=Math.sqrt(dx*dx+dy*dy)||1;let f=(d-70)*0.02;l.s.vx+=dx/d*f;l.s.vy+=dy/d*f;l.t.vx-=dx/d*f;l.t.vy-=dy/d*f;}
 for(let n of nodes){if(n.fx!=null){n.x=n.fx;n.y=n.fy;n.vx=n.vy=0;continue;}n.vx+=(W/2-n.x)*0.0006;n.vy+=(H/2-n.y)*0.0006;n.vx*=0.86;n.vy*=0.86;n.x+=n.vx;n.y+=n.vy;}alpha*=0.99;}
let hover=null,sel=null;
function draw(){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);ctx.setTransform(DPR*scale,0,0,DPR*scale,tx*DPR,ty*DPR);
 for(let l of links){
  if(l.hubhub){ctx.strokeStyle='rgba(70,62,52,.32)';ctx.lineWidth=(1+Math.min(l.hubhub,16)*0.45)/scale;}
  else{ctx.strokeStyle='rgba(183,177,165,.13)';ctx.lineWidth=0.5/scale;}
  ctx.beginPath();ctx.moveTo(l.s.x,l.s.y);ctx.lineTo(l.t.x,l.t.y);ctx.stroke();}
 for(let n of nodes){ctx.globalAlpha=1;ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,7);ctx.fillStyle=GR[n.group]||'#bdb7ab';ctx.fill();
  if(n.type==='hub'){ctx.lineWidth=2.5/scale;ctx.strokeStyle=n.group==='Cancer Multiomics'?'#176087':'#fcfbf7';ctx.stroke();
   if(n.group==='Cancer Multiomics'){ctx.lineWidth=1.5/scale;ctx.strokeStyle='#176087';ctx.beginPath();ctx.arc(n.x,n.y,n.r+6,0,7);ctx.stroke();}}
  if(n===hover&&n.type==='paper'){ctx.lineWidth=2/scale;ctx.strokeStyle='#1f1b16';ctx.stroke();}}
 for(let n of nodes){if(n.type==='hub'){ctx.font='700 '+(n.group==='Cancer Multiomics'?17:14)+"px 'IBM Plex Sans',sans-serif";
  ctx.fillStyle=GR[n.group];ctx.textAlign='center';ctx.fillText(n.label,n.x,n.y+n.r+16);}}
 if(hover&&hover.type==='paper'){ctx.font="600 11px 'IBM Plex Sans',sans-serif";ctx.fillStyle='#1f1b16';ctx.textAlign='center';ctx.fillText(hover.label,hover.x,hover.y-hover.r-5);}
}
function loop(){step();draw();requestAnimationFrame(loop);}loop();
function toW(px,py){return{x:(px-tx)/scale,y:(py-ty)/scale}}
function pick(px,py){let w=toW(px,py),b=null,bd=1e9;for(let n of nodes){let dx=n.x-w.x,dy=n.y-w.y,d=Math.hypot(dx,dy);if(d<n.r+5&&d<bd){bd=d;b=n;}}return b;}
let drag=null,pan=null;
cv.addEventListener('mousedown',e=>{let n=pick(e.clientX,e.clientY);if(n){drag=n;n.fx=n.x;n.fy=n.y;showD(n);}else pan={x:e.clientX,y:e.clientY,tx,ty};});
window.addEventListener('mousemove',e=>{if(drag){let w=toW(e.clientX,e.clientY);drag.fx=w.x;drag.fy=w.y;alpha=Math.max(alpha,.2);}else if(pan){tx=pan.tx+e.clientX-pan.x;ty=pan.ty+e.clientY-pan.y;}else{hover=pick(e.clientX,e.clientY);cv.style.cursor=hover?'pointer':'grab';}});
window.addEventListener('mouseup',()=>{if(drag){drag.fx=drag.fy=null;drag=null;}pan=null;});
cv.addEventListener('wheel',e=>{e.preventDefault();let w=toW(e.clientX,e.clientY);let ns=Math.max(0.15,Math.min(6,scale*(e.deltaY<0?1.13:0.88)));tx=e.clientX-w.x*ns;ty=e.clientY-w.y*ns;scale=ns;},{passive:false});
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function showD(n){sel=n;let d=document.getElementById('detail');d.style.display='block';
 if(n.type==='hub')d.innerHTML='<div class="t" style="color:'+GR[n.group]+'">연구 주제</div><h2>'+esc(n.label)+'</h2><div class="body">이 주제 클러스터. 줌인하면 논문 라벨이 보입니다.</div>';
 else{let h='<div class="t" style="color:'+GR[n.group]+'">논문 · '+esc(n.group)+'</div><h2>'+esc(n.label)+'</h2><div class="body">'+esc(n.summary||'')+'</div>';if(n.url)h+='<a href="'+n.url+'" target="_blank" style="display:inline-block;margin-top:12px;font-size:12px;color:#176087;font-weight:600;text-decoration:none">📄 위키 페이지에서 열기 →</a>';d.innerHTML=h;}}
cv.addEventListener('click',e=>{if(!pick(e.clientX,e.clientY)){sel=null;document.getElementById('detail').style.display='none';}});
cv.addEventListener('dblclick',e=>{let n=pick(e.clientX,e.clientY);if(n&&n.url)window.open(n.url,'_blank');});
function focusCM(){let h=byId['HUB::Cancer Multiomics'];if(!h)return;scale=1.6;tx=W*0.5-h.x*scale;ty=H*0.5-h.y*scale;}
window.focusCM=focusCM;
