": "q", "label": "Q1", "title": "SV breakpoint pattern (translocation, tandem dup, inversion)이 cancer proteome에 실제로 반영되는 비율은 pan-cancer scale에서 어떻게 정량되는가?", "sec": "A", "secname": "WGS variant interpretation", "color": "#c0883e", "cited": ["Chen 2023", "Chen 2026"], "anchor": "DOM::multiomics", "answer": "Chen 2023 pan-cancer 1,307 tumor 코호트의 SV–proteomics 통합 분석은 SV-associated cis-regulatory alteration이 mRNA에서 관찰되는 유전자 중 <b>약 25%만 단백질 수준에서도 일관되게 반영</b>됨을 정량적으로 보고합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/chen-2023-global-impact-somatic-structural-variation-cancer-proteome\" target=\"_blank\">Chen 2023</a>). 자매 연구인 Chen 2026 germline SV 분석은 paired SV caller(Delly ∩ SVABA)로 식별된 364개 recurrent SV-altered gene 중 <b>17%(129/364)</b> 만이 mRNA·protein concordant cis-regulation을 보였고, 동일 set의 <b>33%는 protein-only direction</b>(mRNA로는 약한 변화만 잡힘)이라는 비대칭을 명시합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/chen-2026-global-impact-germline-structural-variation-cancer-proteome\" target=\"_blank\">Chen 2026</a>). 즉 enhancer hijacking·retrotransposon translocation·CGI methylation 매개 SV는 mRNA layer만으로는 ~3분의 1을 놓칠 수 있어, SV-aware proteogenomics가 필수적으로 시사됩니다. 한미암 위암 코호트에서도 SV-only / RNA-only / protein-only / triple-concordant 4분면으로 cis-effect를 layer해 단백체 evidence 기반 SV consequence를 평가할 수 있겠습니다.", "cites": [{"label": "Chen 2023", "url": "https://hejeong1219.github.io/paperatlas/sources/chen-2023-global-impact-somatic-structural-variation-cancer-proteome"}, {"label": "Chen 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/chen-2026-global-impact-germline-structural-variation-cancer-proteome"}]}, {"id": "Q2", "type": "q", "label": "Q2", "title": "Germline structural variation (Chen 2026)이 cancer proteome cis-effect를 통해 단백 저발현/이상발현을 어떻게 일으키는가?", "sec": "A", "secname": "WGS variant interpretation", "color": "#c0883e", "cited": ["Chen 2026"], "anchor": "DOM::multiomics", "answer": "Chen 2026은 CPTAC 11개 종양형 1,637명의 normal WGS에서 paired SV caller로 704,263개 distinct germline SV를 식별하고, 그 중 25,781개 LoF SV(SVAnnotate frameshift/exon-deletion/stop-gain)가 paired proteomics에서 <b>1,847개 low-protein outlier event (FDR<10%, 512 genes × 786 patients)</b> 를 야기함을 보고합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/chen-2026-global-impact-germline-structural-variation-cancer-proteome\" target=\"_blank\">Chen 2026</a>). 기능적 enrichment는 <b>MHC class I antigen binding / antigen processing / exosome / mitochondrial matrix / Golgi</b> 카테고리에 집중되어 germline SV가 면역회피와도 연결될 수 있음을 시사합니다. 단백 저발현 메커니즘은 (i) coding exon deletion → frameshift LoF, (ii) <b>CGI methylation 매개</b>(1,237 CGI probe FDR<10%), (iii) <b>enhancer methylation 매개</b>(109 SV-enhancer pair, 41개는 CBTN 소아 뇌종양 코호트에서 p<1E-22로 reproduce) 세 축으로 분해됩니다. 한미암 한국인 위암 코호트에서도 germline SV → CGI/enhancer methylation → 단백 저발현 cascade를 평가하는 분석 파이프라인 설계에 참고할 수 있겠습니다.", "cites": [{"label": "Chen 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/chen-2026-global-impact-germline-structural-variation-cancer-proteome"}]}, {"id": "Q3", "type": "q", "label": "Q3", "title": "Chromothripsis / focal amplification (EGFR 7p, MYC, ERBB2 17q)이 phosphoproteome state에 미치는 effect의 양적 측정?", "sec": "A", "secname": "WGS variant interpretation", "color": "#c0883e", "cited": ["Sambath 2026", "Xu 2026", "Chen 2023"], "anchor": "DOM::multiomics", "answer": "Sambath 2026 인도 자궁경부암(stage IIIB squamous HPV+, n=36) 화학방사선 저항 코호트에서 <b>7p EGFR amplification이 저항군 환자 6명</b>에서만 관찰되었고, 동일 코호트에서 <b>chromothripsis가 12명 중 3명(25%)</b> 으로 나타나 ATM/ATR/BRCA2/RAD50 DNA repair pathway 및 CSNK2A1/SMC1A phosphorylation 활성과 연결됨을 보고합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/sambath-2026-integrated-genomic-proteomic-cervical-cancer-chemoradiation-resistance\" target=\"_blank\">Sambath 2026</a>). Xu 2026 중국 HER2-low breast 코호트에서는 <b>7q gain (SSBP1/FIS1)</b> 이 HER2-low 특이 SCNA로 식별되었고 PS3 proliferation subtype에서 trastuzumab/T-DM1 반응 가설로 연결됩니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/xu-2026-proteogenomic-characterization-reveals-subtype-specific-therapeutic\" target=\"_blank\">Xu 2026</a>). Chen 2023의 SV breakpoint–단백체 매핑에서도 focal amplification은 cis 단백 과발현으로 ~25% 반영되어 phosphoproteome state(특히 EGFR/ERBB2 downstream MAPK/PI3K cascade)에 직접 영향을 미칠 가능성이 시사됩니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/chen-2023-global-impact-somatic-structural-variation-cancer-proteome\" target=\"_blank\">Chen 2023</a>). 한미암 위암 코호트에서 ERBB2 17q amplification 환자의 HER2 phospho-substrate 활성을 정량화하면 표적 적합성 평가에 직접 활용될 수 있겠습니다.", "cites": [{"label": "Sambath 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/sambath-2026-integrated-genomic-proteomic-cervical-cancer-chemoradiation-resistance"}, {"label": "Xu 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/xu-2026-proteogenomic-characterization-reveals-subtype-specific-therapeutic"}, {"label": "Chen 2023", "url": "https://hejeong1219.github.io/paperatlas/sources/chen-2023-global-impact-somatic-structural-variation-cancer-proteome"}]}, {"id": "Q4", "type": "q", "label": "Q4", "title": "ecDNA (extrachromosomal DNA) 의 inheritance pattern과 cancer phenotype heterogeneity 기여도?", "sec": "A", "secname": "WGS variant interpretation", "color": "#c0883e", "cited": ["Hung 2024", "Pongor 2023", "Wang 2025"], "anchor": "DOM::multiomics", "answer": "Hung 2024 Nature 연구는 같은 종양세포 내 cooperative한 다중 ecDNA species가 random하게 분리되지 않고 <b>mitotic co-segregation을 통해 coordinated하게 유전</b>됨을 single-cell 이미징과 sequencing으로 보였고, daughter cell에서 동시에 oncogene copy number가 유지되는 패턴을 입증했습니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/hung-2024-coordinated-inheritance-extrachromosomal-dnas-cancer\" target=\"_blank\">Hung 2024</a>). Pongor 2023은 small-cell lung cancer에서 ecDNA가 oncogenic <b>MYC amplification의 주요 origin</b>이며 neuroendocrine ↔ non-neuroendocrine cell state 가소성 및 worse outcome과 연관됨을 WGS + optical mapping + single-cell DNA-seq + FISH 통합 분석으로 정량합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/pongor-2023-extrachromosomal-dna-amplification-contributes-small\" target=\"_blank\">Pongor 2023</a>). Wang 2025 bioRxiv는 ecDNA가 cancer 진화와 치료저항성에 <b>별도의 evolutionary pathway</b>를 제공한다는 framework를 제시합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/wang-2025-extrachromosomal-dna-cancer-evolutionary-pathway\" target=\"_blank\">Wang 2025</a>). 한미암 위암 코호트에서 EGFR/MYC/ERBB2 high-copy amplification 환자의 ecDNA 가능성을 long-read WGS 또는 AmpliconArchitect로 평가하면 acquired resistance 기전 해석에 추가 차원을 제공할 수 있겠습니다.", "cites": [{"label": "Hung 2024", "url": "https://hejeong1219.github.io/paperatlas/sources/hung-2024-coordinated-inheritance-extrachromosomal-dnas-cancer"}, {"label": "Pongor 2023", "url": "https://hejeong1219.github.io/paperatlas/sources/pongor-2023-extrachromosomal-dna-amplification-contributes-small"}, {"label": "Wang 2025", "url": "https://hejeong1219.github.io/paperatlas/sources/wang-2025-extrachromosomal-dna-cancer-evolutionary-pathway"}]}, {"id": "Q5", "type": "q", "label": "Q5", "title": "APOBEC (SBS2/SBS13), MMR deficiency (G2/G4), NAT-MMR, polymerase-η, DSB repair, nitrosamine, DBAC PAH 등 mutational signature가 cancer type/지역별로 어떻게 differential하게 나타나는가?", "sec": "A", "secname": "WGS variant interpretation", "color": "#c0883e", "cited": ["Chang 2026", "Lee 2026"], "anchor": "DOM::multiomics", "answer": "Chang 2026 Taiwanese gastric cancer 코호트(NTUH/KMUH n=154 + 외부검증 n=185)는 NMF로 <b>7개 mutational signature(G1 spontaneous deamination / G2 tumour MMR / G3 polymerase-η / G4 NAT MMR / G5 DSB repair / G6 nitrosamine / G7 irradiation)</b> 와 <b>6개 carcinogen cluster(C1–C6)</b> 를 정의하고, 특히 <b>dibenz[a,h]acridine (DBAC PAH)</b> 이 East Asia 특이 high-risk signature이며 multivariable Cox HR 2.36–3.16, diffuse subtype 5.9× EFS risk(p=0.013)임을 입증합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/chang-2026-integrative-proteogenomics-gastric-cancer-taiwan\" target=\"_blank\">Chang 2026</a>). DBAC는 charcoal-grilling/pan-frying dietary BaP(cooked 1.30 ng/g vs raw 0.12 ng/g) 환경 노출과 연계되며 TCGA에는 부재하나 Taiwanese·Japanese 코호트에서 재현됩니다. Lee 2026 Korean TNBC 코호트는 NMF 5 subtype 중 xenobiotic metabolism subtype에서 AKR1C2 RNA 가장 높음을 보고합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/lee-2026-proteogenomic-decoding-chemotherapy-resistance-tnbc\" target=\"_blank\">Lee 2026</a>). 한미암 한국 위암 코호트에 SigProfilerExtractor·deconstructSigs로 SBS·DBS·ID signature를 추출 후 Taiwanese G1–G7 / C1–C6 framework와 비교하면 식이성 PAH 노출과 한국인 위암 driver pattern 매핑을 검토해 볼 만합니다.", "cites": [{"label": "Chang 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/chang-2026-integrative-proteogenomics-gastric-cancer-taiwan"}, {"label": "Lee 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/lee-2026-proteogenomic-decoding-chemotherapy-resistance-tnbc"}]}, {"id": "Q6", "type": "q", "label": "Q6", "title": "HLA typing (class I/II)의 WGS-based call 정확도와 immunopeptidomics validation gap?", "sec": "A", "secname": "WGS variant interpretation", "color": "#c0883e", "cited": ["Han 2024", "Chen 2026", "Xiang 2025"], "anchor": "DOM::multiomics", "answer": "Han 2024는 HLA class I allele divergence와 neoantigen–HLA binding을 결합한 <b>HLA tumor-Antigen Presentation Score (HAPS)</b> 가 단순 neoantigen 개수보다 pan-cancer ICI 반응을 더 잘 예측함을 보여, WGS-based HLA call이 quantitative presentation capacity로 변환되어야 임상 신호가 살아남는다는 점을 시사합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/han-2024-hla-based-neoantigen-presentation-pan-cancer-response\" target=\"_blank\">Han 2024</a>). Chen 2026은 LoF germline SV의 functional enrichment에서 <b>MHC class I antigen binding/antigen processing</b> 카테고리가 유의함을 보여, WGS-based HLA-presentation pathway 평가가 단순 4-digit allele call을 넘어 antigen processing 전체 cascade로 확장되어야 함을 제시합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/chen-2026-global-impact-germline-structural-variation-cancer-proteome\" target=\"_blank\">Chen 2026</a>). Xiang 2025 Chinese CRC 코호트의 MHC class I IP-MS + 6-frame translation은 <b>80.21%가 non-coding origin neoantigen</b>을 입증해, WGS-only prediction과 immunopeptidomics 측정 사이에 큰 갭이 존재함을 명시합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/xiang-2026-predominant-mutated-non-canonical-tumor-specific-antigens\" target=\"_blank\">Xiang 2025</a>). 한미암 위암 코호트에서 OptiType/HLA-LA/HLA*PRG 등으로 4-digit HLA call 후 NeoFlow/NeoDisc + immunopeptidomics validation을 dual-track으로 운영하면 validation gap을 정량화할 수 있겠습니다.", "cites": [{"label": "Han 2024", "url": "https://hejeong1219.github.io/paperatlas/sources/han-2024-hla-based-neoantigen-presentation-pan-cancer-response"}, {"label": "Chen 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/chen-2026-global-impact-germline-structural-variation-cancer-proteome"}, {"label": "Xiang 2025", "url": "https://hejeong1219.github.io/paperatlas/sources/xiang-2026-predominant-mutated-non-canonical-tumor-specific-antigens"}]}, {"id": "Q7", "type": "q", "label": "Q7", "title": "Noncoding driver mutation (TERT promoter, enhancer hijacking)이 expression/protein readout으로 detect되는 사례?", "sec": "A", "secname": "WGS variant interpretation", "color": "#c0883e", "cited": ["Chen 2023", "Chen 2026", "Attig 2019"], "anchor": "DOM::multiomics", "answer": "Chen 2023 pan-cancer 1,307 tumor 분석은 SV 기반 <b>enhancer hijacking·retrotransposon translocation·CGI methylation 매개 cis-regulation</b>이 단백질 과발현으로 직접 연결되는 사례를 다수 카탈로그하며, 비암호화 SV의 protein consequence가 mRNA만 보면 놓치는 영역임을 강조합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/chen-2023-global-impact-somatic-structural-variation-cancer-proteome\" target=\"_blank\">Chen 2023</a>). Chen 2026 germline SV 자매연구는 <b>109개 SV-enhancer methylation pair</b> 중 41개가 CBTN pediatric brain tumour 코호트에서 p<1E-22로 재현되고, <b>ECHDC1 / SH3GLB2 / MAMDC2</b>가 enhancer methylation 매개 cis-target임을 명시합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/chen-2026-global-impact-germline-structural-variation-cancer-proteome\" target=\"_blank\">Chen 2026</a>). Attig 2019의 LTR retroelement expansion 분석도 noncoding regulatory element가 cancer expression program으로 어떻게 활성화되는지의 reference로 활용될 수 있습니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/attig-2019-ltr-retroelement-expansion-human-cancer\" target=\"_blank\">Attig 2019</a>). 한미암 위암 WGS에서 TERT promoter mutation·enhancer hijacking을 SV+methylation 매개 cis-regulation framework로 평가하면 protein evidence 기반 driver call에 활용될 수 있겠습니다.", "cites": [{"label": "Chen 2023", "url": "https://hejeong1219.github.io/paperatlas/sources/chen-2023-global-impact-somatic-structural-variation-cancer-proteome"}, {"label": "Chen 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/chen-2026-global-impact-germline-structural-variation-cancer-proteome"}, {"label": "Attig 2019", "url": "https://hejeong1219.github.io/paperatlas/sources/attig-2019-ltr-retroelement-expansion-human-cancer"}]}, {"id": "Q8", "type": "q", "label": "Q8", "title": "Tumor heterogeneity (clonal vs subclonal SV/SNV)가 single-cell WGS + spatial multi-omics로 어떻게 layer되는가?", "sec": "A", "secname": "WGS variant interpretation", "color": "#c0883e", "cited": ["Wang 2026", "Pongor 2023", "Sussman 2026"], "anchor": "DOM::multiomics", "answer": "Wang 2026 combined small-cell lung cancer 19명 코호트는 <b>multi-region WES (95개 region/16명) + spatial transcriptomics (6명) + snRNA-seq (12명)</b> 통합으로 TP53는 모든 region에서 clonal, RB1은 6명 clonal·2명 subclonal로 정량해 monoclonal origin을 입증하고, COL11A1+ CAF S3-like fibroblast가 종양 도메인 경계를 형성해 immune exclusion에 공간적으로 기여함을 보입니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/wang-2026-spatial-multi-omics-unveils-monoclonal-origin\" target=\"_blank\">Wang 2026</a>). Pongor 2023 SCLC ecDNA 연구는 single-cell DNA sequencing + FISH로 cell-to-cell MYC copy number heterogeneity를 정량합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/pongor-2023-extrachromosomal-dna-amplification-contributes-small\" target=\"_blank\">Pongor 2023</a>). Sussman 2026 pediatric high-grade glioma 16명 longitudinal multiomic atlas는 snRNA + snATAC + WGS + CODEX spatial proteomics를 1차 절제–재발–autopsy 시점에 결합해 clonal evolution과 spatial niche를 동시에 layer합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/sussman-2026-longitudinal-single-cell-spatial-multiomic-atlas\" target=\"_blank\">Sussman 2026</a>). 한미암 위암 코호트에서 다구역 WGS + spatial transcriptomics + 단백체를 결합해 clonal driver와 spatial niche를 dual-layer로 분석하면 1차 vs 2차 내성 진화 분석에 직접 참고할 수 있겠습니다.", "cites": [{"label": "Wang 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/wang-2026-spatial-multi-omics-unveils-monoclonal-origin"}, {"label": "Pongor 2023", "url": "https://hejeong1219.github.io/paperatlas/sources/pongor-2023-extrachromosomal-dna-amplification-contributes-small"}, {"label": "Sussman 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/sussman-2026-longitudinal-single-cell-spatial-multiomic-atlas"}]}, {"id": "Q9", "type": "q", "label": "Q9", "title": "WGS-based copy number signature vs proteome-derived functional state — 어느 layer가 prognosis와 더 강하게 연관되는가?", "sec": "A", "secname": "WGS variant interpretation", "color": "#c0883e", "cited": ["Zhao 2026", "Lee 2026", "Song 2024"], "anchor": "DOM::multiomics", "answer": "Zhao 2026 CRLM proteogenomics는 LM proteome unsupervised clustering이 phospho·transcriptome 기반 클러스터링보다 prognostic stratification에서 우월하며(C1 vs C2 OS log-rank p<0.05; C1 poor), CRS 임상 위험 점수는 5-yr OS log-rank p=0.23으로 예측력이 충분하지 않음을 명시합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/zhao-2026-proteogenomic-characterization-reveals-metabolic-vulnerabilities\" target=\"_blank\">Zhao 2026</a>). Lee 2026 Korean TNBC는 5개 저항인자(estrogen GSVA + GRK2 PTM-SEA + ITGB8 7p21 + AKR1C2 + ABCA13) 통합 로지스틱 회귀가 non-pCR AUC <b>0.946</b>으로 Lehmann 분류(AUC 0.781)나 Lehmann+ESTIMATE(AUC 0.818)를 능가함을 보여, <b>protein/phospho functional state가 단순 CNA·transcriptome 기반 분류보다 임상 endpoint와 더 강하게 연관</b>됨을 입증합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/lee-2026-proteogenomic-decoding-chemotherapy-resistance-tnbc\" target=\"_blank\">Lee 2026</a>). Song 2024 Korean NSCLC 5 subtype에서도 phosphoproteome이 80%(911/1,134) subtype feature를 제공하며 Subtype 4(hypoxic, CSNK2A1/GSK3B 활성)가 stage 보정 후에도 worse survival을 보입니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/song-2024-proteogenomic-analysis-reveals-non-small-cell\" target=\"_blank\">Song 2024</a>). 한미암 위암 코호트도 CNA·signature layer와 proteome/phospho layer를 prognostic model에 분리 입력해 두 축의 상대 기여도를 정량할 수 있겠습니다.", "cites": [{"label": "Zhao 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/zhao-2026-proteogenomic-characterization-reveals-metabolic-vulnerabilities"}, {"label": "Lee 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/lee-2026-proteogenomic-decoding-chemotherapy-resistance-tnbc"}, {"label": "Song 2024", "url": "https://hejeong1219.github.io/paperatlas/sources/song-2024-proteogenomic-analysis-reveals-non-small-cell"}]}, {"id": "Q10", "type": "q", "label": "Q10", "title": "East Asian / Chinese / Korean / Indian 코호트 specific mutational signature (DBAC, charcoal-grilling, HBV-driven HCC)와 한국 위암 코호트 매핑?", "sec": "A", "secname": "WGS variant interpretation", "color": "#c0883e", "cited": ["Chang 2026", "Sambath 2026", "Xu 2026", "Chen 2026"], "anchor": "DOM::multiomics", "answer": "Chang 2026 Taiwanese gastric cancer 154명 코호트가 핵심 reference로, DBAC PAH signature가 East Asian charcoal-grilling/pan-frying 식이 노출과 연계되며 다변량 Cox HR 2.36–3.16, diffuse subtype 5.9× EFS risk, BaP MKN45/MKN28 invasion 3.7×/2.7× cell-line 검증까지 제시합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/chang-2026-integrative-proteogenomics-gastric-cancer-taiwan\" target=\"_blank\">Chang 2026</a>). Sambath 2026 인도 자궁경부암 코호트는 EGFR 7p amp + STK11 SV deletion + chromothripsis + DNA repair/WNT-β-catenin pathway enrichment를 저항 코호트 특이 신호로 보고합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/sambath-2026-integrated-genomic-proteomic-cervical-cancer-chemoradiation-resistance\" target=\"_blank\">Sambath 2026</a>). Xu 2026 중국 HER2-low breast 코호트는 TP53 mut + 9p loss(MTAP cis)가 HER2-low 한정 poor prognosis임을 보여 ancestry-specific co-occurrence를 제시합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/xu-2026-proteogenomic-characterization-reveals-subtype-specific-therapeutic\" target=\"_blank\">Xu 2026</a>). Chen 2026 germline SV 연구도 ancestry-enriched SV(Asian 8개 — TIGAR 포함; African 10개; European 13개)가 cis-cancer effect의 45%를 별도로 설명한다고 보고합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/chen-2026-global-impact-germline-structural-variation-cancer-proteome\" target=\"_blank\">Chen 2026</a>). 한미암 위암 코호트는 KOVA·KCDC ancestry baseline + DBAC/nitrosamine/Microvirga signature 매핑으로 한국인 위암 특이 carcinogen-cluster를 추출하는 framework로 참고할 수 있겠습니다.", "cites": [{"label": "Chang 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/chang-2026-integrative-proteogenomics-gastric-cancer-taiwan"}, {"label": "Sambath 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/sambath-2026-integrated-genomic-proteomic-cervical-cancer-chemoradiation-resistance"}, {"label": "Xu 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/xu-2026-proteogenomic-characterization-reveals-subtype-specific-therapeutic"}, {"label": "Chen 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/chen-2026-global-impact-germline-structural-variation-cancer-proteome"}]}, {"id": "Q11", "type": "q", "label": "Q11", "title": "TMT11/16 vs DIA phosphoproteome workflow 비교 — depth, missingness, batch effect, sample 요구량?", "sec": "B", "secname": "Phosphoproteome / Kinase signaling", "color": "#6c8f6b", "cited": ["Hsu 2025", "Lehe 2026", "Song 2024", "Petralia 2024"], "anchor": "DOM::multiomics", "answer": "Hsu 2025 osimertinib DTP 연구는 <b>DIA-MS spectral library</b> 기반으로 phosphoproteome library가 221,618 phosphopeptide / 53,182 phosphosite / 10,326 protein group을 수록하고, 시료당 평균 ~5,200 protein / 21,500 phosphopeptide를 정량해 DIA가 deep phosphoproteome coverage에 적합함을 보여줍니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/hsu-2025-phosphoproteomics-osimertinib-tolerant-persister-cells-reveals\" target=\"_blank\">Hsu 2025</a>). Lehe 2026 review는 SWATH-DIA가 2,964 isoform-specific peptide, Astral DIA가 935 AS event/일, 일반 DDA는 0–10 AS peptide라는 평점 매트릭스를 제시하며 DIA가 missingness·coverage 측면에서 DDA보다 우월함을 종합합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/lehe-2026-mass-spectrometry-alternative-protein-isoforms-review\" target=\"_blank\">Lehe 2026</a>). CPTAC 표준은 TMT 11-plex(예: Song 2024 Korean NSCLC 229명에서 10,788 proteins/40,738 phosphosites)이며 batch effect 보정을 위해 reference-intensity centering·ComBat·DreamAI imputation을 결합합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/song-2024-proteogenomic-analysis-reveals-non-small-cell\" target=\"_blank\">Song 2024</a>, <a href=\"https://hejeong1219.github.io/paperatlas/sources/petralia-2024-pan-cancer-proteogenomics-characterization-tumor-immunity\" target=\"_blank\">Petralia 2024</a>). 한미암 위암 코호트에서는 TMT11-plex가 CPTAC compatibility와 batch design 유리, DIA는 sample-by-sample missingness 최소화 유리이므로 1차 cohort는 TMT, 종단·소량 시료는 DIA로 layer하는 방안을 검토해 볼 만합니다.", "cites": [{"label": "Hsu 2025", "url": "https://hejeong1219.github.io/paperatlas/sources/hsu-2025-phosphoproteomics-osimertinib-tolerant-persister-cells-reveals"}, {"label": "Lehe 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/lehe-2026-mass-spectrometry-alternative-protein-isoforms-review"}, {"label": "Song 2024", "url": "https://hejeong1219.github.io/paperatlas/sources/song-2024-proteogenomic-analysis-reveals-non-small-cell"}, {"label": "Petralia 2024", "url": "https://hejeong1219.github.io/paperatlas/sources/petralia-2024-pan-cancer-proteogenomics-characterization-tumor-immunity"}]}, {"id": "Q12", "type": "q", "label": "Q12", "title": "Phosphopeptide-level vs phosphosite-level 정량의 적절한 통계 unit은 무엇인가?", "sec": "B", "secname": "Phosphoproteome / Kinase signaling", "color": "#6c8f6b", "cited": ["Hsu 2025", "Zhao 2025"], "anchor": "DOM::multiomics", "answer": "Hsu 2025는 phosphosite localization probability ≥ 0.75를 class I site 기준으로 채택해 osimertinib DTP에서 10,742 unique phosphosite를 분석 단위로 삼고, 동일 단백질 내 phosphopeptide 간에 분기되는 신호는 site-level로 환원해 KSEA · CausalPath inference에 입력합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/hsu-2025-phosphoproteomics-osimertinib-tolerant-persister-cells-reveals\" target=\"_blank\">Hsu 2025</a>). Zhao 2025 CRC kinase inhibitor 분석도 6,213 phosphosite 중 <b>5,048 class I site</b>(localization score >0.75)만 유지하고 PTM-SEA·KSEAapp에 입력해 결과 안정성을 보고합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/zhao-2025-phosphoproteomic-acetylomic-characterization-colorectal-cancer\" target=\"_blank\">Zhao 2025</a>). PTM-correction 개념 페이지는 phosphosite를 통계 unit으로 사용하더라도 <b>per-site λ(protein coupling coefficient)</b> 가 broad distribution(LUAD median 0.64)을 보여 단순 protein subtraction이 적절치 않음을 명시합니다 ([PTM-correction 개념](../concepts/ptm-correction-confounding-foundations.md)). 한미암 phosphoproteomics 파이프라인에서는 phosphopeptide → site-level mapping을 class I localization 기준으로 진행하되, 단백 추가 정량을 활용한 site-aware correction(ptmanchor 등)을 site 단위로 적용하는 방안을 참고할 수 있겠습니다.", "cites": [{"label": "Hsu 2025", "url": "https://hejeong1219.github.io/paperatlas/sources/hsu-2025-phosphoproteomics-osimertinib-tolerant-persister-cells-reveals"}, {"label": "Zhao 2025", "url": "https://hejeong1219.github.io/paperatlas/sources/zhao-2025-phosphoproteomic-acetylomic-characterization-colorectal-cancer"}]}, {"id": "Q13", "type": "q", "label": "Q13", "title": "Phosphoproteome normalization — protein abundance correction이 왜 필요하며 어떤 방법(IRS, MaxLFQ, ratio)이 표준화되었나?", "sec": "B", "secname": "Phosphoproteome / Kinase signaling", "color": "#6c8f6b", "cited": ["Zhao 2025", "Petralia 2024"], "anchor": "DOM::multiomics", "answer": "PTM-correction 개념 페이지는 CPTAC 7개 phosphoproteome cohort에서 raw-up phosphosite의 <b>38–55%(평균 46%)</b> 가 protein-driven으로 재분류되며, LUAD에서 protein-coupling coefficient λ의 median이 0.64로 단순 subtraction(λ ≡ 1)이 위반됨을 정량하여 site-aware correction의 필요성을 입증합니다 ([PTM-correction 개념](../concepts/ptm-correction-confounding-foundations.md)). Zhao 2025는 linear-regression residual correction(protein abundance 회귀잔차)으로 phosphosite·acetylsite를 보정해 22개 same-protein acetyl/phospho cross-talk pair를 식별합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/zhao-2025-phosphoproteomic-acetylomic-characterization-colorectal-cancer\" target=\"_blank\">Zhao 2025</a>). Petralia 2024 CPTAC pan-cancer harmonization은 University of Michigan 파이프라인(MSFragger + Philosopher + TMT-Integrator) 후 <b>reference-intensity centering + outlier TMT multiplex 제거 + ComBat correction + DreamAI imputation + BCM phosphosite reannotation</b>을 표준 procedure로 채택합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/petralia-2024-pan-cancer-proteogenomics-characterization-tumor-immunity\" target=\"_blank\">Petralia 2024</a>). 한미암 인산화단백체 파이프라인은 IRS · reference-intensity centering에 더해 ptmanchor-style per-site λ correction을 옵션으로 layer하면 kinase activity inference 해석 신뢰성을 검토할 수 있겠습니다.", "cites": [{"label": "Zhao 2025", "url": "https://hejeong1219.github.io/paperatlas/sources/zhao-2025-phosphoproteomic-acetylomic-characterization-colorectal-cancer"}, {"label": "Petralia 2024", "url": "https://hejeong1219.github.io/paperatlas/sources/petralia-2024-pan-cancer-proteogenomics-characterization-tumor-immunity"}]}, {"id": "Q14", "type": "q", "label": "Q14", "title": "Kinase activity inference (KSEA, IKAP, PhosphoSitePlus, KSDB, ROKAI) — 알고리즘 vs substrate library 중 무엇이 정확도를 더 결정하는가?", "sec": "B", "secname": "Phosphoproteome / Kinase signaling", "color": "#6c8f6b", "cited": ["Jiang 2025"], "anchor": "DOM::multiomics", "answer": "Müller-Dott 2025 `benchmarKIN` 패키지는 perturbation + CPTAC tumor benchmark로 비교한 결과, <b>inference algorithm 선택보다 substrate library 선택이 성능을 더 좌우</b>하며 curated kinase-substrate resource(특히 PhosphoSitePlus + NetworKIN-derived 예측 보완)가 일반적으로 우월하다고 보고합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/muller-dott-2025-phosphoproteomic-kinase-activity-inference\" target=\"_blank\">Müller-Dott 2025</a>). Jiang 2025 CoPheeKSA는 1,195 tumor × 11 cancer type의 co-regulation network로 26,280 phosphosite를 매핑하고, <b>24,015개 새로운 KSA + 26개 understudied kinase</b>(CDK12/SGK3/SMG1/NUAK1 등)를 추가해 substrate library 확장이 inference 정확도를 직접 끌어올림을 입증합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/jiang-2025-dark-cancer-phosphoproteome-coregulation\" target=\"_blank\">Jiang 2025</a>). Kinase Activity Inference 합성 페이지는 site-aware correction과 substrate library 확장이 결합되면 <b>7개 kinase(BRAF/CSNK2A1/HIPK2/MAPK13/PRKCG/TBK1/TTK) 회복 + 16개 kinase 제거</b>라는 call layer 변화를 보고합니다 ([Kinase Inference 합성](../syntheses/kinase-activity-inference-under-ptm-correction.md)). 한미암 인산화단백체 kinase inference는 (i) PhosphoSitePlus + Kinase Library + CoPheeKSA library를 multi-source로 결합, (ii) KSEA·NetworKIN·KEA3를 ensemble로 운영하는 설계가 가능성 측면에서 참고할 수 있겠습니다.", "cites": [{"label": "Müller-Dott 2025", "url": "https://hejeong1219.github.io/paperatlas/sources/muller-dott-2025-phosphoproteomic-kinase-activity-inference"}, {"label": "Jiang 2025", "url": "https://hejeong1219.github.io/paperatlas/sources/jiang-2025-dark-cancer-phosphoproteome-coregulation"}]}, {"id": "Q15", "type": "q", "label": "Q15", "title": "Dark phosphoproteome (annotation 부족 phosphosite) 의 co-regulation network 기반 functional 해석?", "sec": "B", "secname": "Phosphoproteome / Kinase signaling", "color": "#6c8f6b", "cited": ["Jiang 2025", "Khan 2026"], "anchor": "DOM::multiomics", "answer": "Jiang 2025의 CoPheeMap은 1,195 CPTAC tumor × 11 cancer type phosphoproteomics로 <b>26,280개 phosphosite의 co-regulation network</b>를 machine-learning으로 구축하고, 이를 feature로 사용한 CoPheeKSA가 24,015개 kinase-substrate association(9,399 phosphosite × 104 S/T kinase)을 새로 매핑해 dark phosphoproteome를 network learning 문제로 재정의합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/jiang-2025-dark-cancer-phosphoproteome-coregulation\" target=\"_blank\">Jiang 2025</a>). Khan 2026은 3,825개 public phosphoproteomics dataset을 통합 메타분석해 TPD52 family의 conserved phosphosite(S171/S176/S149/S12/S166)와 <b>CAMK2D를 shared regulator</b>로 nominate하는 network 기반 dark-site functional 해석 사례를 제시합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/khan-2026-integrative-phosphoproteomic-network-analysis-identifies\" target=\"_blank\">Khan 2026</a>). Kinase Inference 합성 페이지는 CoPheeKSA가 Kinase Library percentile에서 NetworKIN/LinkPhinder/PDT 대비 p≤0.0001로 우월하며, 56개 prediction이 PubMed text-mining에서 확증됨을 정리합니다 ([Kinase Inference 합성](../syntheses/kinase-activity-inference-under-ptm-correction.md)). 한미암 위암 인산화단백체에서 CoPheeMap/CoPheeKSA를 적용해 한국인 위암 특이 co-regulation module을 추출하면 dark-site functional 가설 발굴에 검토해 볼 만합니다.", "cites": [{"label": "Jiang 2025", "url": "https://hejeong1219.github.io/paperatlas/sources/jiang-2025-dark-cancer-phosphoproteome-coregulation"}, {"label": "Khan 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/khan-2026-integrative-phosphoproteomic-network-analysis-identifies"}]}, {"id": "Q16", "type": "q", "label": "Q16", "title": "Drug perturbation phosphoproteomics (CRC kinase inhibitor, osimertinib DTP 등) 에서 off-target signaling과 PTM crosstalk을 어떻게 분리?", "sec": "B", "secname": "Phosphoproteome / Kinase signaling", "color": "#6c8f6b", "cited": ["Zhao 2025", "Hsu 2025"], "anchor": "DOM::multiomics", "answer": "Zhao 2025는 HCT116 CRC 세포주에 7개 kinase inhibitor(lapatinib/refametinib/PIK-93/Ro-3306/AT7519/ZSTK474/AS-605240) 1 μM 12시간 처리 후 TMTpro 6,147 protein + 5,048 class I phosphosite + 185 acetyl site를 측정해, PTM-SEA/KSEA가 <b>on-target effect(lapatinib→ERBB2 억제, AT7519→CDK1/2/6 억제)와 off-target signal(lapatinib→CDK4 활성화, PIK-93→CDK1/4 활성화)을 분리</b>함을 입증합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/zhao-2025-phosphoproteomic-acetylomic-characterization-colorectal-cancer\" target=\"_blank\">Zhao 2025</a>). PTM crosstalk은 protein abundance에 대해 linear-regression residual로 보정 후 동일-단백질 acetyl/phospho pair 22개의 유의 상관(HNRNPA1 K350-S337, HSPD1 K72-S70 등)을 식별합니다. Hsu 2025 osimertinib DTP에서는 PCA로 DMSO/acute/DTP 상태를 분리(PC1 52.3%, PC2 13.4%)하고 KSEA + CausalPath로 acute에 억제되었던 PI3K-AKT/MAPK/PKA/PKC 신호가 DTP에서 reactivation됨을 확인해 phenotype-state별 signaling을 분리합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/hsu-2025-phosphoproteomics-osimertinib-tolerant-persister-cells-reveals\" target=\"_blank\">Hsu 2025</a>). 한미암 약물 perturbation 분석에서는 protein abundance correction → KSEA → causal network 순서로 layer해 off-target과 PTM crosstalk을 분리하는 워크플로를 참고할 수 있겠습니다.", "cites": [{"label": "Zhao 2025", "url": "https://hejeong1219.github.io/paperatlas/sources/zhao-2025-phosphoproteomic-acetylomic-characterization-colorectal-cancer"}, {"label": "Hsu 2025", "url": "https://hejeong1219.github.io/paperatlas/sources/hsu-2025-phosphoproteomics-osimertinib-tolerant-persister-cells-reveals"}]}, {"id": "Q17", "type": "q", "label": "Q17", "title": "PP2A / phosphatase axis 가 weak genomic driver 환경에서 종양 phenotype을 구동하는 evidence?", "sec": "B", "secname": "Phosphoproteome / Kinase signaling", "color": "#6c8f6b", "cited": ["Asuzu 2025"], "anchor": "DOM::multiomics", "answer": "Asuzu 2025는 pituitary adenoma의 15%만 somatic mutation이 발견되는 weak-driver 환경에서, Cushing's disease(CD) adenoma 환자에서 <b>PPP1R17(PP2A 내인성 inhibitor) 과발현이 epigenetic reactivation을 통해 hyperphosphorylation phenotype을 구동</b>함을 multi-omics(ATAC + methylation + transcriptome + proteome + phosphoproteome)로 보였고, <b>FDA-approved PP2A agonist 소분자가 PPP1R17-매개 종양형성을 in vitro/in vivo에서 reversible</b>하게 억제함을 입증합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/asuzu-2025-phosphoproteomic-dysregulation-drives-tumor-proliferation\" target=\"_blank\">Asuzu 2025</a>). 이는 driver mutation이 약한 종양에서도 <b>kinase-phosphatase balance(PP2A axis)</b> 가 직접 표적 가능한 lever임을 의미합니다. PTM-correction 개념 페이지는 phosphosite의 ~46%가 protein-driven으로 재분류된다는 점을 고려하면 phosphatase axis 검출에는 site-aware correction이 필수임을 시사합니다 ([PTM-correction 개념](../concepts/ptm-correction-confounding-foundations.md)). 한미암 위암 코호트에서 weak-driver 또는 microsatellite-stable 환자군에 PP2A regulator(PPP2R1A/PPP2R2B/PPP1R17) RNA·단백 발현을 layer하면 phosphatase axis 기반 환자층화 가설을 검토해 볼 만합니다.", "cites": [{"label": "Asuzu 2025", "url": "https://hejeong1219.github.io/paperatlas/sources/asuzu-2025-phosphoproteomic-dysregulation-drives-tumor-proliferation"}]}, {"id": "Q18", "type": "q", "label": "Q18", "title": "PIM kinase / NDRG1 S330 / SHMT1 등 metabolic-signaling crosstalk을 phosphoproteome으로 어떻게 매핑?", "sec": "B", "secname": "Phosphoproteome / Kinase signaling", "color": "#6c8f6b", "cited": ["Zhao 2026"], "anchor": "DOM::multiomics", "answer": "Zhao 2026 CRLM proteogenomics는 LM 단백체에서 <b>SHMT1-formate-AMPK 축</b>(SHMT1 KD ↑p-AMPK, formate ↓, AICAR ↑↑, 125 mM formate drinking water ↑tumor burden in vivo)과 <b>NDRG1 S330p ubiquitin-degradation 축</b>(NDRG1 S330 ↔ actin cytoskeleton ρ=0.43 p=0.013; S330A 변이는 KAP intrasplenic 모델에서 ↓liver metastasis)을 mechanistic하게 동시 입증합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/zhao-2026-proteogenomic-characterization-reveals-metabolic-vulnerabilities\" target=\"_blank\">Zhao 2026</a>). PIM family(PIM1/2/3)는 Johnson 2023 Kinase Library에서 NDRG1 S330 phosphorylation 후보 1위로 예측되며, <b>TP-3654 3 μM(pan-PIM inhibitor)</b> 처리가 NDRG1 S330p ↓, migration/invasion ↓, p-AMPK ↑를 유발해 PIM이 AMPK 음 조절과 NDRG1 degradation을 동시 매개하는 dual axis임을 보입니다. 기본 KSEA DB로는 PIM activity detection 실패해 <b>PhosphoSitePlus v6.7.5 확장 DB</b>로 PIM1 LM activity ↑(Wilcoxon p<0.001) 검출함을 명시합니다. 한미암 위암 인산화단백체에서 SHMT1·NDRG1 S330·PIM family를 metabolic-kinase crosstalk module로 검토하고, 확장 substrate library로 KSEA inference detection sensitivity를 보강하는 방안을 참고할 수 있겠습니다.", "cites": [{"label": "Zhao 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/zhao-2026-proteogenomic-characterization-reveals-metabolic-vulnerabilities"}]}, {"id": "Q19", "type": "q", "label": "Q19", "title": "AURKB, GRK2, CDK4 등 actionable kinase target을 phosphoproteome으로 우선순위화하는 framework?", "sec": "B", "secname": "Phosphoproteome / Kinase signaling", "color": "#6c8f6b", "cited": ["Lee 2026", "Chang 2026", "Savage 2024"], "anchor": "DOM::multiomics", "answer": "Lee 2026 Korean TNBC 50명 코호트는 PTM-SEA phospho-kinase activity로 <b>GRK2 + GRK5 + RAPAMYCIN + CDK2 cluster를 non-pCR에 enrich</b>시키고, paired pre/post 분석에서 residual tumor에 <b>AURKB phosphoproteome 신호</b>가 지속됨을 확인한 뒤 (i) GRK2 inhibitor(βARK1) + paclitaxel은 MDA-MB-231 Bliss synergy 8.08, (ii) <b>barasertib(Aurora B inhibitor) 10 nM + paclitaxel은 MDA-MB-468/HCC1937/SBO-72 organoid에서 cell viability 감소</b>를 in vitro로 검증해 phospho-driven target prioritization framework를 완성합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/lee-2026-proteogenomic-decoding-chemotherapy-resistance-tnbc\" target=\"_blank\">Lee 2026</a>). Chang 2026 Taiwanese GC 154명은 <b>CDK4를 actionable hub</b>로 nominate해 IHC-positive + proteome-defined-positive(HER2/PD-L1/CLDN18.2 high) + IHC-negative(49.2%) 3 subgroup 공통 candidate로 palbociclib/ribociclib repurposing 후보 제시합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/chang-2026-integrative-proteogenomics-gastric-cancer-taiwan\" target=\"_blank\">Chang 2026</a>). Savage 2024 CPTAC pan-cancer 1,043 tumor 분석도 <b>protein overexpression/hyperactivation-driven dependency</b>를 cell-line genetic screen·drug response와 통합해 우선순위화하는 framework를 정립했습니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/savage-2024-pan-cancer-proteogenomics-expands-landscape-therapeutic\" target=\"_blank\">Savage 2024</a>). 한미암 위암 인산화단백체에서 PTM-SEA + 외부 DepMap dependency + organoid functional validation의 3-layer prioritization을 검토할 수 있겠습니다.", "cites": [{"label": "Lee 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/lee-2026-proteogenomic-decoding-chemotherapy-resistance-tnbc"}, {"label": "Chang 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/chang-2026-integrative-proteogenomics-gastric-cancer-taiwan"}, {"label": "Savage 2024", "url": "https://hejeong1219.github.io/paperatlas/sources/savage-2024-pan-cancer-proteogenomics-expands-landscape-therapeutic"}]}, {"id": "Q20", "type": "q", "label": "Q20", "title": "Lactylome (Xu 2026 HER2-low breast)이 cancer signaling 해석에 추가하는 차원과 phospho와의 crosstalk?", "sec": "B", "secname": "Phosphoproteome / Kinase signaling", "color": "#6c8f6b", "cited": ["Xu 2026", "Zhao 2025"], "anchor": "DOM::multiomics", "answer": "Xu 2026 중국 HER2-low breast 코호트(prospective 115 tumor)는 phosphoproteome 43,963 site와 동시에 <b>lactylome 18,214 site / 1,644 protein</b>(timsTOF Pro + IMAC + PTM-1404 antibody)을 정량해 cancer multi-PTM landscape에 lactylation 차원을 추가합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/xu-2026-proteogenomic-characterization-reveals-subtype-specific-therapeutic\" target=\"_blank\">Xu 2026</a>). 핵심 phospho-lactyl crosstalk으로 (i) <b>PRKDC K2694/K2908 lactylation ↔ kinase activity ↑ + PFS ↓</b>(DNA-PK 의존 저항), (ii) <b>STAT1 K193 lactylation + T727 phosphorylation ↔ STAT1 TF activity</b>(VIPER+DoRothEA), (iii) AURKB lactylation 매개 조절을 보고합니다. 3개 lactylomic subtype LS1/2/3은 PFS log-rank p=0.00172로 strong prognostic stratification을 보였고, histone Kla H2B K5/H3 K27 등 50+ site는 HER2-high에서 더 높은 패턴을 보입니다. Zhao 2025 CRC perturbation 분석은 같은 단백질 내 acetyl/phospho 22 pair에서 cross-talk 상관을 확인해 multi-PTM crosstalk framework의 일반성을 시사합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/zhao-2025-phosphoproteomic-acetylomic-characterization-colorectal-cancer\" target=\"_blank\">Zhao 2025</a>). 한미암 위암 코호트에서 phospho + acetyl + lactyl 다중 PTM layer를 결합하면 metabolic-signaling crosstalk 해석에 검토해 볼 만합니다.", "cites": [{"label": "Xu 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/xu-2026-proteogenomic-characterization-reveals-subtype-specific-therapeutic"}, {"label": "Zhao 2025", "url": "https://hejeong1219.github.io/paperatlas/sources/zhao-2025-phosphoproteomic-acetylomic-characterization-colorectal-cancer"}]}, {"id": "Q21", "type": "q", "label": "Q21", "title": "pQTL vs eQTL — 같은 driver variant이 RNA와 protein layer에서 다르게 매핑되는 빈도와 그 의미?", "sec": "C", "secname": "WGS-Proteome integration / pQTL / ppQTL", "color": "#5b86b0", "cited": ["Chen 2026", "Savage 2024", "Li 2023"], "anchor": "DOM::multiomics", "answer": "Chen 2026 germline SV 분석은 364개 recurrent SV-altered gene 중 <b>17%(129/364)만 mRNA+protein concordant</b>, <b>33%는 protein-only direction</b>(reverse, mRNA 변화 약함)이며 MS-based proteomics가 mRNA-only로 못 잡는 cis-effect를 포착함을 명시합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/chen-2026-global-impact-germline-structural-variation-cancer-proteome\" target=\"_blank\">Chen 2026</a>). Savage 2024 CPTAC pan-cancer 1,043 tumor 분석은 gene-wise mRNA-protein correlation이 cohort별·gene class별로 폭이 매우 크며 secreted protein/다른 biology가 weak correlation을 유도하므로 <b>transcript-only heuristic보다 protein-level target selection</b>이 필수임을 입증합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/savage-2024-pan-cancer-proteogenomics-expands-landscape-therapeutic\" target=\"_blank\">Savage 2024</a>). Li 2023 pan-cancer proteogenomics는 oncogenic driver의 cis/trans-effect를 RNA·protein·phosphoprotein 3 layer에서 정량해 <b>driver별로 RNA만 / protein 양쪽 / phospho까지 영향이 다르게 분기</b>됨을 정리합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/li-2023-pan-cancer-proteogenomics-connects-oncogenic-drivers\" target=\"_blank\">Li 2023</a>). 한미암 위암 코호트에서 pQTL/ppQTL 분석은 eQTL과 별도 layer로 산출하고, 동일 SNV/SV의 RNA-only vs protein-also 분기 패턴을 카테고리화해 driver consequence 해석에 활용할 수 있겠습니다.", "cites": [{"label": "Chen 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/chen-2026-global-impact-germline-structural-variation-cancer-proteome"}, {"label": "Savage 2024", "url": "https://hejeong1219.github.io/paperatlas/sources/savage-2024-pan-cancer-proteogenomics-expands-landscape-therapeutic"}, {"label": "Li 2023", "url": "https://hejeong1219.github.io/paperatlas/sources/li-2023-pan-cancer-proteogenomics-connects-oncogenic-drivers"}]}, {"id": "Q22", "type": "q", "label": "Q22", "title": "Copy-number-to-protein effect의 cis vs trans hotspot — 어느 chromosomal region이 가장 강하게 trans-acting?", "sec": "C", "secname": "WGS-Proteome integration / pQTL / ppQTL", "color": "#5b86b0", "cited": ["Sambath 2026", "Petralia 2024", "Xu 2026"], "anchor": "DOM::multiomics", "answer": "Sambath 2026 인도 자궁경부암 코호트는 <b>CNA-protein trans hotspot으로 6q / 9q / 11p / 22q</b>를 명시하며, EGFR 7p amp + STK11 SV deletion + chromothripsis가 결합된 저항 환자군에서 단백체 top5 up(SERPINB7/STX3/LBP/EMILIN2/NQO2; STX3는 IHC 32명 validation 일관 elevated)이 별도 chromosomal hotspot trans-effect의 후보임을 시사합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/sambath-2026-integrated-genomic-proteomic-cervical-cancer-chemoradiation-resistance\" target=\"_blank\">Sambath 2026</a>). Petralia 2024 CPTAC 1,056 tumor pan-cancer immunity 분석은 <b>9p21 loss (CDKN2A/B + MTAP)</b> 가 wound-healing/proliferative immune-cold state와 연결됨을 보여 9p21이 trans-acting immune phenotype hotspot임을 정리합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/petralia-2024-pan-cancer-proteogenomics-characterization-tumor-immunity\" target=\"_blank\">Petralia 2024</a>). Xu 2026 HER2-low breast는 <b>TP53 mut + 9p loss (MTAP cis)</b> 가 HER2-low 한정 poor prognosis임을 입증해 9p loss의 임상 trans-effect를 추가합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/xu-2026-proteogenomic-characterization-reveals-subtype-specific-therapeutic\" target=\"_blank\">Xu 2026</a>). 한미암 위암 코호트도 GISTIC2 + 단백체로 cis(같은 chr 단백)와 trans(원거리 chromosome 단백) hotspot을 별도 매핑해 trans-acting CNA의 immune·signaling 영향을 검토할 수 있겠습니다.", "cites": [{"label": "Sambath 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/sambath-2026-integrated-genomic-proteomic-cervical-cancer-chemoradiation-resistance"}, {"label": "Petralia 2024", "url": "https://hejeong1219.github.io/paperatlas/sources/petralia-2024-pan-cancer-proteogenomics-characterization-tumor-immunity"}, {"label": "Xu 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/xu-2026-proteogenomic-characterization-reveals-subtype-specific-therapeutic"}]}, {"id": "Q23", "type": "q", "label": "Q23", "title": "Driver-to-functional-state mapping: KRAS G12C, EGFR L858R, TP53 mut 같은 driver가 어떤 protein/phospho functional state로 번역되는가?", "sec": "C", "secname": "WGS-Proteome integration / pQTL / ppQTL", "color": "#5b86b0", "cited": ["Li 2023", "Petralia 2024", "Song 2024"], "anchor": "DOM::multiomics", "answer": "Li 2023 pan-cancer proteogenomics는 oncogenic driver의 cis/trans-effect를 RNA·protein·phosphoprotein layer에서 정량하고, <b>다수 cancer gene이 sequence-based kinase activity profile로 정의된 유사 molecular state로 수렴</b>한다는 driver-to-functional-state convergence 패턴을 보고합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/li-2023-pan-cancer-proteogenomics-connects-oncogenic-drivers\" target=\"_blank\">Li 2023</a>). Petralia 2024는 STK11 mutation이 `CD8-/IFNG+` immune subtype, BAP1/CASP8가 `CD8+/IFNG+`, KEAP1/NFE2L2가 wound-healing immune-cold phenotype과 연관됨을 정량합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/petralia-2024-pan-cancer-proteogenomics-characterization-tumor-immunity\" target=\"_blank\">Petralia 2024</a>). Song 2024 Korean NSCLC 229명은 EGFR mutation을 Subtype 1(metabolic, female-dominant, WGD-frequent)과 Subtype 2(alveolar-like, no WGD)로 분기시키고, KRAS-enriched immunogenic Subtype 5(adjuvant therapy benefit)와 hypoxic Subtype 4(CSNK2A1/GSK3B 활성, SLK S347/LRRFIP1 S581 phospho-marker)를 정의합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/song-2024-proteogenomic-analysis-reveals-non-small-cell\" target=\"_blank\">Song 2024</a>). 한미암 위암 코호트에서 TP53/CDH1/RHOA/HER2 driver별로 단백체-인산화단백체 functional state mapping을 수행하면 driver convergence vs divergence 패턴을 한국인 위암에서 검토할 수 있겠습니다.", "cites": [{"label": "Li 2023", "url": "https://hejeong1219.github.io/paperatlas/sources/li-2023-pan-cancer-proteogenomics-connects-oncogenic-drivers"}, {"label": "Petralia 2024", "url": "https://hejeong1219.github.io/paperatlas/sources/petralia-2024-pan-cancer-proteogenomics-characterization-tumor-immunity"}, {"label": "Song 2024", "url": "https://hejeong1219.github.io/paperatlas/sources/song-2024-proteogenomic-analysis-reveals-non-small-cell"}]}, {"id": "Q24", "type": "q", "label": "Q24", "title": "CGI methylation 매개 SV → protein 저발현 mechanism (Chen 2026)이 cancer susceptibility gene (CSG) screening에 주는 시사점?", "sec": "C", "secname": "WGS-Proteome integration / pQTL / ppQTL", "color": "#5b86b0", "cited": ["Chen 2026"], "anchor": "DOM::multiomics", "answer": "Chen 2026은 <b>688개 cancer susceptibility gene 중 31개</b>(CDH13/CDKN2A/MSR1/SDHA/SMAD4/SMARCB1 포함)에 LoF germline SV 보유자에서 단백 저발현이 enrich되며, <b>101명(전체 6%)</b> 이 최소 1개 CSG LoF SV를 보유함을 보고합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/chen-2026-global-impact-germline-structural-variation-cancer-proteome\" target=\"_blank\">Chen 2026</a>). CGI methylation 매개 sub-rosa cis-mechanism으로 <b>1,237개 CGI probe</b> FDR<10%, 233/2,686 positive methylation → negative mRNA 방향, 28개 protein concordant(CES1/GGACT/PTDSS2)와 <b>109 enhancer methylation pair (41 CBTN reproducible, p<1E-22)</b> 가 식별되어, CSG screening이 단순 coding SNV·LoF SV에 더해 CGI/enhancer methylation 매개 silencing까지 포함해야 sensitivity가 유지됨을 시사합니다. 한미암 한국인 위암 CSG screening은 (i) WGS Delly ∩ SVABA LoF SV call + (ii) 450K/EPIC methylation array를 보조 modality로 결합 + (iii) MS-based 단백체 evidence 통합하는 3-layer 워크플로를 검토할 수 있겠습니다. 특히 CDH13/CDKN2A/SMAD4/SMARCB1는 한국인 위암 후보 패널에 우선 포함될 만한 유전자로 사료됩니다.", "cites": [{"label": "Chen 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/chen-2026-global-impact-germline-structural-variation-cancer-proteome"}]}, {"id": "Q25", "type": "q", "label": "Q25", "title": "Ancestry-enriched SV/CNA → protein effect (African/Asian/European 특이 gene) 의 precision oncology implication?", "sec": "C", "secname": "WGS-Proteome integration / pQTL / ppQTL", "color": "#5b86b0", "cited": ["Chen 2026", "Xu 2026", "Chang 2026"], "anchor": "DOM::multiomics", "answer": "Chen 2026 1KGP-projection 기반 ancestry 분석에서 <b>69개 concordant cis-regulated gene 중 31개(45%)</b> 가 ancestry-enriched SV로 설명되며, <b>10 African(FSCN1) / 8 Asian(TIGAR) / 13 European(CTSW)</b> 으로 분기됨을 정량합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/chen-2026-global-impact-germline-structural-variation-cancer-proteome\" target=\"_blank\">Chen 2026</a>). SIDT2 등 일부 gene은 ancestry 그 자체만으로 explain되어, ancestry 보정 후 SV effect가 사라지므로 <b>ancestry-aware analysis가 cis-cancer effect 식별에 필수</b>임을 입증합니다. Xu 2026 중국 HER2-low breast 코호트는 TP53 mut + 9p loss가 HER2-low 한정 poor prognosis(HER2-high에서는 비유의)임을 보여 동아시아 cohort 특이 co-occurrence를 제시합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/xu-2026-proteogenomic-characterization-reveals-subtype-specific-therapeutic\" target=\"_blank\">Xu 2026</a>). Chang 2026 Taiwanese GC는 DBAC PAH signature가 TCGA에서는 부재하고 Taiwanese·Japanese cohort에서만 재현됨을 명시합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/chang-2026-integrative-proteogenomics-gastric-cancer-taiwan\" target=\"_blank\">Chang 2026</a>). 한미암 한국인 위암 코호트는 KOVA·KCDC를 ancestry baseline으로 두고, 1KGP East Asian super-population referencing으로 한국 특이 SV/CNA → protein effect를 분리해 precision oncology biomarker 발굴에 검토해 볼 만합니다.", "cites": [{"label": "Chen 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/chen-2026-global-impact-germline-structural-variation-cancer-proteome"}, {"label": "Xu 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/xu-2026-proteogenomic-characterization-reveals-subtype-specific-therapeutic"}, {"label": "Chang 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/chang-2026-integrative-proteogenomics-gastric-cancer-taiwan"}]}, {"id": "Q26", "type": "q", "label": "Q26", "title": "Proteogenomic NMF subtype (PT1-PT4, PS1-PS3 등) vs WGS-based subtype의 임상 prognostic concordance?", "sec": "C", "secname": "WGS-Proteome integration / pQTL / ppQTL", "color": "#5b86b0", "cited": ["Chang 2026", "Xu 2026", "Lee 2026"], "anchor": "DOM::multiomics", "answer": "Chang 2026 Taiwanese GC는 <b>4개 tumour proteome cluster(PT1–PT4) + 5개 immune cluster(IM1–IM5)</b> Sankey 통합에서 PT1-IM3가 <b>stage IV 사망률 초과</b>(분기 p=0.025)를 보이며 PT1↔Bormann type 3(p=0.002), PT2↔HP+(p=0.003), PT3↔diffuse(p=0.02), PT4↔intestinal(p=0.01)으로 단순 WGS·histology 분류와 partial concordance만 유지함을 입증합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/chang-2026-integrative-proteogenomics-gastric-cancer-taiwan\" target=\"_blank\">Chang 2026</a>). Xu 2026 HER2-low breast는 <b>3 proteomic subtype(PS1 estrogen / PS2 angiogenesis / PS3 proliferation+HER2-high-like)</b> 가 IHC HER2-low/HER2-high 단순 분류 위에 별도 prognostic stratification을 추가하고, RWD 14명 항혈관신생 치료 PS2 3/4 CR/PR vs PS1+PS3 1/10으로 임상 분기를 입증합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/xu-2026-proteogenomic-characterization-reveals-subtype-specific-therapeutic\" target=\"_blank\">Xu 2026</a>). Lee 2026 Korean TNBC NMF 5 subtype도 Lehmann 분류와 부분 일치만 보이며 METABRIC 외부 검증(n=258, 76.3% mappable)에서 동일 prognostic pattern을 재현합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/lee-2026-proteogenomic-decoding-chemotherapy-resistance-tnbc\" target=\"_blank\">Lee 2026</a>). 한미암 위암 코호트도 proteogenomic NMF subtype을 WGS-based subtype(예: TCGA STAD 4-class)과 cross-tabulate해 concordance와 추가 prognostic information을 정량할 수 있겠습니다.", "cites": [{"label": "Chang 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/chang-2026-integrative-proteogenomics-gastric-cancer-taiwan"}, {"label": "Xu 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/xu-2026-proteogenomic-characterization-reveals-subtype-specific-therapeutic"}, {"label": "Lee 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/lee-2026-proteogenomic-decoding-chemotherapy-resistance-tnbc"}]}, {"id": "Q27", "type": "q", "label": "Q27", "title": "Driver-rare gene (CSG, low-frequency mutated) 에서 protein-level evidence가 mRNA evidence보다 강한 사례?", "sec": "C", "secname": "WGS-Proteome integration / pQTL / ppQTL", "color": "#5b86b0", "cited": ["Chen 2026", "Zhao 2026", "Sambath 2026"], "anchor": "DOM::multiomics", "answer": "Chen 2026 분석은 364 recurrent SV-altered gene 중 <b>33%(약 120개)가 reverse direction(protein 변화 우세, mRNA 변화 약함)</b> 으로 MS-based proteomics만 cis-effect를 잡아내는 사례를 카탈로그하고, 대표 mRNA·protein concordant LoF locus로 CA8/PTGR1을 명시합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/chen-2026-global-impact-germline-structural-variation-cancer-proteome\" target=\"_blank\">Chen 2026</a>). Zhao 2026 CRLM도 <b>ARG1 protein-only LM ↑ → poor OS T+LM</b>, <b>SOD2 (DepMap CRC/HCC dependency, protein-only) discovery p=0.098 → validation n=87 IHC p=0.0331</b>로 protein-only evidence가 prognostic biomarker로 살아남는 driver-rare 사례를 보고합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/zhao-2026-proteogenomic-characterization-reveals-metabolic-vulnerabilities\" target=\"_blank\">Zhao 2026</a>). Sambath 2026 인도 자궁경부암은 단백체 top5 up SERPINB7/STX3/LBP/EMILIN2/NQO2 중 <b>STX3가 IHC 32명에서 일관 elevated</b>한 protein-level resistance marker로 입증되었으나 RNA-only로는 약한 신호임을 시사합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/sambath-2026-integrated-genomic-proteomic-cervical-cancer-chemoradiation-resistance\" target=\"_blank\">Sambath 2026</a>). 한미암 위암 코호트도 low-frequency mutated gene에서 protein-only direction을 별도 카테고리로 분리해 prognostic discovery에 활용할 수 있겠습니다.", "cites": [{"label": "Chen 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/chen-2026-global-impact-germline-structural-variation-cancer-proteome"}, {"label": "Zhao 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/zhao-2026-proteogenomic-characterization-reveals-metabolic-vulnerabilities"}, {"label": "Sambath 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/sambath-2026-integrated-genomic-proteomic-cervical-cancer-chemoradiation-resistance"}]}, {"id": "Q28", "type": "q", "label": "Q28", "title": "AS event (alternative splicing)의 protein-level validation rate와 cancer-specific AS biology 사례?", "sec": "C", "secname": "WGS-Proteome integration / pQTL / ppQTL", "color": "#5b86b0", "cited": ["Sinitcyn 2023", "Lehe 2026", "Awasthi 2026", "Zhao 2026"], "anchor": "DOM::multiomics", "answer": "Sinitcyn 2023 ENCODE 6 세포주 × 6 protease ultra-deep DDA 분석은 <b>AS event 13,450개 중 34.3%(양방향 6,145개 중 18.6%)가 단백 검출</b>, frame-preserving 64%, XGBoost AUC 0.83(top features: transcript abundance + PSI + frame status; PSI ~33%가 최적)으로 RNA-predicted AS의 protein-level validation rate를 정량합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/sinitcyn-2023-global-detection-human-variants-isoforms-deep-proteome\" target=\"_blank\">Sinitcyn 2023</a>). Lehe 2026 review는 SWATH-DIA 2,964 isoform-specific peptide / Astral DIA 935 AS event/일 / IS-PRM 77 long-read-predicted isoform peptide / 일반 DDA 0–10 AS peptide의 acquisition 매트릭스를 정리합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/lehe-2026-mass-spectrometry-alternative-protein-isoforms-review\" target=\"_blank\">Lehe 2026</a>). Awasthi 2026 PEXMap는 cancer pooled proteome 1.15M peptide에서 <b>EGFR truncated NP_958441.1</b>(EXj 17–19 supported, kinase-domain peptide 부재 — Lynch/Paez 2004 exon-19 deletion 정합)과 <b>FLNA exon-30 skipped NP_001447.2</b> 사례를 EXj 증거로 입증합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/awasthi-2026-pexmap-proteogenomic-exon-isoform-mapping\" target=\"_blank\">Awasthi 2026</a>). Zhao 2026 CRLM은 226,107 AS event 중 148개가 C1/C2 cluster 차이 / 98개가 prognostic(KHK/RPP21/U2AF1L4 top)이며 GRB7 AS와 splicing factor C2 ↑(DHX9/PRPF8/SNRPD1) cancer dependency 연관을 보고합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/zhao-2026-proteogenomic-characterization-reveals-metabolic-vulnerabilities\" target=\"_blank\">Zhao 2026</a>). 한미암 위암 코호트에서 long-read RNA-seq + DIA-MS + PEXMap을 결합해 cancer-specific AS isoform의 protein-level evidence를 추적할 수 있겠습니다.", "cites": [{"label": "Sinitcyn 2023", "url": "https://hejeong1219.github.io/paperatlas/sources/sinitcyn-2023-global-detection-human-variants-isoforms-deep-proteome"}, {"label": "Lehe 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/lehe-2026-mass-spectrometry-alternative-protein-isoforms-review"}, {"label": "Awasthi 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/awasthi-2026-pexmap-proteogenomic-exon-isoform-mapping"}, {"label": "Zhao 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/zhao-2026-proteogenomic-characterization-reveals-metabolic-vulnerabilities"}]}, {"id": "Q29", "type": "q", "label": "Q29", "title": "Pan-cancer CPTAC scale의 driver-to-functional-state landscape (Li 2023, Petralia 2024, Savage 2024)을 한미암 위암 코호트에 어떻게 transfer?", "sec": "C", "secname": "WGS-Proteome integration / pQTL / ppQTL", "color": "#5b86b0", "cited": ["Li 2023", "Petralia 2024", "Savage 2024", "Chang 2026"], "anchor": "DOM::multiomics", "answer": "Li 2023 pan-cancer proteogenomics는 driver cis/trans-effect 정량과 sequence-based kinase activity convergence를 제시해 한미암 위암 코호트의 driver call을 동일 framework로 cis/trans · kinase profile · convergence 3 layer로 표현하는 reference로 활용 가능합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/li-2023-pan-cancer-proteogenomics-connects-oncogenic-drivers\" target=\"_blank\">Li 2023</a>). Petralia 2024 7 immune subtype(`CD8+/IFNG+` 외 6) + STK11/KEAP1/BAP1/CASP8 driver-immune association + OAK atezolizumab arm validation은 위암 ICI 반응 예측의 immune-context branch로 transfer 가능합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/petralia-2024-pan-cancer-proteogenomics-characterization-tumor-immunity\" target=\"_blank\">Petralia 2024</a>). Savage 2024 2,863 druggable protein/synthetic lethality/공공 neoantigen(mutant KRAS peptide) prioritization 워크플로는 LinkedOmicsKB·target portal을 직접 활용해 위암 단백체에 druggable target landscape를 매핑할 수 있습니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/savage-2024-pan-cancer-proteogenomics-expands-landscape-therapeutic\" target=\"_blank\">Savage 2024</a>). Chang 2026 Taiwanese GC는 동일 framework가 위암에서 실제 작동함을 보여준 동아시아 검증 사례입니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/chang-2026-integrative-proteogenomics-gastric-cancer-taiwan\" target=\"_blank\">Chang 2026</a>). 한미암은 (i) CPTAC 동일 파이프라인 채택(MSFragger + TMT-Integrator + reference centering + BCM phosphosite reannotation), (ii) 위암 7-cancer (Chang) NMF cluster mapping, (iii) Savage druggable target portal cross-link 3단계로 transfer 설계를 검토할 수 있겠습니다.", "cites": [{"label": "Li 2023", "url": "https://hejeong1219.github.io/paperatlas/sources/li-2023-pan-cancer-proteogenomics-connects-oncogenic-drivers"}, {"label": "Petralia 2024", "url": "https://hejeong1219.github.io/paperatlas/sources/petralia-2024-pan-cancer-proteogenomics-characterization-tumor-immunity"}, {"label": "Savage 2024", "url": "https://hejeong1219.github.io/paperatlas/sources/savage-2024-pan-cancer-proteogenomics-expands-landscape-therapeutic"}, {"label": "Chang 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/chang-2026-integrative-proteogenomics-gastric-cancer-taiwan"}]}, {"id": "Q30", "type": "q", "label": "Q30", "title": "Long-read WGS (PacBio, Nanopore) vs short-read의 SV calling gap이 cancer proteome에서 missed cis-effect로 나타나는 추정?", "sec": "C", "secname": "WGS-Proteome integration / pQTL / ppQTL", "color": "#5b86b0", "cited": ["Chen 2026", "Awasthi 2026"], "anchor": "DOM::multiomics", "answer": "Chen 2026은 paired SV caller(Delly v3.1.1 ∩ SVABA v1.2.0)가 <b>short-read 한계로 일부 LoF SV가 잘림</b>(paired caller LoF 일부 누락 + Delly/SVABA short-read limitation)을 한계로 본문 명시하며, <b>long-read WGS는 적용되지 않음</b>을 분명히 합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/chen-2026-global-impact-germline-structural-variation-cancer-proteome\" target=\"_blank\">Chen 2026</a>). Ramberger 2024 multiple myeloma는 <b>nanopore WGS(CNV) + TMT phosphoproteomics</b>로 CNA-기능상태 연결과 phosphoproteomic risk stratification 사례를 제시해 long-read WGS의 proteogenomic integration potential을 시사합니다 ([Ramberger 2024 (analyses page reference via topic hub)](../topics/cancer-multiomics-literature.md)). Awasthi 2026 PEXMap는 long-read RNA-seq 기반 isoform DB를 활용해 EGFR truncated/FLNA exon-30 skipped 같은 cancer-specific isoform을 EXj 단위로 supported, short-read 기반 reference에서 놓치는 isoform-level proteomic evidence를 회수합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/awasthi-2026-pexmap-proteogenomic-exon-isoform-mapping\" target=\"_blank\">Awasthi 2026</a>). 한미암 위암 코호트에서 PacBio HiFi 또는 ONT long-read WGS를 일부 환자(예: EGFR/MYC/ERBB2 high amplification, 의심 ecDNA 환자)에 한정 적용하면 short-read 미검출 SV → protein cis-effect gap을 정량할 수 있겠습니다.", "cites": [{"label": "Chen 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/chen-2026-global-impact-germline-structural-variation-cancer-proteome"}, {"label": "Awasthi 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/awasthi-2026-pexmap-proteogenomic-exon-isoform-mapping"}]}, {"id": "Q31", "type": "q", "label": "Q31", "title": "Visium / Xenium / CosMx / Open-ST의 sensitivity, specificity, spatial resolution 차이와 spillover/off-target probe binding 문제?", "sec": "D", "secname": "Spatial / single-cell multi-omics", "color": "#9a7fbf", "cited": ["Bilous 2026", "Hallinan 2026", "Janesick 2023"], "anchor": "DOM::multiomics", "answer": "Bilous 2026 Nat Methods는 10x Xenium 공간전사체 플랫폼에서 transcript spillover가 TME 해석을 왜곡할 수 있음을 체계적으로 정량하고 <b>RCTD 기반 signal purification 방법 SPLIT</b>으로 cell-type purity와 tumor-proximal T-cell exhaustion signal을 개선합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/bilous-2026-xenium-sensitivity-specificity-signal-contamination\" target=\"_blank\">Bilous 2026</a>). Hallinan 2026 eLife는 Off-target Probe Tracker(OPT) 도구로 Xenium <b>human breast 313-gene panel 중 14개 이상이 protein-coding gene off-target binding 영향</b>을 받음을 식별하고, 동일 tumor block의 Xenium·Visium CytAssist·3' scRNA-seq 비교로 일부 유전자 신호가 target+off-target aggregate를 반영함을 입증합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/hallinan-2026-evidence-off-target-probe-binding-affecting\" target=\"_blank\">Hallinan 2026</a>). Janesick 2023 Nat Commun은 FFPE human breast에서 Xenium(in situ) + Visium(spot) + 3' scRNA-seq 통합으로 TME 이질성을 분석하는 reference workflow를 제공합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/janesick-2023-high-resolution-mapping-tumor-microenvironment\" target=\"_blank\">Janesick 2023</a>). 한미암 위암 spatial transcriptomics 적용 시 (i) custom panel 설계 단계 OPT QC, (ii) Xenium·Visium·scRNA-seq cross-platform validation, (iii) SPLIT 같은 spillover correction을 표준 워크플로로 검토할 수 있겠습니다.", "cites": [{"label": "Bilous 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/bilous-2026-xenium-sensitivity-specificity-signal-contamination"}, {"label": "Hallinan 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/hallinan-2026-evidence-off-target-probe-binding-affecting"}, {"label": "Janesick 2023", "url": "https://hejeong1219.github.io/paperatlas/sources/janesick-2023-high-resolution-mapping-tumor-microenvironment"}]}, {"id": "Q32", "type": "q", "label": "Q32", "title": "Spatial transcriptomics → spatial proteomics → spatial multi-omics로의 stepwise transition: 각 단계의 신호 보존도?", "sec": "D", "secname": "Spatial / single-cell multi-omics", "color": "#9a7fbf", "cited": ["Yeo 2026", "Wu 2026", "Sussman 2026", "Barone 2026"], "anchor": "DOM::multiomics", "answer": "Yeo 2026 cHL은 <b>spatial proteomics + spatial transcriptomics 결합</b>으로 EBV+/EBV- subtype 차이를 cellular neighborhood 단위로 정량하고, HRS proximity·LMP1 발현 distance-dependent로 CD8 T cell terminal exhaustion이 강화됨을 입증합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/yeo-2026-epstein-barr-virus-orchestrates-spatial-reorganization\" target=\"_blank\">Yeo 2026</a>). Wu 2026 iCLAP는 TSA 기반 iterative amplification + fluorophore inactivation으로 FFPE에서 <b>40개 이상 marker 통합 검출</b>이 가능하며 IMC·CyCIF·CODEX와 결합되어 low-abundance protein(transcription factor·secreted protein·senescence marker)을 in situ로 잡아냅니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/wu-2026-iclap-innovative-method-integrable-detection-low\" target=\"_blank\">Wu 2026</a>). Sussman 2026 pediatric HGG는 snRNA + snATAC + WGS + CODEX spatial proteomics 4-modality longitudinal atlas 사례를 제시합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/sussman-2026-longitudinal-single-cell-spatial-multiomic-atlas\" target=\"_blank\">Sussman 2026</a>). Barone 2026 lung adenocarcinoma는 spatial proteomics에서 CD4+AICL+와 CD8+KLRF1+가 non-tumor region에 enrich되며 tumor 내부에서 감소함을 정량해 multi-omics layer 간 신호 일치성을 입증합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/barone-2026-aicl-klrf-axis-supports-cell-communication\" target=\"_blank\">Barone 2026</a>). 한미암 위암 다층 공간 분석은 spatial transcriptomics → CODEX/iCLAP proteomics → snRNA-seq 통합 stepwise 설계로 layer 간 신호 보존도를 검토할 수 있겠습니다.", "cites": [{"label": "Yeo 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/yeo-2026-epstein-barr-virus-orchestrates-spatial-reorganization"}, {"label": "Wu 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/wu-2026-iclap-innovative-method-integrable-detection-low"}, {"label": "Sussman 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/sussman-2026-longitudinal-single-cell-spatial-multiomic-atlas"}, {"label": "Barone 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/barone-2026-aicl-klrf-axis-supports-cell-communication"}]}, {"id": "Q33", "type": "q", "label": "Q33", "title": "Spatial cell ecotype (TME state, immune cluster) 정의가 prognosis 예측력에 추가하는 정보량?", "sec": "D", "secname": "Spatial / single-cell multi-omics", "color": "#9a7fbf", "cited": ["Chang 2026", "Petralia 2024"], "anchor": "DOM::multiomics", "answer": "Zhang 2026 Nature(Spatial EcoTyper / Liquid EcoTyper)는 다수 암종의 공간전사체와 단일세포 데이터를 통합해 <b>9개 TME spatial ecotype</b>을 정의하고, Liquid EcoTyper로 plasma cfDNA methylation에서 회수해 <b>melanoma ICI response 예측</b>에 활용한 사례를 제시합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/zhang-2026-non-invasive-tumour-microenvironment-spatial-ecotypes\" target=\"_blank\">Zhang 2026 EcoTypes</a>). Chang 2026 Taiwanese GC는 <b>4 proteome cluster(PT1–PT4) + 5 immune cluster(IM1–IM5)</b> Sankey 통합에서 PT1-IM3가 stage IV 사망률 초과(p=0.025)이며 단일 PT1만 보면 잡히지 않는 prognostic stratification을 추가함을 입증합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/chang-2026-integrative-proteogenomics-gastric-cancer-taiwan\" target=\"_blank\">Chang 2026</a>). Petralia 2024 7 immune subtype은 CPTAC pan-cancer 1,056 tumor에서 OAK atezolizumab arm에서 `CD8+/IFNG+` subtype이 PFS benefit과 연관됨을 입증합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/petralia-2024-pan-cancer-proteogenomics-characterization-tumor-immunity\" target=\"_blank\">Petralia 2024</a>). 한미암 위암 코호트에서 single-cell + spatial deconvolution으로 spatial ecotype을 정의하고 PT × IM × cfDNA Liquid EcoTyper의 3-layer 통합을 검토하면 prognosis 예측력 추가 정보량을 정량할 수 있겠습니다.", "cites": [{"label": "Zhang 2026 EcoTypes", "url": "https://hejeong1219.github.io/paperatlas/sources/zhang-2026-non-invasive-tumour-microenvironment-spatial-ecotypes"}, {"label": "Chang 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/chang-2026-integrative-proteogenomics-gastric-cancer-taiwan"}, {"label": "Petralia 2024", "url": "https://hejeong1219.github.io/paperatlas/sources/petralia-2024-pan-cancer-proteogenomics-characterization-tumor-immunity"}]}, {"id": "Q34", "type": "q", "label": "Q34", "title": "Single-cell + spatial 통합으로 tumor heterogeneity의 transcriptional vs spatial axis를 어떻게 layer?", "sec": "D", "secname": "Spatial / single-cell multi-omics", "color": "#9a7fbf", "cited": ["Wang 2026", "Yang 2026", "Quail 2026"], "anchor": "DOM::multiomics", "answer": "Wang 2026 cSCLC는 multi-region WES(95 region/16명) + ST(6명) + snRNA-seq(12명) 통합으로 동일 환자 내 SCLC/NSCLC 성분이 <b>monoclonal origin은 공유하지만 mutation·CNA 패턴은 분기</b>하며 COL11A1+ CAF가 종양 도메인 경계에서 immune exclusion을 매개함을 보여줍니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/wang-2026-spatial-multi-omics-unveils-monoclonal-origin\" target=\"_blank\">Wang 2026</a>). Zhang 2026 cross-species CRC atlas는 인간 CRC와 Apc-min 생쥐의 N-A-C 단계 scRNA + ST 통합으로 <b>EFNA1-EPHA4 axis가 TAM immunosuppression + 종양 stemness를 매개</b>함을 도출합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/zhang-2026-cross-species-single-cell-spatial-transcriptomic\" target=\"_blank\">Zhang 2026 CRC</a>). Yang 2026 NSCLC 53명은 snRNA-seq + GeoMx DSP + CosMx SMI 통합으로 IGHG1+ MEC와 myCAF가 invasive front에서 r=0.900으로 공간 co-localize, MIF-CD74/APP-CD74 axis가 brain metastasis HR=5.495를 매개함을 정량합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/yang-2026-ighg-malignant-epithelial-cell-mycaf-crosstalk\" target=\"_blank\">Yang 2026</a>). Quail 2026 Cell review는 cancer ecosystem을 분자→세포→조직→organismal→temporal scale로 통합하는 framework를 제시합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/quail-2026-cancer-ecosystems-dynamic-interplay-across-scales\" target=\"_blank\">Quail 2026</a>). 한미암 위암 코호트는 단일세포 transcriptional state × spatial niche 두 축을 layer해 heterogeneity 좌표를 정의할 수 있겠습니다.", "cites": [{"label": "Wang 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/wang-2026-spatial-multi-omics-unveils-monoclonal-origin"}, {"label": "Zhang 2026 CRC", "url": "https://hejeong1219.github.io/paperatlas/sources/zhang-2026-cross-species-single-cell-spatial-transcriptomic"}, {"label": "Yang 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/yang-2026-ighg-malignant-epithelial-cell-mycaf-crosstalk"}, {"label": "Quail 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/quail-2026-cancer-ecosystems-dynamic-interplay-across-scales"}]}, {"id": "Q35", "type": "q", "label": "Q35", "title": "비실측 spatial이 없는 sample에서 histology + foundation model로 spatial gene expression을 imputing하는 정확도?", "sec": "D", "secname": "Spatial / single-cell multi-omics", "color": "#9a7fbf", "cited": ["Tran 2026", "Cui 2026", "Hoang 2024"], "anchor": "DOM::multiomics", "answer": "Tran 2026 Phoenix는 routine H&E 병리 슬라이드에서 Xenium-like <b>single-cell spatial gene expression을 deep learning foundation model로 imputing</b>해, 대규모 병리 아카이브를 치료반응·예후·공간 TME biomarker 탐색 자원으로 전환하는 pan-cancer virtual spatial transcriptomics framework를 제시합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/tran-2026-phoenix-pan-cancer-virtual-spatial-transcriptomics\" target=\"_blank\">Tran 2026</a>). Cui 2026 Haiku는 H&E + mIF + clinical text를 tri-modal contrastive foundation model로 정렬해 cross-modal retrieval, 임상 예측, zero-shot biomarker 추론을 동시에 강화합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/cui-2026-haiku-tri-modal-spatial-biology-histology\" target=\"_blank\">Cui 2026</a>). Hoang 2024 Nat Cancer는 deep learning framework로 histopathology image에서 <b>imputed transcriptomics</b>를 거쳐 cancer treatment response를 예측하는 architecture를 제시해 spatial-blind sample에서도 transcriptional signal 회수가 가능함을 시사합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/hoang-2024-deep-learning-framework-predict-cancer\" target=\"_blank\">Hoang 2024</a>). 한미암 위암 코호트의 large 병리 archive(FFPE H&E)에 Phoenix·Haiku 같은 모델을 적용해 비실측 spatial transcriptomics를 보강하는 방안을 검토할 수 있겠습니다.", "cites": [{"label": "Tran 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/tran-2026-phoenix-pan-cancer-virtual-spatial-transcriptomics"}, {"label": "Cui 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/cui-2026-haiku-tri-modal-spatial-biology-histology"}, {"label": "Hoang 2024", "url": "https://hejeong1219.github.io/paperatlas/sources/hoang-2024-deep-learning-framework-predict-cancer"}]}, {"id": "Q36", "type": "q", "label": "Q36", "title": "Spatial multi-omics가 chemoresistance (CAF, POSTN+ CAF, IGHG1+ epithelial-myCAF crosstalk 등)를 어떻게 dissect?", "sec": "D", "secname": "Spatial / single-cell multi-omics", "color": "#9a7fbf", "cited": ["Sakai 2026", "Yang 2026", "Wang 2026"], "anchor": "DOM::multiomics", "answer": "Sakai 2026 직장암 single-cell spatial multiomics는 <b>POSTN+ CAF가 chemoradiotherapy resistance</b>의 핵심 driver임을 분리해내며 stromal cell-tumour interaction을 spatial 단위로 정의합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/sakai-2026-postn-cafs-chemoradiotherapy-resistance-rectal-cancer\" target=\"_blank\">Sakai 2026</a>). Yang 2026 NSCLC 53명은 IGHG1+ malignant epithelial cell-myCAF crosstalk이 invasive front에서 MIF-CD74/APP-CD74 axis로 brain metastasis HR=5.495를 매개함을 spatial multiomics로 입증합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/yang-2026-ighg-malignant-epithelial-cell-mycaf-crosstalk\" target=\"_blank\">Yang 2026</a>). Wang 2026 cSCLC는 COL11A1+ aggressive fibroblast subtype이 종양 도메인 경계를 형성해 immune exclusion을 매개함을 보고합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/wang-2026-spatial-multi-omics-unveils-monoclonal-origin\" target=\"_blank\">Wang 2026</a>). Agirre-Lizaso 2026 iCCA는 MARCO+ TAM이 TH2-skewed immune response + collagen deposition + worse survival을 매개하며 Marco-/-/anti-MARCO 항체 처치로 종양 성장 억제됨을 입증해 macrophage-driven chemoresistance niche를 dissect하는 사례를 제시합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/agirrelizaso-2026-marco-promotes-cholangiocarcinogenesis-inducing-immunosuppression-its\" target=\"_blank\">Agirre-Lizaso 2026</a>). 한미암 위암 spatial multiomics 분석에서 CAF subtype(POSTN+/COL11A1+/myCAF) + TAM subtype(MARCO+)를 spatial niche 단위로 매핑하면 chemoresistance 메커니즘 가설을 검토할 수 있겠습니다.", "cites": [{"label": "Sakai 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/sakai-2026-postn-cafs-chemoradiotherapy-resistance-rectal-cancer"}, {"label": "Yang 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/yang-2026-ighg-malignant-epithelial-cell-mycaf-crosstalk"}, {"label": "Wang 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/wang-2026-spatial-multi-omics-unveils-monoclonal-origin"}, {"label": "Agirre-Lizaso 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/agirrelizaso-2026-marco-promotes-cholangiocarcinogenesis-inducing-immunosuppression-its"}]}, {"id": "Q37", "type": "q", "label": "Q37", "title": "CAR-T efficacy + spatial transcriptomics — TIL infiltration pattern과 임상 outcome의 spatial signature?", "sec": "D", "secname": "Spatial / single-cell multi-omics", "color": "#9a7fbf", "cited": ["Zou 2026"], "anchor": "DOM::multiomics", "answer": "Wang 2026 CD19/20 CAR-T phase I/II 32명 코호트(R/R B-NHL, NCT04723914)는 best ORR 74%/CR 58%, mPFS 6.8 mo, mOS 22.1 mo, CAR-T expansion peak day 7–17, long-term responder persistence 500일 초과의 임상 결과를 보였고, pretreatment biopsy 5명의 spatial single-cell transcriptomics에서 <b>두 가지 tumor architecture</b>를 식별합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/wang-2026-clinical-outcomes-spatial-transcriptomic-profiles-car\" target=\"_blank\">Wang 2026 CAR-T</a>). (1) <b>B-cell-dominant phenotype</b>에서는 malignant B cell의 apoptotic competence가 durable response의 결정인자, (2) <b>fibroblast/monocyte/macrophage-enriched phenotype</b>에서는 chemokine-rich T-cell-permissive microenvironment가 durable response의 결정인자임을 보여, dual-axis stratification framework를 제시합니다. Normal LDH 환자에서 response rate가 더 높아 baseline LDH가 보조 stratification factor로 시사됩니다. Zou 2026 commentary는 NSCLC ICI 효능 예측에서 CD8+ TIL <b>tumor nest proximity</b>가 aggregate density보다 우월하며 CD73 upregulation 포함 3-variable spatial composite가 PD-L1보다 substantial하게 더 잘 예측함을 정리합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/zou-2026-understanding-immune-checkpoint-inhibitor-efficacy-through\" target=\"_blank\">Zou 2026</a>). 한미암 위암 CAR-T·면역치료 후보군에서도 pretreatment biopsy spatial profiling으로 tumor architecture를 분류하고 outcome 결정인자를 dual-axis로 평가하는 설계를 참고할 수 있겠습니다.", "cites": [{"label": "Wang 2026 CAR-T", "url": "https://hejeong1219.github.io/paperatlas/sources/wang-2026-clinical-outcomes-spatial-transcriptomic-profiles-car"}, {"label": "Zou 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/zou-2026-understanding-immune-checkpoint-inhibitor-efficacy-through"}]}, {"id": "Q38", "type": "q", "label": "Q38", "title": "Patient-derived organoid + spatial multi-omics가 treatment response 예측에 주는 추가 정보?", "sec": "D", "secname": "Spatial / single-cell multi-omics", "color": "#9a7fbf", "cited": ["Lee 2026", "Xu 2026", "Zhao 2026"], "anchor": "DOM::multiomics", "answer": "Lee 2026 Korean TNBC는 patient-derived organoid <b>SBO-72</b>(IRB 4-2023-0098)에서 barasertib(10 nM Aurora B inhibitor) + paclitaxel 시너지를 MDA-MB-468·HCC1937와 함께 검증해 phospho-driven target hypothesis(AURKB)를 PDO-level functional readout으로 closing the loop합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/lee-2026-proteogenomic-decoding-chemotherapy-resistance-tnbc\" target=\"_blank\">Lee 2026</a>). Xu 2026 HER2-low breast는 17개 patient-derived organoid (PDO)에서 PS1↑tamoxifen·toremifen / PS2↑bevacizumab·apatinib / PS3↑trastuzumab·T-DM1로 <b>subtype-specific drug response를 PDO에서 직접 검증</b>하고, RWD 14명 anti-angiogenic 코호트 PS2 3/4 CR/PR vs PS1+PS3 1/10으로 RWD validation까지 연결합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/xu-2026-proteogenomic-characterization-reveals-subtype-specific-therapeutic\" target=\"_blank\">Xu 2026</a>). Zhao 2026 CRLM KAP organoid(Villin-CreERT2; Kras-LSL-G12D; Apc-min/+; Trp53-flox/flox) intrasplenic 모델은 Shmt1 KD ↓liver metastasis, NDRG1 S330A 변이도 ↓liver metastasis로 mechanistic vulnerability를 검증합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/zhao-2026-proteogenomic-characterization-reveals-metabolic-vulnerabilities\" target=\"_blank\">Zhao 2026</a>). 한미암 위암 코호트에서 PDO + 단백체/인산화단백체 + spatial multiomics 결합으로 subtype-specific drug sensitivity를 검증하는 closed-loop framework를 참고할 수 있겠습니다.", "cites": [{"label": "Lee 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/lee-2026-proteogenomic-decoding-chemotherapy-resistance-tnbc"}, {"label": "Xu 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/xu-2026-proteogenomic-characterization-reveals-subtype-specific-therapeutic"}, {"label": "Zhao 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/zhao-2026-proteogenomic-characterization-reveals-metabolic-vulnerabilities"}]}, {"id": "Q39", "type": "q", "label": "Q39", "title": "Spatial deconvolution algorithm (GraphST, Cell2location, RCTD, ultra-precision deconvolution) 비교?", "sec": "D", "secname": "Spatial / single-cell multi-omics", "color": "#9a7fbf", "cited": ["Long 2023", "Bilous 2026"], "anchor": "DOM::multiomics", "answer": "Xu 2026 UCASpatial(Shannon entropy weighting + WNNLS)은 simulated ST 750 spot 벤치마크에서 median RMSE 0.051로 <b>RCTD 0.058 (10%↓), SPOTlight 0.066 (21%↓), CARD/Spotiphy 0.075 (31%↓), cell2location 0.081 (36%↓), stereoscope 0.080 (35%↓)</b> 대비 일관 우월하며, fine-grained 20개 cell subpopulation reference 조건과 5~20 cells/spot 범위에서도 robust한 성능을 보고합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/xu-2026-ultra-precision-deconvolution-spatial-transcriptomics-decodes\" target=\"_blank\">Xu 2026 UCASpatial</a>). Long 2023 GraphST는 graph neural network + self-supervised contrastive learning으로 spatial clustering·integration·deconvolution 3개 task를 동시에 처리하며 기존 method보다 우월함을 보고합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/long-2023-spatially-informed-clustering-integration-deconvolution\" target=\"_blank\">Long 2023</a>). Bilous 2026은 RCTD 기반 <b>SPLIT signal purification</b>으로 Xenium spillover를 보정해 cell-type purity·tumor-proximal T-cell exhaustion signal을 개선하는 reference를 추가합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/bilous-2026-xenium-sensitivity-specificity-signal-contamination\" target=\"_blank\">Bilous 2026</a>). 한미암 위암 spatial 분석은 UCASpatial(low-abundance immune subset 우월) → GraphST(다중 task 통합) → SPLIT(spillover correction)의 다단계 layer로 deconvolution 결과 신뢰성을 정량할 수 있겠습니다.", "cites": [{"label": "Xu 2026 UCASpatial", "url": "https://hejeong1219.github.io/paperatlas/sources/xu-2026-ultra-precision-deconvolution-spatial-transcriptomics-decodes"}, {"label": "Long 2023", "url": "https://hejeong1219.github.io/paperatlas/sources/long-2023-spatially-informed-clustering-integration-deconvolution"}, {"label": "Bilous 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/bilous-2026-xenium-sensitivity-specificity-signal-contamination"}]}, {"id": "Q40", "type": "q", "label": "Q40", "title": "Pediatric brain tumor / 소아 cancer longitudinal spatial atlas의 design lesson과 성인 cohort 적용 가능성?", "sec": "D", "secname": "Spatial / single-cell multi-omics", "color": "#9a7fbf", "cited": ["Sussman 2026", "Chen 2026"], "anchor": "DOM::multiomics", "answer": "Sussman 2026 pediatric high-grade glioma 16명 longitudinal atlas는 <b>snRNA-seq(400,000+ cells) + snATAC-seq(110,000+ cells, 평균 2,280 gene/19,094 unique fragment) + WGS + CODEX spatial proteomics</b>를 1차 절제·재발/진행·autopsy 3 timepoint에 결합해, post-therapy interferon/oligodendrocyte/myeloid shift와 in vitro Danusertib 같은 malignant cell-intrinsic target까지 검증한 closed-loop discovery 사례입니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/sussman-2026-longitudinal-single-cell-spatial-multiomic-atlas\" target=\"_blank\">Sussman 2026</a>). Chen 2026 germline SV 연구도 <b>CBTN(Children's Brain Tumor Network)</b> cohort에서 41개 enhancer-methylation SV가 p<1E-22로 reproduce되어 성인 cancer에서 발견된 germline SV cis-mechanism이 소아·희귀암으로 transfer 가능함을 입증합니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/chen-2026-global-impact-germline-structural-variation-cancer-proteome\" target=\"_blank\">Chen 2026</a>). Wang 2026 CAR-T B-NHL 코호트(성인)도 longitudinal sampling + spatial 결합의 효용성을 보여줍니다 (<a href=\"https://hejeong1219.github.io/paperatlas/sources/wang-2026-clinical-outcomes-spatial-transcriptomic-profiles-car\" target=\"_blank\">Wang 2026 CAR-T</a>). 한미암 위암 코호트도 1차 진단 → 치료 후 reassessment → progression/autopsy 3 timepoint longitudinal sampling 설계와 snRNA + snATAC + WGS + spatial proteomics multi-modality framework를 참고할 수 있겠습니다.", "cites": [{"label": "Sussman 2026", "url": "https://hejeong1219.github.io/paperatlas/sources/sussman-2026-longitudinal-single-cell-spatial-multiomic-atlas"}, {"label": "Chen 2026", "url": "ht
